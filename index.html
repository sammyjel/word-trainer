function mcqHTML(qs, key){
  return qs.map((q,i) => `<div class="qblock" data-q="${i}"><div class="qq">${i+1}. ${esc(q.q)}</div>
    <div class="opts">${q.options.map((o,j) => `<button class="opt" data-key="${key}" data-q="${i}" data-o="${j}">${esc(o)}</button>`).join('')}</div>
    <div class="why" hidden></div></div>`).join('');
}
function wireMCQ(root, qs, key, onDone){
  const st = P(lessonN)[key] = P(lessonN)[key] || {};
  st.ans = st.ans || {};
  const paint = () => {
    root.querySelectorAll('.qblock').forEach(b => {
      const i = +b.dataset.q, a = st.ans[i];
      if (a === undefined) return;
      b.querySelectorAll('.opt').forEach(o => { o.disabled = true; const j = +o.dataset.o;
        if (j === qs[i].answer) o.classList.add('right'); else if (j === a) o.classList.add('wrong'); });
      const w = b.querySelector('.why'); w.hidden = false; w.textContent = (a === qs[i].answer ? '✓ ' : '✗ ') + qs[i].why;
    });
    const done = Object.keys(st.ans).length;
    if (done === qs.length){ st.score = qs.filter((q,i) => st.ans[i] === q.answer).length; st.total = qs.length; save(); onDone && onDone(); refreshTicks(); }
  };
  root.addEventListener('click', e => {
    const o = e.target.closest('.opt[data-key="'+key+'"]'); if (!o || o.disabled) return;
    st.ans[+o.dataset.q] = +o.dataset.o; save(); paint();
  });
  paint();
}

function isDone(n, id){
  const p = prog[n] || {};
  if (id === 'talk') return !!(p.talk && (p.talk.tries || p.talk.conf));
  if (id === 'speak') return (p.speak && p.speak.recs || 0) >= 1;
  if (id === 'words') return !!(p.words);
  if (id === 'accents') return !!(p.accents && p.accents.total);
  return !!(p[id] && p[id].total);
}

    $('#tb').textContent = p.talk.best + 's'; $('#rb').textContent = best.s + 's'; $('#tr').textContent = p.talk.tries;
    const msg = secs >= 60 ? '🎉 60 seconds! You did not stop. Amazing!' : secs > rec0 && rec0 ? `🎉 New record: ${secs} seconds!` : secs > prevBest && prevBest ? `👏 Better than your last try: ${secs} seconds!` : `👍 ${secs} seconds. Try again, and you'll go longer!`;
    $('#out').insertAdjacentHTML('afterbegin', `<div class="celebrate">${msg}</div>`);
  };
  const ui = {msg: m => $('#out').innerHTML = `<div class="note">${m}</div>`, tick: () => {}, done: blob => {
      const url = URL.createObjectURL(blob);
      $('#out').insertAdjacentHTML('beforeend', `<audio controls src="${url}" style="margin-top:8px"></audio><div class="row" style="margin-top:6px"><button class="btn good" id="sendRec">📤 Send this to my teacher</button></div>`);

  $('#go').onclick = () => {
    stopSpeech(); stopRec(); $('#out').innerHTML = ''; $('#go').disabled = true; $('#tm').hidden = false;
    let t = 15; phase = 'think'; $('#tm').textContent = '💭 ' + t;
    clearInterval(recTimer); recTimer = setInterval(() => { t--; $('#tm').textContent = '💭 ' + t;
      if (t <= 0){ clearInterval(recTimer); phase = 'talk'; t0 = Date.now(); $('#stopRow').hidden = false;
        startRec('talk', 60, {...ui, tick: s => { $('#tm').textContent = '🔴 ' + (60 - s) + 's'; if (s <= 0) finish(); }}); } }, 1000);
  };
  $('#stopped').onclick = finish;
  st.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.say){ stopSpeech(); say(b.dataset.say, 'en-GB'); }
    if (b.dataset.r){ p.talk.conf = +b.dataset.r; save(); refreshTicks(); renderStage(); }
    if (b.id === 'mbtn'){ mdone[L.week.week] = today; store.set('hw-missions', mdone); $('#mdone').innerHTML = '<div class="celebrate">🎉 Mission complete! Well done!</div>'; renderSum(); }

/* ---------- ACCENTS ---------- */
const toks = s => s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).filter(Boolean);
function lcsMark(ref, got){
  const a = toks(ref), b = toks(got), m = a.length, n = b.length, dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for (let i=m-1;i>=0;i--) for (let j=n-1;j>=0;j--) dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const hit = new Array(m).fill(false); let i=0,j=0;
  while (i<m && j<n){ if (a[i]===b[j]){ hit[i]=true; i++; j++; } else if (dp[i+1][j] >= dp[i][j+1]) i++; else j++; }
  return {words: ref.split(/\s+/), hit, ok: hit.filter(Boolean).length, total: m};
}
function renderAccents(st){
  const L = getL(lessonN), S = L.accents.sentences, p = P(lessonN);
  p.accents = p.accents || {res: {}};
  st.innerHTML = `${how('English sounds different in different countries. Listen to each sentence and write exactly what you hear. Then guess the accent.', 'Her cümleyi dinleyin, duyduğunuzu yazın, sonra aksanı tahmin edin.')}
    ${S.map((s,i) => `<div class="acc" data-i="${i}"><div class="row"><b>${i+1}.</b><button class="btn primary" data-play="${i}">▶ Listen</button><button class="btn ghost" data-slow="${i}">🐢 Slow</button></div>
      <input type="text" data-in="${i}" placeholder="Write what you hear…" autocomplete="off" autocapitalize="sentences">
      <div class="row"><button class="btn ghost" data-chk="${i}">Check</button></div><div data-out="${i}"></div></div>`).join('')}
    <div id="res"></div>`;
  const paint = i => {
    const r = p.accents.res[i]; if (!r) return; const s = S[i], m = lcsMark(s.text, r.typed);
    const box = st.querySelector(`[data-out="${i}"]`), inp = st.querySelector(`[data-in="${i}"]`); inp.value = r.typed;
    const guessable = hasAccent(s.accent);
    box.innerHTML = `<div class="diff">${m.words.map((w,k) => `<span class="${m.hit[k] ? 'ok' : 'miss'}">${esc(w)}</span>`).join(' ')}</div>
      <div class="small muted">${m.ok}/${m.total} words correct</div>` + (guessable ? (r.guess ? `<div class="small"><b>${r.guess === s.accent ? '✓' : '✗'} Accent: ${ACC_NAME[s.accent]}</b>${r.guess !== s.accent ? ' (you said '+ACC_NAME[r.guess]+')' : ''}</div>`
      : `<div class="small">Which accent was it?</div><div class="row">${Object.entries(ACC_NAME).map(([k,n]) => `<button class="chip" data-g="${i}" data-a="${k}">${n}</button>`).join('')}</div>`) : `<div class="small muted">Accent: ${ACC_NAME[s.accent]} (your device used a different voice)</div>`);
    total();
  };
  const total = () => {
    const rs = Object.entries(p.accents.res); if (rs.length < S.length) return;
    let ok = 0, all = 0; rs.forEach(([i,r]) => { const m = lcsMark(S[i].text, r.typed); ok += m.ok; all += m.total; });
    p.accents.score = Math.round(100*ok/all); p.accents.total = 100; save();
    $('#res').innerHTML = `<div class="score"><span>Words heard correctly</span><span class="big">${p.accents.score}%</span></div>`; refreshTicks();
  };
  st.onclick = e => {
    const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
    if (d.play !== undefined){ stopSpeech(); say(S[+d.play].text, S[+d.play].accent); }
    if (d.slow !== undefined){ stopSpeech(); say(S[+d.slow].text, S[+d.slow].accent, {rate: 0.7}); }
    if (d.chk !== undefined){ const i = +d.chk, v = st.querySelector(`[data-in="${i}"]`).value.trim(); if (!v) return;
      p.accents.res[i] = {...(p.accents.res[i]||{}), typed: v}; save(); paint(i); }
    if (d.g !== undefined){ p.accents.res[+d.g].guess = d.a; save(); paint(+d.g); }
  };
  Object.keys(p.accents.res).forEach(i => paint(+i));
}

/* ---------- SPEAK ---------- */
let rec = null, recStream = null, recTimer = null;
const recordings = {};            // in memory: {lesson: {key: Blob}}
function stopRec(){ clearInterval(recTimer); if (rec && rec.state === 'recording') rec.stop(); }
async function startRec(key, seconds, ui){
  if (!navigator.mediaDevices || !window.MediaRecorder){ ui.msg('Recording is not supported in this browser. Use Chrome or Safari on your phone.'); return; }
  try{ recStream = recStream || await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch(e){ ui.msg('Please allow the microphone, then try again.'); return; }
  const chunks = []; rec = new MediaRecorder(recStream);
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => { clearInterval(recTimer); const blob = new Blob(chunks, {type: rec.mimeType || 'audio/webm'});
    (recordings[lessonN] = recordings[lessonN] || {})[key] = blob;
    if (key !== 'talk'){ const p = P(lessonN); p.speak = p.speak || {done:{}}; p.speak.done[key] = true; p.speak.recs = Object.keys(p.speak.done).length; save(); }
    ui.done(blob); refreshTicks(); };
  rec.start(); let left = seconds; ui.tick(left);
  recTimer = setInterval(() => { left--; ui.tick(left); if (left <= 0) stopRec(); }, 1000);
}
async function shareBlob(blob, name){
  const ext = (blob.type.includes('mp4') || blob.type.includes('aac')) ? 'm4a' : blob.type.includes('ogg') ? 'ogg' : 'webm';
  const file = new File([blob], `${name}.${ext}`, {type: blob.type});
  try{ if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title: name}); return; } }catch(e){ if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click();
}
function renderSpeak(st){
  const L = getL(lessonN), S = L.speak, p = P(lessonN); p.speak = p.speak || {done:{}};
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    ${S.prompts.map((pr,i) => `<div class="prompt" data-p="${i}"><h3>Task ${i+1}</h3><div>${esc(pr.task)}</div>
      <div class="row"><button class="btn primary" data-go="${i}">🎙️ Start (20s think → 60s speak)</button><span class="count" data-c="${i}"></span><button class="btn ghost" data-end="${i}" hidden>■ Finish now</button></div>
      <div data-msg="${i}" class="small muted"></div><div data-au="${i}"></div>
      <div class="check">${pr.checklist.map(c => `<label><input type="checkbox"><span>${esc(c)}</span></label>`).join('')}</div>
      <div class="row"><button class="btn ghost" data-model="${i}">🔊 Model answer</button><button class="btn ghost" data-show="${i}">Show model text</button></div>
      <div class="model" data-mt="${i}" hidden>${esc(pr.model)}</div></div>`).join('')}
    <div class="prompt"><h3>Shadowing</h3><div class="small">Listen, then say the sentence at the same time as the voice. Then record yourself once.${SR ? ' Your phone will show what it heard.' : ''}</div>
      ${S.shadow.map((s,i) => `<div class="acc"><div>“${esc(s)}”</div><div class="row"><button class="btn ghost" data-sh="${i}">▶ Listen</button><button class="btn ghost" data-shr="${i}">🎙️ Say it</button></div><div class="small" data-sho="${i}"></div></div>`).join('')}
    </div>`;
  const ui = i => ({
    msg: m => st.querySelector(`[data-msg="${i}"]`).textContent = m,
    tick: s => st.querySelector(`[data-c="${i}"]`).textContent = '🔴 ' + s + 's',
    done: blob => { st.querySelector(`[data-c="${i}"]`).textContent = ''; st.querySelector(`[data-end="${i}"]`).hidden = true;
      const url = URL.createObjectURL(blob);
      st.querySelector(`[data-au="${i}"]`).innerHTML = `<audio controls src="${url}"></audio><div class="row" style="margin-top:6px"><button class="btn good" data-send="${i}">📤 Send this recording</button></div>`;
      st.querySelector(`[data-msg="${i}"]`).textContent = '✓ Recorded. Listen to yourself, then try again if you want.'; }
  });
  const prev = recordings[lessonN] || {};
  Object.keys(prev).filter(k => !k.startsWith('sh')).forEach(k => ui(+k).done(prev[k]));
  st.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
    if (d.go !== undefined){ const i = +d.go; stopSpeech(); stopRec();
      let t = 20; const c = st.querySelector(`[data-c="${i}"]`); c.textContent = '💭 ' + t + 's'; st.querySelector(`[data-end="${i}"]`).hidden = false;
      clearInterval(recTimer); recTimer = setInterval(() => { t--; c.textContent = '💭 ' + t + 's'; if (t <= 0){ clearInterval(recTimer); startRec(String(i), 60, ui(i)); } }, 1000);
      ui(i).msg('Think: what will you say? Recording starts at 0.'); }
    if (d.end !== undefined){ if (rec && rec.state === 'recording') stopRec(); else { clearInterval(recTimer); startRec(d.end, 60, ui(+d.end)); } }
    if (d.model !== undefined){ stopSpeech(); say(S.prompts[+d.model].model, 'en-GB'); }
    if (d.show !== undefined){ const m = st.querySelector(`[data-mt="${d.show}"]`); m.hidden = !m.hidden; }
    if (d.send !== undefined){ shareBlob(recordings[lessonN][d.send], `Lesson${lessonN}-Task${+d.send+1}`); }
    if (d.sh !== undefined){ stopSpeech(); say(S.shadow[+d.sh], 'en-GB', {rate: 0.85}); }
    if (d.shr !== undefined){ const i = +d.shr, out = st.querySelector(`[data-sho="${i}"]`);
      if (SR){ const r = new SR(); r.lang = 'en-GB'; r.interimResults = false; out.textContent = '🎙️ Listening…';
        r.onresult = ev => { const heard = ev.results[0][0].transcript, m = lcsMark(S.shadow[i], heard);
          out.innerHTML = `Heard: “${esc(heard)}” · <b>${m.ok}/${m.total} words</b><div class="diff">${m.words.map((w,k) => `<span class="${m.hit[k]?'ok':'miss'}">${esc(w)}</span>`).join(' ')}</div>`;
          p.speak.done['sh'+i] = true; p.speak.recs = Object.keys(p.speak.done).length; save(); refreshTicks(); };
        r.onerror = ev => out.textContent = ev.error === 'not-allowed' ? 'Please allow the microphone.' : 'I did not hear you. Try again, a little louder.';
        r.start(); }
      else { out.textContent = '🔴 Recording 8 seconds…'; startRec('sh'+i, 8, {msg: m => out.textContent = m, tick: s => out.textContent = '🔴 ' + s + 's', done: blob => { out.innerHTML = `<audio controls src="${URL.createObjectURL(blob)}"></audio>`; }}); } }
  };
}

function renderStage(){
