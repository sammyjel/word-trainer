itle": "Natalia, Piano Teacher", "text": "Natalia Petrova has taught piano for fifteen years. She was born in Kazan and moved to Antalya in 2016. She has lived there since then, and she has taught more than two hundred students so far.\n\nNatalia studied music at university and got her first certificate in 2008. Last year she finished an online course in teaching adults. She says it was hard, but it helped her to improve her lessons.\n\nHer biggest achievement? In 2021 one of her students won a national competition. 'I was so proud,' she says. 'His results were amazing.'\n\nNatalia's students say she is patient, organised and creative. She always plans her lessons, and she never cancels at the last minute, so parents find her very reliable. Many of them recommend her to their friends.\n\nHas she ever had a difficult student? 'Of course,' she laughs. 'But I have never given up on anyone.'\n\nHer strength is clear explanations. Her weakness? 'I sometimes talk too much!' Next month she has an interview with a music school in Istanbul. She hasn't decided yet if she wants to move.", "questions": [{"q": "How long has Natalia taught piano?", "options": ["For ten years.", "For fifteen years.", "Since 2008."], "answer": 1, "why": "'Natalia Petrova has taught piano for fifteen years.'"}, {"q": "When did she move to Antalya?", "options": ["In 2008.", "In 2016.", "In 2021."], "answer": 1, "why": "'She ... moved to Antalya in 2016.'"}, {"q": "What did she do last year?", "options": ["She won a competition.", "She finished an online course.", "She moved to Istanbul."], "answer": 1, "why": "'Last year she finished an online course in teaching adults.'"}, {"q": "Why do parents find her reliable?", "options": ["She never cancels at the last minute.", "She is very creative.", "She has a certificate."], "answer": 0, "why": "'she never cancels at the last minute, so parents find her very reliable.'"}, {"q": "Has she decided to move to Istanbul?", "options": ["Yes, she has already decided.", "No, she hasn't decided yet.", "She has never wanted to move."], "answer": 1, "why": "'She hasn't decided yet if she wants to move.'"}], "find": [{"meaning": "a paper that shows you finished a course or passed an exam", "word": "certificate"}, {"meaning": "you can trust this person; they always do what they promise", "word": "reliable"}, {"meaning": "the thing you are best at", "word": "strength"}]}, "listen": {"title": "New at the school", "situation": "Two teachers meet in the staff room of a language school in Antalya and talk about their experience.", "speakers": {"A": {"name": "Karen", "accent": "en-GB"}, "B": {"name": "Omar", "accent": "en-US"}}, "lines": [{"who": "A", "text": "Hi, I'm Karen. I teach English here. Are you new?"}, {"who": "B", "text": "Yes, I'm Omar. I started on Monday. I teach Arabic."}, {"who": "A", "text": "Nice! Have you ever taught in a language school before?"}, {"who": "B", "text": "No, I haven't. I've only given private lessons. I've taught private students for six years."}, {"who": "A", "text": "Six years! That's a lot of experience. Have you ever taught online?"}, {"who": "B", "text": "Yes, I have. I taught online in 2020. It was difficult at first."}, {"who": "A", "text": "Why?"}, {"who": "B", "text": "My connection was terrible, and my students couldn't hear me! But I improved quickly."}, {"who": "A", "text": "I've never taught online. I'm not very good with technology."}, {"who": "B", "text": "Oh, it's easy. You just need to be organised and patient."}, {"who": "A", "text": "And have you finished your teaching course yet?"}, {"who": "B", "text": "Not yet. I've already done the first part, but I haven't got the certificate yet."}, {"who": "A", "text": "Good luck! I can recommend a great online course if you want."}, {"who": "B", "text": "Thanks, that's very kind."}], "questions": [{"q": "What language does Omar teach?", "options": ["English", "Arabic", "Turkish"], "answer": 1, "why": "Omar: 'I teach Arabic.'"}, {"q": "How long has Omar taught private students?", "options": ["For two years.", "For six years.", "Since Monday."], "answer": 1, "why": "'I've taught private students for six years.'"}, {"q": "When did Omar teach online?", "options": ["In 2020.", "Last Monday.", "Never."], "answer": 0, "why": "'I taught online in 2020.'"}, {"q": "Has Karen ever taught online?", "options": ["Yes, many times.", "No, never.", "Only once."], "answer": 1, "why": "Karen: 'I've never taught online.'"}, {"q": "What is true about Omar's course?", "options": ["He has finished it.", "He has got the certificate.", "He hasn't got the certificate yet."], "answer": 2, "why": "'I haven't got the certificate yet.'"}]}, "accents": {"sentences": [{"text": "Have you ever taught adults?", "accent": "en-GB"}, {"text": "I've taught Russian for ten years.", "accent": "en-US"}, {"text": "She has never worked in a school.", "accent": "en-AU"}, {"text": "We have already finished the course.", "accent": "en-IN"}, {"text": "He hasn't got his certificate yet.", "accent": "en-IE"}, {"text": "What is your biggest achievement so far?", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Voice note (90 seconds): tell me about your biggest achievement as a teacher. What happened? How did you feel?", "model": "My biggest achievement as a teacher happened two years ago. One of my adult students wanted to work in Moscow. We had lessons three times a week for six months. She was nervous, but she worked very hard. In the end she passed her interview in Russian and got the job. I was so proud of her. I've had many students since then, but I still remember her.", "checklist": ["I used the past simple for the story (happened, worked, passed).", "I said how I felt.", "I used the word 'achievement'."]}, {"task": "Answer three 'Have you ever...?' questions about your teaching life. After each answer, add one detail with a past time (in 2019, last year).", "model": "Have I ever taught children? Yes, I have. I taught a ten-year-old boy in 2019. Have I ever taught online? Yes, many times. I started online lessons in 2020. Have I ever worked as a translator? No, I haven't, but I want to try.", "checklist": ["I used 'Yes, I have / No, I haven't'.", "I added a detail with a past time.", "I didn't say 'I have taught in 2019'."]}, {"task": "Describe your skills as a teacher. Use three of these words: patient, organised, creative, reliable. Give an example for each.", "model": "I think I'm a patient teacher. When a student makes the same mistake many times, I explain it again calmly. I'm also organised: I plan every lesson and I send homework after class. And I'm creative. I often use songs and games, because adults like games too. My students say I'm reliable, because I've never cancelled a lesson at the last minute.", "checklist": ["I used at least three skill words.", "I gave a real example for each skill.", "I spoke for about one minute."]}], "shadow": ["I've taught Russian for ten years.", "Have you ever taught online? Yes, I have.", "I haven't got the certificate yet, but I've already finished the course."]}, "conf": {"minute_topics": ["Talk for one minute about something you have achieved this year.", "Talk for one minute about a course you have done.", "Talk for one minute about a country you have visited.", "Talk for one minute about a skill you have learned.", "Talk for one minute about a famous person you have met or seen."], "lifesavers": ["No way! Really?", "Same here!"], "win": "Today I can ask and answer 'Have you ever…?' questions and say more in the past simple."}}, {"n": 20, "focus": "Listening & Grammar", "classwork": ["Listen to the interview recording once and write down 3 sentences she wants to say better.", "Shadow Irina’s answers from the model text 3 times.", "Write answers to interview questions 8 and 9 (50 words each)."], "read": {"title": "How I Prepared for My Interview", "text": "Last month I had an interview with a big translation company in Istanbul. I have worked as a freelance translator since 2018, but I have never worked in an office, so I was quite nervous.\n\nI prepared for a week. First, I wrote down ten questions that interviewers often ask. Then I practised my answers with a friend every evening.\n\nThe first question was easy: 'How long have you worked as a translator?' I said, 'For six years. I started in 2018, after university.' Then they asked, 'Have you ever translated legal documents?' I said, 'Yes, I have. I translated contracts for a hotel in 2022.'\n\nThe difficult question was about my weakness. I told the truth: 'I sometimes work too slowly, because I check everything three times.' They smiled. They said it was a good weakness for a translator!\n\nI haven't heard from them yet, but I'm happy with my answers. My advice? Learn the difference between 'I have done' and 'I did'. Interviewers notice it.\n\nMehmet, translator", "questions": [{"q": "Since when has Mehmet worked as a translator?", "options": ["Since 2018.", "Since 2022.", "Since last month."], "answer": 0, "why": "'I have worked as a freelance translator since 2018.'"}, {"q": "Why was he nervous?", "options": ["He has never worked in an office.", "He doesn't speak English.", "His friend didn't help him."], "answer": 0, "why": "'I have never worked in an office, so I was quite nervous.'"}, {"q": "How did he prepare?", "options": ["He took a course.", "He practised his answers with a friend.", "He read legal documents."], "answer": 1, "why": "'I practised my answers with a friend every evening.'"}, {"q": "What did he translate in 2022?", "options": ["Contracts for a hotel.", "A book.", "Emails for a school."], "answer": 0, "why": "'I translated contracts for a hotel in 2022.'"}, {"q": "What is his weakness?", "options": ["He is often late.", "He sometimes works too slowly.", "He talks too much."], "answer": 1, "why": "'I sometimes work too slowly, because I check everything three times.'"}], "find": [{"meaning": "the thing you are not very good at", "word": "weakness"}, {"meaning": "a meeting where someone asks you questions for a job", "word": "interview"}, {"meaning": "did something many times to get better at it", "word": "practised"}]}, "listen": {"title": "The job interview", "situation": "Helen, the director of a language school, interviews Pavel for a job as a Russian teacher.", "speakers": {"A": {"name": "Helen", "accent": "en-AU"}, "B": {"name": "Pavel", "accent": "en-GB"}}, "lines": [{"who": "A", "text": "Good morning, Pavel. Thank you for coming. Please sit down."}, {"who": "B", "text": "Good morning. Thank you for inviting me."}, {"who": "A", "text": "So, how long have you taught Russian?"}, {"who": "B", "text": "I've taught Russian for eight years. I started at a school in Saint Petersburg in 2018."}, {"who": "A", "text": "And when did you come to Turkey?"}, {"who": "B", "text": "I came here five years ago. I've lived in Antalya since 2021."}, {"who": "A", "text": "Have you ever taught teenagers?"}, {"who": "B", "text": "Yes, I have. I taught teenagers at my first school. It was hard but fun."}, {"who": "A", "text": "What's your biggest strength?"}, {"who": "B", "text": "I think I'm very organised. I've never missed a deadline."}, {"who": "A", "text": "Have you done any courses recently?"}, {"who": "B", "text": "Yes. I finished an online course about teaching with games last month."}, {"who": "A", "text": "Great. Have you got the certificate yet?"}, {"who": "B", "text": "Not yet. It's coming next week."}, {"who": "A", "text": "Wonderful. Thank you, Pavel. We can talk again on Friday."}], "questions": [{"q": "How long has Pavel taught Russian?", "options": ["For five years.", "For eight years.", "Since 2021."], "answer": 1, "why": "'I've taught Russian for eight years.'"}, {"q": "When did he come to Turkey?", "options": ["In 2018.", "Five years ago.", "Last year."], "answer": 1, "why": "'I came here five years ago.'"}, {"q": "Who did he teach at his first school?", "options": ["Teenagers.", "Small children.", "Business people."], "answer": 0, "why": "'I taught teenagers at my first school.'"}, {"q": "What is his biggest strength?", "options": ["He is creative.", "He is organised.", "He is patient."], "answer": 1, "why": "'I think I'm very organised.'"}, {"q": "What about the certificate?", "options": ["He has it now.", "It's coming next week.", "He didn't finish the course."], "answer": 1, "why": "'Not yet. It's coming next week.'"}]}, "accents": {"sentences": [{"text": "I worked at a school in 2015.", "accent": "en-US"}, {"text": "I've worked here since January.", "accent": "en-GB"}, {"text": "Did you finish the course last year?", "accent": "en-AU"}, {"text": "Have you finished the course yet?", "accent": "en-IN"}, {"text": "We met at an interview two years ago.", "accent": "en-IE"}, {"text": "I've never missed a lesson.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Interview question: 'How long have you taught Russian, and where did you start?'", "model": "I've taught Russian for about ten years. I started in 2014 at a language centre in my city. I taught groups of adults there for three years. Then I moved to private lessons, and since 2020 I've also taught online. So far I've had more than a hundred students.", "checklist": ["I used 'for' or 'since' with the present perfect.", "I used the past simple for the start (I started in...).", "I gave numbers and dates."]}, {"task": "Interview question: 'What is your biggest strength, and what is your weakness?'", "model": "My biggest strength is that I'm patient. I explain things many times, and I never get angry with students. My weakness is that I sometimes give too much homework! My students have told me this, so I've already changed it. Now I give shorter tasks.", "checklist": ["I used 'strength' and 'weakness'.", "I gave an example.", "I said what I've done to improve."]}, {"task": "Interview question: 'Have you ever had a difficult student? What did you do?'", "model": "Yes, I have. Two years ago I had a student who never did his homework. He was very busy with work. I talked to him after a lesson, and we changed the plan. We did short speaking practice in class instead. His results improved a lot, and he has recommended me to three friends since then.", "checklist": ["I started with 'Yes, I have' or 'No, I haven't'.", "I told the story in the past simple.", "I used 'results' or 'improve'."]}], "shadow": ["I came to Turkey five years ago.", "I've lived in Antalya since 2021.", "Have you got the certificate yet? Not yet."]}, "conf": {"minute_topics": ["Talk for one minute about your strengths as a teacher.", "Talk for one minute about your best result with a student.", "Talk for one minute about a job interview you remember.", "Talk for one minute about how you have improved your English.", "Talk for one minute about a weakness and what you do about it."], "lifesavers": ["Let me give you an example.", "What I mean is…"], "win": "Today I can answer job-interview questions about my experience."}}, {"n": 21, "focus": "Writing & Fluency", "classwork": ["Rewrite her CV Experience section and cover message cleanly and send them to the teacher.", "Voice note (90 sec): ‘My biggest achievement as a teacher’ (if not done), or ‘A difficult student and what I did’.", "Shadow Irina’s text once a day."], "read": {"title": "A Cover Message", "text": "Dear Ms Demir,\n\nI saw your advertisement for an online Russian teacher, and I would like to apply.\n\nI have taught Russian as a foreign language for nine years. From 2015 to 2019 I worked at a language school in Novosibirsk, where I taught groups of adults and teenagers at all levels. In 2019 I moved to Turkey, and since then I have worked as a private tutor in Antalya.\n\nSo far I have taught more than 150 students, from beginners to advanced. Last year I completed a course in online teaching, and I have a certificate from Moscow State University.\n\nI am patient, organised and reliable. My students often say that my lessons are creative and fun. My biggest achievement is that eight of my students have passed the official Russian exam with very good results.\n\nI have attached my CV. I am available for an interview any weekday after 2 p.m.\n\nThank you for your time.\n\nBest regards,\nSvetlana Orlova", "questions": [{"q": "Why is Svetlana writing?", "options": ["To apply for a job.", "To book a lesson.", "To cancel an interview."], "answer": 0, "why": "'I saw your advertisement ... and I would like to apply.'"}, {"q": "Where did she work from 2015 to 2019?", "options": ["In Antalya.", "At a language school in Novosibirsk.", "At Moscow State University."], "answer": 1, "why": "'From 2015 to 2019 I worked at a language school in Novosibirsk.'"}, {"q": "How many students has she taught so far?", "options": ["Nine.", "Eight.", "More than 150."], "answer": 2, "why": "'So far I have taught more than 150 students.'"}, {"q": "What is her biggest achievement?", "options": ["She moved to Turkey.", "Eight students passed the official exam.", "She finished a course."], "answer": 1, "why": "'My biggest achievement is that eight of my students have passed the official Russian exam.'"}, {"q": "When can she have an interview?", "options": ["At the weekend.", "Any weekday after 2 p.m.", "Only in the morning."], "answer": 1, "why": "'I am available for an interview any weekday after 2 p.m.'"}], "find": [{"meaning": "something good that you did with a lot of work", "word": "achievement"}, {"meaning": "a paper that shows you finished a course", "word": "certificate"}, {"meaning": "until now", "word": "so far"}]}, "listen": {"title": "Checking a CV", "situation": "Deniz wants a job at a hotel. His English friend Lucy checks his CV.", "speakers": {"A": {"name": "Deniz", "accent": "en-US"}, "B": {"name": "Lucy", "accent": "en-GB"}}, "lines": [{"who": "A", "text": "Lucy, can you look at my CV? I want to apply for a job at a hotel."}, {"who": "B", "text": "Of course. Let's see. 'I work at the Sun Hotel since 2019.' That's not right."}, {"who": "A", "text": "Oh. What's wrong with it?"}, {"who": "B", "text": "You need the present perfect here: 'I have worked at the Sun Hotel since 2019.'"}, {"who": "A", "text": "I see. And this one? 'I have finished a tourism course in 2017.'"}, {"who": "B", "text": "No, there's a date, 2017, so use the past simple: 'I finished a tourism course in 2017.'"}, {"who": "A", "text": "It's difficult! In Turkish it's different."}, {"who": "B", "text": "I know. But your experience is great. You've worked in three hotels so far."}, {"who": "A", "text": "Yes. And I've learned some German too."}, {"who": "B", "text": "Write that! It's a useful skill. Have you written the cover message yet?"}, {"who": "A", "text": "Not yet. I've only written the first line."}, {"who": "B", "text": "OK, write it tonight and send it to me. I can check it tomorrow."}], "questions": [{"q": "What job does Deniz want?", "options": ["A job at a school.", "A job at a hotel.", "A job as a translator."], "answer": 1, "why": "'I want to apply for a job at a hotel.'"}, {"q": "What was wrong with 'I work at the Sun Hotel since 2019'?", "options": ["It needs the present perfect.", "It needs the past simple.", "The date is wrong."], "answer": 0, "why": "'You need the present perfect here.'"}, {"q": "When did Deniz finish his tourism course?", "options": ["In 2019.", "In 2017.", "Last month."], "answer": 1, "why": "'I finished a tourism course in 2017.'"}, {"q": "How many hotels has Deniz worked in?", "options": ["One.", "Two.", "Three."], "answer": 2, "why": "'You've worked in three hotels so far.'"}, {"q": "What has Deniz done with the cover message?", "options": ["He has finished it.", "He has written only the first line.", "He has sent it to Lucy."], "answer": 1, "why": "'I've only written the first line.'"}]}, "accents": {"sentences": [{"text": "I have attached my CV.", "accent": "en-GB"}, {"text": "I've worked as a tutor since 2019.", "accent": "en-US"}, {"text": "From 2015 to 2019 I taught at a school.", "accent": "en-AU"}, {"text": "So far I've taught more than a hundred students.", "accent": "en-IN"}, {"text": "I am available for an interview on Monday.", "accent": "en-IE"}, {"text": "My students often recommend me to their friends.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Read your CV Experience section aloud. Then say it again without reading.", "model": "From 2014 to 2019 I taught Russian at a language centre. I taught adult groups at all levels. Since 2019 I've worked as a private tutor in Antalya. So far I've taught more than a hundred students, and many of them have passed exams with good results.", "checklist": ["I used the past simple for finished jobs (from... to...).", "I used the present perfect for my job now (since...).", "The second time I didn't read."]}, {"task": "4-3-2: talk about your experience as a teacher for 1 minute. Then say the same in 45 seconds, then in 30 seconds.", "model": "I've been a teacher for about ten years. I started at a school, and later I moved to private lessons. I've taught children and adults, but now I prefer adults. My students say I'm patient and creative. My biggest achievement so far is that one student got a job in Russia because of our lessons.", "checklist": ["Each time I spoke faster and more smoothly.", "I didn't stop for a long time.", "I kept the most important information."]}, {"task": "Voice note (90 seconds): 'A difficult student and what I did.'", "model": "A few years ago I had a student who was always late. She was a busy doctor. At first I was angry, but then I talked to her. We moved her lessons to the morning, before her work. After that she was never late, and her results improved a lot. I learned that sometimes the problem is the timetable, not the student.", "checklist": ["I told the story in order.", "I used past simple verbs correctly.", "I said what I learned."]}], "shadow": ["Since 2019 I've worked as a private tutor.", "I am available for an interview any weekday.", "Thank you for your time. Best regards."]}, "conf": {"minute_topics": ["Talk for one minute about the best course you have ever done.", "Talk for one minute about a person you recommend to others.", "Talk for one minute about your experience as a teacher so far.", "Talk for one minute about something creative you have done.", "Talk for one minute about a result you are proud of."], "lifesavers": ["How about you?", "That reminds me…"], "win": "Today I can describe my experience and skills for my CV."}}], "mission": {"title": "Write an English review for a place you love", "why": "A short public review in English is real writing for real readers, and it gives you practice for the reviews your future students will write about you.", "steps": ["Choose a café, restaurant or shop in Antalya that you like.", "Write 3 sentences in English. Use the present perfect once ('I've been here many times').", "Read it out loud before you post it.", "Post it on Google Maps (or send it to a friend)."], "say_this": ["I've been here many times.", "I've never had a bad coffee here.", "The staff are always patient and friendly.", "I really recommend it!"], "bonus": "Read your review to the teacher in the next lesson and talk about the place for one minute."}, "video": {"youtube_id": "eK5Tsornvng", "title": "Talking about mistakes - Real Easy English", "channel": "BBC Learning English", "seconds": 347, "start": 24, "end": 320, "checked": "oEmbed OK + English subtitles read on 2026-11-18", "lessons": {"19": {"before": "Have you ever made a funny or big mistake? Think of one.", "questions": [{"q": "What is the topic?", "options": ["Mistakes", "Jobs", "Holidays"], "answer": 0, "why": "\"today we're going to talk about 'mistakes'.\""}, {"q": "What did Beth leave on the train?", "options": ["Her phone", "Her suitcase", "Her ticket"], "answer": 1, "why": "\"I recently left my suitcase on a train by mistake.\""}, {"q": "Did Beth get it back?", "options": ["Yes, she was lucky", "No, never", "Yes, by post a week later"], "answer": 0, "why": "\"I did, I was so lucky.\""}], "after": "Voice note (1 minute): Have you ever made a big mistake? What happened? What did you learn?"}, "20": {"before": "Listen for the two stories: Beth's train and Neil's job.", "questions": [{"q": "Why did Beth want to get off the train quickly?", "options": ["She was late for work", "Football fans were singing really loudly", "The train was dirty"], "answer": 1, "why": "\"they were football fans and they were singing really loudly. And I just wanted to get off the train.\""}, {"q": "Where was Neil teaching?", "options": ["At a university in Leeds", "At a school in Prague", "At a school in London"], "answer": 1, "why": "\"I was teaching at a school in Prague, in the Czech Republic\""}, {"q": "What did the boss first say when Neil wanted to stay?", "options": ["\"You can stay.\"", "\"It's too late, I've given your job to somebody else.\"", "\"You must work more.\""], "answer": 1, "why": "\"it's too late because I've given your job to somebody else.\""}, {"q": "What does Neil regret?", "options": ["Leaving Prague", "Quitting piano lessons", "Learning guitar"], "answer": 1, "why": "\"I had some piano lessons, and I quit as soon as I could... And I regret that\""}], "after": "Write 6 sentences about your career: things you have done / have never done / have already done this year."}, "21": {"before": "Watch again and listen for 'by mistake' and 'regret'.", "questions": [{"q": "'By mistake' means...", "options": ["on purpose", "accidentally, without meaning to", "very quickly"], "answer": 1, "why": "\"'by mistake', which means we do something accidentally, without meaning to.\""}, {"q": "'Regret' means...", "options": ["feel bad or sorry about something you've done", "feel happy", "forget"], "answer": 0, "why": "\"'regret', which means feel bad or sorry about something you've done\""}, {"q": "'Learn from your mistakes' means...", "options": ["make the mistake again", "remember the mistake and not do it again", "never try anything new"], "answer": 1, "why": "\"remember the mistake and then not do it again the next time.\""}], "after": "Retell Neil's job story in 5 sentences. Then finish: 'I have learnt from my mistakes because...'"}}}, "words": [{"w": "experience", "e": "🗂️", "x": "I have twelve years of teaching experience.", "ru": "deneyim"}, {"w": "skill", "e": "🛠️", "x": "Explaining grammar simply is my best skill.", "ru": "beceri"}, {"w": "achievement", "e": "🏆", "x": "My biggest achievement is my students’ exam results.", "ru": "başarı"}, {"w": "course", "e": "📚", "x": "I’ve done a course in online teaching.", "ru": "kurs"}, {"w": "certificate", "e": "📜", "x": "I have a certificate in teaching Russian as a foreign language.", "ru": "sertifika"}, {"w": "so far", "e": "📈", "x": "So far I’ve taught students from nine countries.", "ru": "şimdiye kadar"}, {"w": "results", "e": "✅", "x": "My students get good results in the TORFL exam.", "ru": "sonuçlar"}, {"w": "improve", "e": "⬆️", "x": "My English has improved a lot this month.", "ru": "geliştirmek, gelişmek"}, {"w": "patient", "e": "🧘", "x": "A good teacher is patient with beginners.", "ru": "sabırlı"}, {"w": "organised", "e": "🗓️", "x": "I’m very organised: I plan every lesson the day before.", "ru": "düzenli"}, {"w": "creative", "e": "🎨", "x": "I’m creative: I use songs and games in my lessons.", "ru": "yaratıcı"}, {"w": "reliable", "e": "🤝", "x": "I’m reliable: I have never missed a lesson.", "ru": "güvenilir"}, {"w": "recommend", "e": "👍", "x": "My students often recommend me to their friends.", "ru": "tavsiye etmek"}, {"w": "strength", "e": "💪", "x": "My biggest strength is patience.", "ru": "güçlü yön"}, {"w": "weakness", "e": "🪫", "x": "My weakness is that I sometimes work too much.", "ru": "zayıf yön"}, {"w": "interview", "e": "🎤", "x": "I have a job interview with an online school on Friday.", "ru": "iş görüşmesi, mülakat"}]}, {"week": 8, "topic": "Plans and Goals", "lessons": [{"n": 22, "focus": "Speaking & Vocabulary", "classwork": ["Voice note (1 min): her plans for the New Year holidays (going to).", "Write her business mind map as 8 sentences with ‘I’m going to…’.", "Learn the 16 words in the Word Trainer."], "read": {"title": "Elif's New Plan", "text": "Elif teaches Turkish cooking to tourists in Antalya. Her classes are popular in summer, but in winter there are not many customers. So this year she has a new plan.\n\n'I'm going to launch online cooking classes in January,' she says. 'People can cook with me from their own kitchens, anywhere in the world.'\n\nHer goal is to have fifty online customers by the summer. First, she is going to make a profile on two big platforms. Then she is going to advertise on social media. She is going to post a short video every week to attract new students.\n\nWhat about the price? Elif is going to sell packages of five classes. The first class is going to have a 50% discount, because she wants people to try it.\n\n'Good reviews are very important,' she explains. 'I'm going to ask every customer to write one.'\n\nIs she worried? 'A little,' she says. 'But I think online classes will grow fast. And I'm meeting a web designer on Monday, so the plan is already moving.'", "questions": [{"q": "Why does Elif need a new plan?", "options": ["She has few customers in winter.", "She wants to leave Antalya.", "Her kitchen is too small."], "answer": 0, "why": "'in winter there are not many customers. So this year she has a new plan.'"}, {"q": "When is she going to launch online classes?", "options": ["In summer.", "In January.", "Next Monday."], "answer": 1, "why": "'I'm going to launch online cooking classes in January.'"}, {"q": "How is she going to attract new students?", "options": ["By posting a short video every week.", "By giving free books.", "By opening a restaurant."], "answer": 0, "why": "'She is going to post a short video every week to attract new students.'"}, {"q": "What discount does the first class have?", "options": ["10%", "25%", "50%"], "answer": 2, "why": "'The first class is going to have a 50% discount.'"}, {"q": "Who is she meeting on Monday?", "options": ["A new customer.", "A web designer.", "A tourist."], "answer": 1, "why": "'I'm meeting a web designer on Monday.'"}], "find": [{"meaning": "to start something new, for example a business or a product", "word": "launch"}, {"meaning": "a lower price than normal", "word": "discount"}, {"meaning": "people who buy from a business", "word": "customers"}]}, "listen": {"title": "Coffee and Conversation", "situation": "Sara tells her friend Ben about her plan to start an English club. Ben offers to help.", "speakers": {"A": {"name": "Sara", "accent": "en-US"}, "B": {"name": "Ben", "accent": "en-GB"}}, "lines": [{"who": "A", "text": "Ben, I'm going to start a small English club for adults next month."}, {"who": "B", "text": "That's a great idea! Where are you going to have it?"}, {"who": "A", "text": "At the cafe near the museum. The owner says it's OK."}, {"who": "B", "text": "How are you going to find members?"}, {"who": "A", "text": "I'm going to advertise on social media. But I don't have any good photos."}, {"who": "B", "text": "Oh, I'll take some photos for you. I have a good camera."}, {"who": "A", "text": "Really? Thanks! And I need a name for the club."}, {"who": "B", "text": "Hmm. What about 'Coffee and Conversation'?"}, {"who": "A", "text": "I love it! I'll use that."}, {"who": "B", "text": "What's the price going to be?"}, {"who": "A", "text": "The first meeting is going to be free. After that, it's going to be two hundred lira a month."}, {"who": "B", "text": "That's a good price. I think lots of people will come."}, {"who": "A", "text": "I hope so. Oh no, my phone is ringing. It's my mother."}, {"who": "B", "text": "Don't worry, I'll call you later."}], "questions": [{"q": "What is Sara going to start?", "options": ["A cafe.", "An English club.", "A photography course."], "answer": 1, "why": "'I'm going to start a small English club for adults.'"}, {"q": "Where is the club going to meet?", "options": ["At the cafe near the museum.", "At a school.", "Online."], "answer": 0, "why": "'At the cafe near the museum.'"}, {"q": "What does Ben offer to do?", "options": ["Pay for the cafe.", "Take some photos.", "Teach English."], "answer": 1, "why": "'I'll take some photos for you.'"}, {"q": "How much is the first meeting?", "options": ["It's free.", "Two hundred lira.", "One hundred lira."], "answer": 0, "why": "'The first meeting is going to be free.'"}, {"q": "Who is calling Sara?", "options": ["The cafe owner.", "Ben.", "Her mother."], "answer": 2, "why": "'My phone is ringing. It's my mother.'"}]}, "accents": {"sentences": [{"text": "I'm going to open an online school next year.", "accent": "en-GB"}, {"text": "Don't worry, I'll send the link again.", "accent": "en-US"}, {"text": "I think online lessons will grow fast.", "accent": "en-AU"}, {"text": "We're going to advertise on social media.", "accent": "en-IN"}, {"text": "I'll give you a discount for the first lesson.", "accent": "en-IE"}, {"text": "What are your plans for the New Year?", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Voice note (1 minute): your plans for the New Year holidays. Use 'I'm going to...'.", "model": "For the New Year holidays I'm going to stay in Antalya. On the 31st I'm going to have dinner with my family. After that I'm going to rest for a few days, because I'm very tired. I'm also going to read a book in English and plan my lessons for January.", "checklist": ["I used 'I'm going to' at least four times.", "I said when (on the 31st, after that).", "I didn't say 'I going to' without 'm'."]}, {"task": "Quick decisions! Answer each problem with 'I'll...': a student can't open the link; a student says the price is too high; a student is sick today.", "model": "The link doesn't work? Don't worry, I'll send it again. You think the price is too high? OK, I'll give you a discount for a package of ten lessons. You're sick today? No problem, I'll move the lesson to Friday.", "checklist": ["I used 'I'll' for each decision.", "I answered quickly.", "I was polite and friendly."]}, {"task": "Describe your business plan for your Russian lessons. What are you going to do in the next six months?", "model": "In the next six months I'm going to grow my business. First, I'm going to make a profile on a big teaching platform. Then I'm going to advertise on social media, maybe with short videos. I'm going to offer packages of ten lessons with a small discount. My goal is to have twenty new students by the summer.", "checklist": ["I used 'going to' for plans.", "I used at least four words from this week (profile, advertise, package, goal...).", "I ordered my ideas (first, then...)."]}], "shadow": ["I'm going to launch my online lessons in January.", "Don't worry, I'll send it again.", "My goal is to have twenty new students by the summer."]}, "conf": {"minute_topics": ["Talk for one minute about your plans for next year.", "Talk for one minute about what you are going to do this weekend.", "Talk for one minute about how your business will grow.", "Talk for one minute about a goal you have for your English.", "Talk for one minute about a place you are going to visit."], "lifesavers": ["Guess what?", "I'd say probably…"], "win": "Today I can make quick decisions with 'I'll…' and talk about my plans with 'I'm going to…'."}}, {"n": 23, "focus": "Listening & Grammar", "classwork": ["Listen to her presentation recording and write down 3 sentences to improve.", "Shadow Sofia’s text 3 times.", "Voice note: ‘What are you doing this weekend?’ (arrangements, present continuous)."], "read": {"title": "A Busy Month", "text": "Hi Anna,\n\nThanks for your message! Sorry for my late answer. This month is very busy.\n\nNext week I'm working on a big project. I'm translating a hotel website from Italian into English. I'm meeting the hotel manager on Tuesday at 10, and I'm sending the first part on Friday.\n\nAfter that, I'm going to take a short break. I'm going to visit my parents in Naples for a few days. I haven't booked the flight yet, but I'm going to do it tonight.\n\nI also have some big plans for next year. I'm going to launch my own website, and I'm going to offer translation packages for small businesses. I think a lot of hotels will need English websites, because more tourists will come next year.\n\nYou asked about the cafe on Saturday. Yes, I'd love to come! Wait, I think I have a lesson at 4. I'll check my diary and send you a message tomorrow.\n\nSpeak soon,\nMarco", "questions": [{"q": "What is Marco translating next week?", "options": ["A book.", "A hotel website.", "A menu."], "answer": 1, "why": "'I'm translating a hotel website from Italian into English.'"}, {"q": "When is he meeting the hotel manager?", "options": ["On Tuesday at 10.", "On Friday.", "On Saturday at 4."], "answer": 0, "why": "'I'm meeting the hotel manager on Tuesday at 10.'"}, {"q": "What is he going to do after the project?", "options": ["Visit his parents in Naples.", "Start a new course.", "Move to a hotel."], "answer": 0, "why": "'I'm going to visit my parents in Naples for a few days.'"}, {"q": "Why does he think hotels will need English websites?", "options": ["Their websites are old.", "More tourists will come next year.", "English is cheap."], "answer": 1, "why": "'because more tourists will come next year.'"}, {"q": "What does Marco decide about Saturday?", "options": ["He can't come.", "He is going to come at 4.", "He'll check his diary and answer tomorrow."], "answer": 2, "why": "'I'll check my diary and send you a message tomorrow.'"}], "find": [{"meaning": "to start something new", "word": "launch"}, {"meaning": "groups of things or services that you sell together", "word": "packages"}, {"meaning": "a short time when you stop working and rest", "word": "break"}]}, "listen": {"title": "Six months, one plan", "situation": "Mark, a business coach, asks Nadia, a yoga teacher, about her plans for the next six months.", "speakers": {"A": {"name": "Mark", "accent": "en-US"}, "B": {"name": "Nadia", "accent": "en-IN"}}, "lines": [{"who": "A", "text": "So, Nadia, what are your goals for the next six months?"}, {"who": "B", "text": "Well, my main aim is to get more customers. I'm going to move my classes online."}, {"who": "A", "text": "Good. When are you going to start?"}, {"who": "B", "text": "In February. And I'm meeting a photographer next Thursday. She's taking photos for my profile."}, {"who": "A", "text": "Great. What about your prices?"}, {"who": "B", "text": "I'm going to sell packages of eight classes. That's cheaper for students."}, {"who": "A", "text": "Are you going to use social media?"}, {"who": "B", "text": "Yes, Instagram. I'm going to post three times a week."}, {"who": "A", "text": "That's a lot of work. Do you think you'll have time?"}, {"who": "B", "text": "Hmm, maybe not. OK, I'll post twice a week."}, {"who": "A", "text": "Good decision. And what do you think? Will online yoga grow?"}, {"who": "B", "text": "Yes, I think it will. People are busy. They want to exercise at home."}, {"who": "A", "text": "I agree. I think your business will grow fast."}, {"who": "B", "text": "I hope so! Thank you, Mark."}], "questions": [{"q": "What is Nadia's main aim?", "options": ["To get more customers.", "To open a gym.", "To travel."], "answer": 0, "why": "'my main aim is to get more customers.'"}, {"q": "When is she meeting the photographer?", "options": ["In February.", "Next Thursday.", "Tomorrow."], "answer": 1, "why": "'I'm meeting a photographer next Thursday.'"}, {"q": "What is she going to sell?", "options": ["Single classes.", "Packages of eight classes.", "Yoga mats."], "answer": 1, "why": "'I'm going to sell packages of eight classes.'"}, {"q": "How often is she going to post in the end?", "options": ["Three times a week.", "Twice a week.", "Every day."], "answer": 1, "why": "'OK, I'll post twice a week.'"}, {"q": "Why does Nadia think online yoga will grow?", "options": ["It's cheap.", "People are busy and want to exercise at home.", "Gyms are closing."], "answer": 1, "why": "'People are busy. They want to exercise at home.'"}]}, "accents": {"sentences": [{"text": "I'm meeting a new student on Friday at six.", "accent": "en-GB"}, {"text": "Next year I'm going to launch my own website.", "accent": "en-US"}, {"text": "I think there will be more demand for online lessons.", "accent": "en-AU"}, {"text": "The phone's ringing. I'll answer it.", "accent": "en-IN"}, {"text": "She's flying to Istanbul on Monday morning.", "accent": "en-IE"}, {"text": "Our aim is to attract more customers.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Voice note: 'What are you doing this weekend?' Talk about your arrangements: days, times, places and people.", "model": "This weekend is quite busy. On Saturday morning I'm teaching two online lessons. In the afternoon I'm meeting my friend at a cafe in the city centre. On Sunday I'm having lunch with my family, and in the evening I'm preparing my lessons for next week.", "checklist": ["I used the present continuous for arrangements (I'm meeting...).", "I gave days and times.", "I used at least three different verbs."]}, {"task": "Present your 6-month plan in 1-2 minutes: your goal, your plans, and one prediction.", "model": "My goal for the next six months is to grow my Russian lessons business. First, I'm going to update my profile on two platforms. Then I'm going to advertise on social media with short videos. I'm going to offer a package of ten lessons with a small discount. I think more people will want to learn Russian online, because it's convenient. By the summer I hope to have twenty new students.", "checklist": ["I used 'going to' for plans.", "I used 'will' for a prediction.", "I spoke for at least one minute."]}, {"task": "Plan, decision or prediction? Say one of each about your work.", "model": "A plan: I'm going to make a new website next month. A decision: the room is cold, so I'll close the window. A prediction: I think online lessons will be even more popular next year.", "checklist": ["I used 'going to' for the plan.", "I used 'I'll' for the decision.", "I used 'I think... will' for the prediction."]}], "shadow": ["I'm meeting a photographer next Thursday.", "I think your business will grow fast.", "OK, I'll post twice a week."]}, "conf": {"minute_topics": ["Talk for one minute about your lesson prices and packages.", "Talk for one minute about how you will attract new customers.", "Talk for one minute about a good deal you made.", "Talk for one minute about the perfect student for you.", "Talk for one minute about a platform you are going to use."], "lifesavers": ["Fair enough.", "Let me check I understand: you want…"], "win": "Today I can make offers and decisions with 'I'll…' when a client asks for something."}}, {"n": 24, "focus": "Writing & Fluency", "classwork": ["Publish or save one of her posts (her choice) and send the final versions to the teacher.", "Voice note: her plans for the New Year holidays.", "Shadow Sofia’s text."], "read": {"title": "Three Posts from Three Teachers", "text": "Post 1: Olga, guitar teacher\nNew year, new skill! I'm launching beginner guitar lessons in January. Classes are small, only four people, and the first lesson is free. Are you going to learn something new this year? Send me a message and book your place!\n\nPost 2: Karim, Arabic tutor\nBig news! From next month I'm offering online Arabic lessons for adults. You can learn from home, at a time that's good for you. Packages of ten lessons have a 15% discount until 31 January. My students' reviews are on my profile. I'm sure you'll love it!\n\nPost 3: Mila, English teacher\nThis Saturday I'm running a free speaking club at Kahve Cafe at 3 p.m. We're going to play games and talk about travel. There are only twelve places, so write 'YES' in the comments and I'll save one for you!\n\nWhich post is the best? All three are short and friendly. Each one says what is new, gives a special offer or a date, and finishes with an invitation. That's why they attract customers.", "questions": [{"q": "What is special about Olga's first lesson?", "options": ["It's free.", "It's online.", "It's on Saturday."], "answer": 0, "why": "'the first lesson is free.'"}, {"q": "Who are Karim's lessons for?", "options": ["Children.", "Adults.", "Only tourists."], "answer": 1, "why": "'online Arabic lessons for adults.'"}, {"q": "Until when is Karim's discount?", "options": ["The end of February.", "31 January.", "Next Saturday."], "answer": 1, "why": "'a 15% discount until 31 January.'"}, {"q": "Where is Mila's speaking club?", "options": ["Online.", "At a school.", "At Kahve Cafe."], "answer": 2, "why": "'a free speaking club at Kahve Cafe at 3 p.m.'"}, {"q": "How can people get a place in Mila's club?", "options": ["Pay online.", "Write 'YES' in the comments.", "Call her."], "answer": 1, "why": "'write YES in the comments and I'll save one for you!'"}], "find": [{"meaning": "starting something new", "word": "launching"}, {"meaning": "a lower price than normal", "word": "discount"}, {"meaning": "what customers write about a service, good or bad", "word": "reviews"}]}, "listen": {"title": "Make it better!", "situation": "Rustam reads his social media post to his friend Kate. She helps him make it more interesting.", "speakers": {"A": {"name": "Kate", "accent": "en-GB"}, "B": {"name": "Rustam", "accent": "en-AU"}}, "lines": [{"who": "A", "text": "Rustam, have you written your post yet?"}, {"who": "B", "text": "Yes, I have. Can I read it to you?"}, {"who": "A", "text": "Of course."}, {"who": "B", "text": "'I teach chess to children. Lessons are on Saturdays. The price is three hundred lira.'"}, {"who": "A", "text": "Hmm. It's correct, but it's a bit boring. What's new about your lessons?"}, {"who": "B", "text": "Well, I'm going to start online chess lessons next month, in March."}, {"who": "A", "text": "Then start with that! 'Big news! I'm launching online chess lessons in March.'"}, {"who": "B", "text": "Oh, that's better. What else?"}, {"who": "A", "text": "Do you have a special offer?"}, {"who": "B", "text": "I'm going to give a twenty percent discount for the first month."}, {"who": "A", "text": "Perfect, put it in. And finish with a question. People like questions."}, {"who": "B", "text": "Like 'Is your child going to be the next champion?'"}, {"who": "A", "text": "Yes! I think lots of parents will answer that."}, {"who": "B", "text": "Great. I'll change it tonight and post it tomorrow morning."}], "questions": [{"q": "What does Rustam teach?", "options": ["English.", "Chess.", "Music."], "answer": 1, "why": "'I teach chess to children.'"}, {"q": "What did Kate think of the first version?", "options": ["It was wrong.", "It was correct but a bit boring.", "It was too long."], "answer": 1, "why": "'It's correct, but it's a bit boring.'"}, {"q": "When is Rustam going to start online lessons?", "options": ["Next week.", "In March.", "Tomorrow."], "answer": 1, "why": "'I'm going to start online chess lessons next month, in March.'"}, {"q": "What special offer is he going to give?", "options": ["A free lesson.", "A 20% discount for the first month.", "A free chess book."], "answer": 1, "why": "'a twenty percent discount for the first month.'"}, {"q": "When is he going to post it?", "options": ["Tonight.", "Tomorrow morning.", "Next month."], "answer": 1, "why": "'I'll change it tonight and post it tomorrow morning.'"}]}, "accents": {"sentences": [{"text": "Big news! I'm launching online lessons in March.", "accent": "en-GB"}, {"text": "The first lesson is free for new students.", "accent": "en-US"}, {"text": "I'm running a speaking club this Saturday.", "accent": "en-AU"}, {"text": "Packages of ten lessons have a fifteen percent discount.", "accent": "en-IN"}, {"text": "Are you going to learn something new this year?", "accent": "en-IE"}, {"text": "I'll save a place for anyone who writes yes.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Read your best social media post aloud, like a short video: friendly, clear and with energy.", "model": "Hello! I'm a Russian teacher in Antalya, and I have big news. In January I'm launching online Russian lessons for adults. You can learn at a time that's good for you, and the first lesson is free. Are you going to learn a new language this year? Send me a message!", "checklist": ["I smiled and spoke with energy.", "I said what is new.", "I finished with a question or an invitation."]}, {"task": "Talk for one minute: your plans for next year, at work and in your personal life.", "model": "Next year is going to be important for me. At work, I'm going to grow my online lessons and maybe start translating documents. I'm going to improve my English every day, so I can talk to international students. In my personal life, I'm going to travel more. I think it will be a good year.", "checklist": ["I used 'going to' for plans.", "I spoke about work and my personal life.", "I didn't stop for a long time."]}, {"task": "A customer writes: 'Your price is too high.' Answer in a voice note with a decision (I'll...) and an offer.", "model": "Thank you for your message. I understand. My price is the same for all students, but I'll give you a ten percent discount for a package of ten lessons. I'll also send you some free materials before our first lesson. I hope to see you soon!", "checklist": ["I was polite.", "I used 'I'll' for my decision and offer.", "I used 'package' or 'discount'."]}], "shadow": ["Big news! I'm launching online Russian lessons.", "The first lesson is free.", "I'm sure you'll love it."]}, "conf": {"minute_topics": ["Talk for one minute about your plan to launch your lessons online.", "Talk for one minute about social media for your business.", "Talk for one minute about a good review you got or want to get.", "Talk for one minute about where you will be one year from now.", "Talk for one minute about a business you admire."], "lifesavers": ["I see your point, but…", "So, all in all, …"], "win": "Today I can talk about my plans for next year and give my opinion."}}], "mission": {"title": "Tell people your plan in English", "why": "When you say your business plan out loud in English, it becomes real, and people who hear it can send you students.", "steps": ["Write 3 sentences about your plan for your Russian lessons. Use 'I'm going to…'.", "Practise them out loud three times.", "Tell your plan in English to two people (a friend, a neighbour or online).", "Post one sentence on your WhatsApp or Instagram status."], "say_this": ["I'm going to teach Russian online.", "I'm going to make a profile on a teaching platform.", "Next month I'm going to offer a first lesson discount.", "I think it will be a great year!"], "bonus": "Make a short English video (20 seconds) about your plan and send it to the teacher."}, "video": {"youtube_id": "u5AHBqh2Ujs", "title": "Talking about the New Year - Real Easy English", "channel": "BBC Learning English", "seconds": 360, "start": 27, "end": 325, "checked": "oEmbed OK + English subtitles read on 2026-11-18", "lessons": {"22": {"before": "Do you make New Year's resolutions? What is one plan you have for next year?", "questions": [{"q": "What is the topic?", "options": ["Christmas food", "Plans and resolutions for the new year", "School exams"], "answer": 1, "why": "\"we're going to talk about some of our plans for the new year. And we'll also make some New Year's resolutions.\""}, {"q": "Where is one presenter's family trip going?", "options": ["Spain", "Japan", "South Africa"], "answer": 2, "why": "\"we're going to South Africa because this is where my parents had their honeymoon.\""}, {"q": "What is Georgie going to book?", "options": ["A half marathon", "A football match", "A swimming race"], "answer": 0, "why": "\"I think I'm going to book a half marathon.\""}], "after": "Voice note (1 minute): your plans for next year. Use 'I'm going to...' and 'I think I'll...'."}, "23": {"before": "Listen for 'going to' and 'will'. Write each sentence you hear.", "questions": [{"q": "Why is the trip to South Africa special?", "options": ["They have a house there", "The parents had their honeymoon there", "It is cheap"], "answer": 1, "why": "\"this is where my parents had their honeymoon.\""}, {"q": "Why does Georgie want to make fewer resolutions?", "options": ["Last year she made too many and felt bad", "She has no time", "Her family told her to"], "answer": 0, "why": "\"last year I made too many and it was really hard to keep them and it made me feel very bad about myself.\""}, {"q": "Which two months does Neil call dark and sad?", "options": ["November and December", "January and February", "March and April"], "answer": 1, "why": "\"we have the two darkest, saddest months of the year. January and February.\""}, {"q": "What does Neil want to get better at?", "options": ["Spanish and guitar", "Piano and singing", "Running and cooking"], "answer": 0, "why": "\"So I like learning Spanish, but I'm not very good... and the same with my guitar.\""}], "after": "Write a plan for your Russian lessons: 3 goals with 'I'm going to' and 2 predictions with 'will'."}, "24": {"before": "Watch again and listen for 'resolution', 'take up' and 'motivated'.", "questions": [{"q": "A 'New Year's resolution' is...", "options": ["a party", "a promise to yourself at the start of a year", "a holiday"], "answer": 1, "why": "\"a promise you make to yourself at the start of a year\""}, {"q": "'Take up' means...", "options": ["start a new activity", "stop an activity", "pick something up from the floor"], "answer": 0, "why": "\"'Take up' means 'start a new activity'.\""}, {"q": "Complete: \"I think I'm ___ book a half marathon.\"", "options": ["will", "going to", "go to"], "answer": 1, "why": "\"I think I'm going to book a half marathon.\""}], "after": "Retell Georgie's and Neil's plans in 5 sentences. Then say your own resolution. Record it."}}}, "words": [{"w": "plan", "e": "📝", "x": "My plan is to find ten new students this year.", "ru": "plan; planlamak"}, {"w": "goal", "e": "🎯", "x": "My goal is to teach Russian full-time online.", "ru": "hedef"}, {"w": "aim", "e": "🏹", "x": "The aim of the first lesson is to speak from minute one.", "ru": "amaç"}, {"w": "advertise", "e": "📢", "x": "I’m going to advertise my lessons on Instagram.", "ru": "reklam yapmak"}, {"w": "attract", "e": "🧲", "x": "Short videos attract new students.", "ru": "çekmek"}, {"w": "platform", "e": "💻", "x": "I teach on two platforms: Preply and italki.", "ru": "platform"}, {"w": "profile", "e": "🪪", "x": "I’m going to update my tutor profile with a new photo.", "ru": "profil"}, {"w": "price", "e": "🏷️", "x": "The price of one lesson is 20 dollars.", "ru": "fiyat"}, {"w": "package", "e": "📦", "x": "A package of ten lessons is cheaper.", "ru": "paket"}, {"w": "discount", "e": "💸", "x": "I’ll give you a ten percent discount.", "ru": "indirim"}, {"w": "grow", "e": "🌱", "x": "I want my business to grow slowly and safely.", "ru": "büyümek, büyütmek"}, {"w": "business", "e": "💼", "x": "Teaching online is a real business.", "ru": "iş, işletme"}, {"w": "customer", "e": "🧑‍💼", "x": "My students are also my customers.", "ru": "müşteri"}, {"w": "review", "e": "⭐", "x": "Good reviews bring new students.", "ru": "yorum, değerlendirme"}, {"w": "social media", "e": "📱", "x": "I post on social media twice a week.", "ru": "sosyal medya"}, {"w": "launch", "e": "🚀", "x": "I’m going to launch my website in March.", "ru": "başlatmak, piyasaya sürmek"}]}, {"week": 9, "topic": "Learning Languages: Advice and Rules", "lessons": [{"n": 25, "focus": "Speaking & Vocabulary", "classwork": ["Voice note (1 min): advice for a friend who wants to move abroad.", "Write 10 ‘teacher language’ phrases she will use in her lessons.", "Learn the 16 words in the Word Trainer."], "read": {"title": "How Selin Learned Spanish", "text": "Three years ago Selin, a hotel receptionist in Antalya, couldn't say a word of Spanish. Today she speaks it well enough to help guests from Madrid and Mexico. How did she do it? Here are her tips.\n\n'First, you should study a little every day,' she says. 'Twenty minutes every morning is more effective than three hours on Sunday. Learning a language is a habit, like going to the gym.'\n\nHer second tip is about mistakes. 'You shouldn't be afraid of them. When I started, I made hundreds of mistakes. My guests didn't laugh. They helped me.'\n\nSelin also says you shouldn't try to memorise long lists of words. 'I tried that, and I forgot everything after a week. It's better to learn words in sentences and revise them regularly. I use a flashcard app on the bus.'\n\nWhat about accent? 'Don't worry about your accent,' she smiles. 'People understand me, and that's enough. Focus on clear words, not a perfect accent.'\n\nHer last tip is about motivation. 'You should have a real goal. My goal was to talk to my guests. Every time I understood a guest, I felt more confident, and that gave me more motivation.'\n\nSelin has made a lot of progress, but she hasn't stopped. Now she is learning Italian. 'Same method,' she says. 'It works.'", "questions": [{"q": "Why did Selin learn Spanish?", "options": ["To talk to guests at her hotel.", "To move to Madrid.", "To pass an exam."], "answer": 0, "why": "'My goal was to talk to my guests.'"}, {"q": "What does she say about studying?", "options": ["Study for three hours on Sunday.", "Study a little every day.", "Study only with a teacher."], "answer": 1, "why": "'you should study a little every day.'"}, {"q": "What happened when she tried to memorise long lists of words?", "options": ["She remembered them all.", "She forgot everything after a week.", "She got a new job."], "answer": 1, "why": "'I tried that, and I forgot everything after a week.'"}, {"q": "What does she say about accent?", "options": ["You must have a perfect accent.", "Focus on clear words, not a perfect accent.", "Accent is the most important thing."], "answer": 1, "why": "'Focus on clear words, not a perfect accent.'"}, {"q": "What is she doing now?", "options": ["Learning Italian.", "Teaching Spanish.", "Working in Mexico."], "answer": 0, "why": "'Now she is learning Italian.'"}], "find": [{"meaning": "something you do often, almost without thinking", "word": "habit"}, {"meaning": "to study something again so that you remember it", "word": "revise"}, {"meaning": "the wish and the energy to keep doing something", "word": "motivation"}]}, "listen": {"title": "Moving to Berlin", "situation": "Leyla is moving to Germany for work. She asks her friend Chris, who has lived abroad, for advice.", "speakers": {"A": {"name": "Leyla", "accent": "en-GB"}, "B": {"name": "Chris", "accent": "en-IE"}}, "lines": [{"who": "A", "text": "Chris, I've got some news. I'm moving to Berlin in March!"}, {"who": "B", "text": "Wow, congratulations! Are you nervous?"}, {"who": "A", "text": "A bit. You've lived abroad. What should I do before I go?"}, {"who": "B", "text": "First, you should learn some basic German. Not perfect German, just the important phrases."}, {"who": "A", "text": "Should I take a course?"}, {"who": "B", "text": "Yes, an online course is a good idea. And try a language app too, ten minutes a day."}, {"who": "A", "text": "OK. What about a flat? Should I find one now?"}, {"who": "B", "text": "I think you should look online now, but you shouldn't pay anything before you see it. There are some dishonest people online."}, {"who": "A", "text": "Good tip. What else?"}, {"who": "B", "text": "You should make friends quickly. Join a club or a sports team. That's the best way to practise."}, {"who": "A", "text": "I'm not very confident in new places."}, {"who": "B", "text": "I know, but don't stay at home every evening. Say yes to every invitation in the first month."}, {"who": "A", "text": "That's difficult for me, but I'll try."}, {"who": "B", "text": "And one more thing: you shouldn't compare everything with home. Some things are just different."}, {"who": "A", "text": "Thanks, Chris. That's really helpful."}], "questions": [{"q": "Where is Leyla moving?", "options": ["Berlin.", "London.", "Dublin."], "answer": 0, "why": "'I'm moving to Berlin in March!'"}, {"q": "What does Chris say about German?", "options": ["She must speak perfect German.", "She should learn some important phrases.", "She doesn't need German."], "answer": 1, "why": "'Not perfect German, just the important phrases.'"}, {"q": "What shouldn't she do before she sees a flat?", "options": ["Look online.", "Pay anything.", "Ask her friends."], "answer": 1, "why": "'you shouldn't pay anything before you see it.'"}, {"q": "What is the best way to practise, according to Chris?", "options": ["Watching TV.", "Joining a club or a sports team.", "Reading books."], "answer": 1, "why": "'Join a club or a sports team. That's the best way to practise.'"}, {"q": "What does Chris say about comparing things with home?", "options": ["She should do it often.", "She shouldn't compare everything.", "She must write a list."], "answer": 1, "why": "'you shouldn't compare everything with home.'"}]}, "accents": {"sentences": [{"text": "You should revise new words every day.", "accent": "en-GB"}, {"text": "You shouldn't translate everything.", "accent": "en-US"}, {"text": "Try to listen to English songs in the car.", "accent": "en-AU"}, {"text": "Don't worry about your mistakes.", "accent": "en-IN"}, {"text": "Learning a language is a habit, like going to the gym.", "accent": "en-IE"}, {"text": "Focus on clear words, not a perfect accent.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Voice note (1 minute): advice for a friend who wants to move abroad.", "model": "So you want to move abroad? That's exciting! First, you should learn the language before you go, even a little. You should also look for a flat online, but you shouldn't pay before you see it. Try to make friends quickly, because it's lonely at the beginning. And don't compare everything with home. Some things are just different.", "checklist": ["I used 'should' and 'shouldn't'.", "I gave at least four pieces of advice.", "I gave a reason for some of them (because...)."]}, {"task": "Your student says: 'I forget new words very fast.' Give her three tips.", "model": "Don't worry, everybody forgets words! You should learn words in sentences, not in long lists. Try to revise them regularly, for example on the bus. And you should use new words in conversation on the same day. That really helps.", "checklist": ["I started with something kind.", "I used should / try to / don't.", "I used 'revise' or 'regularly'."]}, {"task": "Opinion: is it better to learn a language with a teacher or alone? Give your opinion, a reason and an example.", "model": "In my opinion, it's better to learn with a teacher, especially at the beginning. A teacher corrects your mistakes and gives you motivation. For example, I tried to learn Spanish alone with an app, but I stopped after two weeks. With a teacher, you have to come to the lesson, so you make progress.", "checklist": ["I said 'In my opinion' or 'I think'.", "I gave a reason (because...).", "I gave a real example."]}], "shadow": ["You should study a little every day.", "You shouldn't be afraid of mistakes.", "Don't worry about your accent."]}, "conf": {"minute_topics": ["The best way to learn new words, in your opinion", "A language you would like to learn one day, and why", "Your favourite student ever (no names!)", "A good habit you have", "What makes a lesson really fun"], "lifesavers": ["In my opinion, …", "I'd say that …"], "win": "Today I can give useful advice to a learner with should and shouldn't."}}, {"n": 26, "focus": "Listening & Grammar", "classwork": ["Write the 10 best ‘teacher language’ phrases she used or wants to use.", "Listen to one episode of a slow-English podcast (e.g. Learning English for Everyone or BBC Learning English) and summarise it in 3 sentences.", "Voice note: ‘My classroom rules’ (must / mustn’t / don’t have to)."], "read": {"title": "Rules for Online Students", "text": "Welcome to Bright Words Online School! We want every student to make fast progress, so please read our rules before your first lesson.\n\nBefore the lesson\nYou must book your lessons at least 24 hours before. You don't have to book every lesson separately: you can book a whole month at once. You have to check your camera and microphone before the lesson, because technical problems take a lot of time.\n\nDuring the lesson\nYou must be on time. Your teacher waits for ten minutes. After that, the lesson is cancelled and you have to pay for it. You mustn't record the lesson without asking your teacher first. You don't have to turn on your camera, but most students say it helps.\n\nHomework\nYou don't have to do homework, but we recommend it. Students who do homework regularly make twice as much progress. Your teacher sends homework by email after every lesson. You should send it back before the next lesson.\n\nCancelling\nYou have to cancel at least 12 hours before the lesson. Late cancellations cost the full price.\n\nPayment\nYou must pay before the first lesson of the month. You don't have to pay in cash: we accept cards and bank transfers.\n\nThank you, and enjoy your lessons!", "questions": [{"q": "When must students book their lessons?", "options": ["At least 24 hours before.", "12 hours before.", "On the same day."], "answer": 0, "why": "'You must book your lessons at least 24 hours before.'"}, {"q": "What happens after the teacher waits ten minutes?", "options": ["The lesson is cancelled and the student pays for it.", "The teacher calls the student.", "The lesson is shorter."], "answer": 0, "why": "'After that, the lesson is cancelled and you have to pay for it.'"}, {"q": "Can students record the lesson?", "options": ["Yes, always.", "Only after asking the teacher.", "No, never."], "answer": 1, "why": "'You mustn't record the lesson without asking your teacher first.'"}, {"q": "Do students have to turn on their camera?", "options": ["Yes, they must.", "No, they don't have to.", "Only in the first lesson."], "answer": 1, "why": "'You don't have to turn on your camera.'"}, {"q": "How can students pay?", "options": ["Only in cash.", "By card or bank transfer.", "Only by card."], "answer": 1, "why": "'we accept cards and bank transfers.'"}], "find": [{"meaning": "often, at the same times, for example every day or every week", "word": "regularly"}, {"meaning": "the way you move forward and get better", "word": "progress"}, {"meaning": "to say that something is a good idea for someone", "word": "recommend"}]}, "listen": {"title": "The rules of the course", "situation": "Daniel is starting an evening English course. The course coordinator, Mrs Hughes, explains the rules.", "speakers": {"A": {"name": "Mrs Hughes", "accent": "en-GB"}, "B": {"name": "Daniel", "accent": "en-US"}}, "lines": [{"who": "A", "text": "Hello, Daniel. Welcome to the course. Let me explain a few rules."}, {"who": "B", "text": "OK, thank you."}, {"who": "A", "text": "First, lessons start at seven, and you must be on time. The door closes at five past seven."}, {"who": "B", "text": "Do I have to buy a book?"}, {"who": "A", "text": "No, you don't have to buy a book. We give you all the materials."}, {"who": "B", "text": "Great. What about homework?"}, {"who": "A", "text": "You have to do homework every week. It's part of your final grade."}, {"who": "B", "text": "Can I use my phone in class?"}, {"who": "A", "text": "You can use it for the dictionary, but you mustn't make calls or check social media."}, {"who": "B", "text": "That's fair. And what happens when I'm ill?"}, {"who": "A", "text": "You have to send an email to your teacher before the lesson. You don't have to bring a note from a doctor."}, {"who": "B", "text": "And do I have to speak English all the time?"}, {"who": "A", "text": "In class, yes. You mustn't speak your own language. It's the best way to improve."}, {"who": "B", "text": "That's hard, but I understand."}, {"who": "A", "text": "Don't worry. Everybody feels nervous at first. You'll be fine."}, {"who": "B", "text": "Thank you. See you on Monday!"}], "questions": [{"q": "What time does the door close?", "options": ["At seven.", "At five past seven.", "At half past seven."], "answer": 1, "why": "'The door closes at five past seven.'"}, {"q": "Does Daniel have to buy a book?", "options": ["Yes, he does.", "No, he doesn't.", "Only in the first week."], "answer": 1, "why": "'No, you don't have to buy a book.'"}, {"q": "What mustn't Daniel do with his phone?", "options": ["Use the dictionary.", "Make calls or check social media.", "Bring it to class."], "answer": 1, "why": "'you mustn't make calls or check social media.'"}, {"q": "What does he have to do when he is ill?", "options": ["Bring a note from a doctor.", "Send an email to the teacher.", "Call the school."], "answer": 1, "why": "'You have to send an email to your teacher before the lesson.'"}, {"q": "Which language must he speak in class?", "options": ["His own language.", "English.", "Any language."], "answer": 1, "why": "'In class, yes. You mustn't speak your own language.'"}]}, "accents": {"sentences": [{"text": "Students must do their homework.", "accent": "en-GB"}, {"text": "You mustn't be late for the lesson.", "accent": "en-US"}, {"text": "You don't have to buy a book.", "accent": "en-AU"}, {"text": "We have to check the microphone before we start.", "accent": "en-IN"}, {"text": "You mustn't record the lesson without asking.", "accent": "en-IE"}, {"text": "Do I have to turn on my camera?", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Voice note: 'My classroom rules.' Tell new students your rules with must / mustn't / don't have to.", "model": "Welcome to my Russian lessons! Here are my rules. You must come on time, because our lessons are only sixty minutes. You must do your homework, but don't worry, it's short. You mustn't use a translator app during speaking practice. You don't have to buy a book: I send all the materials. And you don't have to be perfect. Mistakes are part of learning!", "checklist": ["I used must, mustn't and don't have to.", "I gave a reason for some rules.", "My voice was friendly."]}, {"task": "Explain the difference between 'You mustn't...' and 'You don't have to...' like a teacher. Give your own example for each.", "model": "'Mustn't' means it is not allowed. For example, you mustn't use your phone during a test. 'Don't have to' means it is not necessary; it's your choice. For example, you don't have to turn on your camera, but you can if you want.", "checklist": ["I explained 'not allowed' and 'not necessary'.", "I gave one example for each.", "I spoke slowly and clearly, like a teacher."]}, {"task": "Mini-lesson (2-3 minutes): teach five Russian greetings to an English-speaking beginner. Use teacher language: Listen and repeat, Let's practise, Well done...", "model": "Hello everyone! Today we're going to learn five Russian greetings. Listen and repeat: 'Privet.' That means 'Hi'. You should use it with friends, not with your boss. Good. Now, 'Zdravstvuyte'. It's long, I know! Let's say it slowly together. Well done! Now practise with your partner. You don't have to be perfect. Just try.", "checklist": ["I used imperatives (Listen, Repeat, Try).", "I gave a rule with should or mustn't.", "I praised the student (Well done!)."]}], "shadow": ["You must be on time.", "You don't have to buy a book.", "You mustn't make calls in class."]}, "conf": {"minute_topics": ["Why Russian is a wonderful language to learn", "Three rules every student must know about your lessons", "Something students don't have to worry about at the beginning", "Your first day as a teacher", "A word in Russian that you love, and what it means"], "lifesavers": ["That's a good question.", "Let me explain it another way."], "win": "Today I can teach a short lesson in English and explain the rules clearly."}}, {"n": 27, "focus": "Writing & Fluency", "classwork": ["Send the corrected blog post and the podcast recording to the teacher.", "Voice note: advice for a friend who wants to move abroad (if not done).", "Shadow the model text (5 tips) once a day."], "read": {"title": "5 Tips for Learning Turkish", "text": "When I moved to Izmir eight years ago, I only knew two Turkish words: 'merhaba' and 'evet'. Today I teach English in a Turkish school, and I speak Turkish every day. Here are my five best tips.\n\n1. Learn the most useful phrases first. You don't have to learn all the grammar at the beginning. Phrases for shopping, transport and the cafe are much more effective.\n\n2. Listen every day. Turn on Turkish radio when you cook. You don't have to understand everything. Your ears get used to the sounds.\n\n3. Don't be afraid of mistakes. People here are very kind to foreigners who try. When you make a mistake, smile and try again.\n\n4. Make it a habit. Fifteen minutes every day is better than two hours once a week. I revised new words on the ferry every morning.\n\n5. Find a conversation partner. You should practise with a real person regularly. I met my partner, Burcu, at a language cafe. I helped her with English, and she helped me with Turkish.\n\nOne last thing: you mustn't compare your progress with other people. Everybody learns at a different speed. Focus on your own goal, and you'll get there.\n\nGood luck!\nHannah", "questions": [{"q": "How many Turkish words did Hannah know when she moved?", "options": ["None.", "Two.", "Twenty."], "answer": 1, "why": "'I only knew two Turkish words.'"}, {"q": "What should you learn first, according to tip 1?", "options": ["All the grammar.", "The most useful phrases.", "Long lists of words."], "answer": 1, "why": "'Learn the most useful phrases first.'"}, {"q": "Where did Hannah revise new words?", "options": ["On the ferry.", "At the cafe.", "At school."], "answer": 0, "why": "'I revised new words on the ferry every morning.'"}, {"q": "How did Hannah meet Burcu?", "options": ["At school.", "At a language cafe.", "On the ferry."], "answer": 1, "why": "'I met my partner, Burcu, at a language cafe.'"}, {"q": "What mustn't you do?", "options": ["Make mistakes.", "Compare your progress with other people.", "Listen to the radio."], "answer": 1, "why": "'you mustn't compare your progress with other people.'"}], "find": [{"meaning": "working well and giving good results", "word": "effective"}, {"meaning": "studied something again so that you remember it", "word": "revised"}, {"meaning": "how much better you are getting", "word": "progress"}]}, "listen": {"title": "Language Habits podcast", "situation": "Paul interviews Vera, a Russian teacher, on his podcast about learning languages.", "speakers": {"A": {"name": "Paul", "accent": "en-AU"}, "B": {"name": "Vera", "accent": "en-GB"}}, "lines": [{"who": "A", "text": "Welcome back to Language Habits. Today my guest is Vera, a Russian teacher. Hi, Vera!"}, {"who": "B", "text": "Hi, Paul. Thanks for inviting me."}, {"who": "A", "text": "Many listeners say Russian is very difficult. Is that true?"}, {"who": "B", "text": "Some things are difficult, like the cases. But you don't have to learn everything at once. Start with the alphabet. It only takes a week."}, {"who": "A", "text": "Only a week? Really?"}, {"who": "B", "text": "Yes! Many letters are similar to English. You should learn ten letters a day and read simple words."}, {"who": "A", "text": "What about vocabulary?"}, {"who": "B", "text": "Don't try to memorise long lists. Learn words in short phrases, and revise them regularly. I recommend flashcards."}, {"who": "A", "text": "And speaking? Many people are shy."}, {"who": "B", "text": "That's normal. My tip is: speak from the first lesson. You mustn't wait until your grammar is perfect, because it's never perfect!"}, {"who": "A", "text": "Ha! That's true for every language. What's the most common mistake your students make?"}, {"who": "B", "text": "They study hard for two weeks and then they stop. Their motivation goes down. So you should set small goals, like ten new words a week."}, {"who": "A", "text": "Great advice. One last question: which method do you like best?"}, {"who": "B", "text": "Songs! Russian songs are beautiful, and they help with pronunciation."}, {"who": "A", "text": "Vera, thank you so much."}], "questions": [{"q": "What is the name of Paul's podcast?", "options": ["Language Habits.", "Russian Today.", "Learning Together."], "answer": 0, "why": "'Welcome back to Language Habits.'"}, {"q": "How long does it take to learn the Russian alphabet, according to Vera?", "options": ["A day.", "A week.", "A month."], "answer": 1, "why": "'Start with the alphabet. It only takes a week.'"}, {"q": "How should students learn vocabulary?", "options": ["In long lists.", "In short phrases, with regular revision.", "Only from songs."], "answer": 1, "why": "'Learn words in short phrases, and revise them regularly.'"}, {"q": "What is the most common mistake students make?", "options": ["They speak too early.", "They study hard and then stop.", "They learn too many songs."], "answer": 1, "why": "'They study hard for two weeks and then they stop.'"}, {"q": "Why does Vera like songs?", "options": ["They are short.", "They help with pronunciation.", "They are easy to find."], "answer": 1, "why": "'they help with pronunciation.'"}]}, "accents": {"sentences": [{"text": "Learn the most useful phrases first.", "accent": "en-GB"}, {"text": "You don't have to understand everything.", "accent": "en-US"}, {"text": "Fifteen minutes every day is better than two hours once a week.", "accent": "en-AU"}, {"text": "You should practise with a real person regularly.", "accent": "en-IN"}, {"text": "Everybody learns at a different speed.", "accent": "en-IE"}, {"text": "Set small goals, like ten new words a week.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Record your blog post '5 tips for learning Russian' as a 1-minute podcast. Read it naturally, not too fast.", "model": "Hello and welcome! Today I have five tips for learning Russian. One: start with the alphabet. It's easier than you think. Two: learn words in short phrases. Three: listen to Russian songs every day. Four: don't be afraid of mistakes. And five: find a teacher or a conversation partner and practise regularly. Good luck, and see you next time!", "checklist": ["I numbered my tips clearly.", "I used imperatives (Start, Learn, Don't...).", "I spoke naturally, with pauses between tips."]}, {"task": "A student asks: 'Do I have to learn all the grammar before I speak?' Answer with must / don't have to / should.", "model": "No, you don't have to learn all the grammar first. You should start speaking from the first lesson. Of course, you must learn some basic grammar, like the present tense, but you can learn the rest step by step. Speaking gives you confidence, and confidence helps you learn faster.", "checklist": ["I answered the question directly.", "I used don't have to, should and must.", "I gave a reason."]}, {"task": "4-3-2: talk about the best way to learn a language. 1 minute, then 45 seconds, then 30 seconds.", "model": "I think the best way to learn a language is to make it a habit. You should study a little every day, not a lot once a week. You should also listen and speak from the beginning. Don't be afraid of mistakes, because mistakes help you learn. And finally, have a clear goal. Motivation is very important.", "checklist": ["Each time I spoke more smoothly.", "I used at least three words from this week (habit, goal, motivation, regularly...).", "I kept my main ideas."]}], "shadow": ["Start with the alphabet. It's easier than you think.", "You mustn't wait until your grammar is perfect.", "Set small goals, like ten new words a week."]}, "conf": {"minute_topics": ["Your top tip for learnin
