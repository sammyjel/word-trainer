<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speak with Confidence Homework</title>
<meta name="description" content="Homework for every lesson: watch, listen, accents, reading and speaking practice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one column. Lesson picker (weeks → 3 lessons), then the lesson desk: class homework checklist, six activity tabs, send-results bar. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#18222b; --muted:#5e6b72; --line:#dbe2e0;
  --teal:#0f6e6e; --teal-soft:#e2f0ee; --coral:#d9573b; --coral-soft:#fbe9e3; --good:#1f7a46; --bad:#b3261e;
  --display:'Fraunces', Georgia, 'Times New Roman', serif;
  --body:'Manrope', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1517; --surface:#172124; --ink:#e8efee; --muted:#9aaaa8; --line:#2a3a3c;
  --teal:#4fb7ad; --teal-soft:#183a38; --coral:#f08165; --coral-soft:#3b2420; --good:#5fcf8e; --bad:#ff8a80; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1517; --surface:#172124; --ink:#e8efee; --muted:#9aaaa8; --line:#2a3a3c;
  --teal:#4fb7ad; --teal-soft:#183a38; --coral:#f08165; --coral-soft:#3b2420; --good:#5fcf8e; --bad:#ff8a80; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
header h1{font-size:clamp(28px,6vw,40px)}
header p{margin:6px 0 0;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--coral)}
.weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px;text-align:left;cursor:pointer;font:600 14px var(--body);min-width:0}
.lbtn b{display:block;font-family:var(--display);font-size:17px}
.lbtn small{display:block;color:var(--muted);font-weight:500;font-size:12px;overflow-wrap:anywhere}
.lbtn[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.lbtn .ticks{font-size:12px;color:var(--good);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.classhw h3{font-size:18px;margin-bottom:6px}
.classhw label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.classhw input{width:20px;height:20px;margin-top:2px;accent-color:var(--good);flex:0 0 auto}
.streak{display:inline-flex;gap:6px;align-items:center;background:var(--coral-soft);color:var(--coral);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;margin-top:8px}
.big-timer{font-family:var(--display);font-size:64px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.topic-card{background:var(--teal-soft);border-radius:14px;padding:18px;font-size:20px;font-weight:700;text-align:center;text-wrap:balance}
.record{display:flex;justify-content:space-around;text-align:center;gap:8px;flex-wrap:wrap}
.record div{flex:1 1 90px;border:1px solid var(--line);border-radius:12px;padding:8px}
.record b{display:block;font-family:var(--display);font-size:26px}
.celebrate{font-size:22px;font-weight:800;text-align:center;color:var(--good);animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.rate{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rate button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 0;font:800 15px var(--body);cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.journey{display:flex;align-items:flex-end;gap:3px;height:70px;border-bottom:1px solid var(--line);padding-top:6px}
.journey i{flex:1;background:var(--teal);border-radius:3px 3px 0 0;min-width:4px;opacity:.85}
.journey i.now{background:var(--coral);opacity:1}
.life{display:flex;flex-wrap:wrap;gap:6px}
.life button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 14px var(--body);cursor:pointer}
.life button.new{border-color:var(--coral);background:var(--coral-soft)}
.mission-box{border:2px solid var(--coral);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:0;z-index:5}
.tab{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:9px 2px;font:700 13px var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab .ic{font-size:18px;line-height:1;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tab .done{font-size:10px;color:var(--good);min-height:12px}
.tab[aria-selected="true"] .done{color:var(--surface)}
.stage{display:flex;flex-direction:column;gap:14px;min-height:300px}
.how{background:var(--teal-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.how .tr{display:block;color:var(--muted);font-style:italic;margin-top:2px}
.btn{border:0;border-radius:10px;padding:11px 16px;font:700 15px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--teal);color:var(--surface)} .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.warn{background:var(--coral);color:var(--surface)} .btn.good{background:var(--good);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.rec{background:var(--bad);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:13px}
.qblock{border-top:1px solid var(--line);padding-top:12px}
.qq{font-weight:700;margin-bottom:6px}
.opts{display:grid;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:600 15px var(--body);cursor:pointer;text-align:left}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt:disabled{cursor:default;color:var(--ink)}
.why{font-size:14px;color:var(--muted);margin-top:6px}
.score{display:flex;justify-content:space-between;align-items:center;background:var(--coral-soft);border-radius:10px;padding:10px 14px;font-weight:700}
.score .big{font-family:var(--display);font-size:26px}
.text p{margin:0 0 12px}
.text{font-size:17px;line-height:1.7}
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.line{padding:6px 10px;border-radius:8px;margin:2px 0}
.line b{color:var(--teal)}
.line.on{background:var(--coral-soft)}
.who{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}
.who span{background:var(--teal-soft);border-radius:999px;padding:3px 10px}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:500 16px var(--body)}
.acc{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.diff span{padding:0 2px;border-radius:3px}
.diff .ok{background:color-mix(in srgb,var(--good) 18%,transparent)}
.diff .miss{background:color-mix(in srgb,var(--bad) 18%,transparent);text-decoration:underline wavy var(--bad)}
.prompt{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.prompt h3{font-size:18px}
.count{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
audio{width:100%}
.model{background:var(--teal-soft);border-radius:10px;padding:10px 12px}
.check label{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:3px 0;cursor:pointer}
.check input{accent-color:var(--good);width:18px;height:18px;flex:0 0 auto}
.send{position:sticky;bottom:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 14px;box-shadow:0 6px 20px rgb(0 0 0 / .18)}
.send .btn{background:var(--surface);color:var(--ink)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.words div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.words b{display:block}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--coral);padding-left:10px}
footer{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:560px){ .tab{font-size:10px;padding:8px 0} .tab .ic{font-size:17px} .rate button{padding:8px 0;font-size:13px} .lessons{grid-template-columns:1fr} .panel{padding:14px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Speak with Confidence · 12-week programme</div>
    <h1>Homework</h1>
    <p>Choose today's lesson. Start with 💬 Talk, do the activities, then send your results to your teacher.</p>
    <div class="streak" id="streak"></div>
  </header>

  <nav class="weeks" id="weeks" aria-label="Choose a week"></nav>
  <div class="lessons" id="lessons"></div>

  <section class="panel classhw" id="classhw"></section>

  <div class="tabs" role="tablist" id="tabs"></div>
  <main class="panel stage" id="stage" aria-live="polite"></main>

  <div class="send"><span id="sum" class="small"></span><button class="btn" id="sendBtn">📤 Send my results to my teacher</button></div>
  <footer>Your answers are saved on this device only. Voice recordings stay on your phone until you send them.</footer>
</div>

<script>
const HW = {"weeks": [{"week": 1, "topic": "Me and My Work", "lessons": [{"n": 1, "focus": "Speaking & Vocabulary", "classwork": ["Send a 1-minute voice note: ‘My job and my students’.", "Learn the 16 words (Word Trainer or the paper cards).", "Write 5 true sentences about yourself using 5 of the new words."], "read": {"title": "Meet Daniel, an online tutor", "text": "Daniel is thirty-four and he lives in Antalya. He is from Manchester, so he is a native speaker of English. He is a teacher and a tutor. He teaches English online from his flat.\n\nMost of his students are adults. Some are beginners and some are advanced. Daniel has a qualification in teaching English, and he has ten years of experience.\n\nHis favourite subject is pronunciation. He says, 'Grammar is important, but students need to hear and say the words.' Every lesson starts with a short conversation.\n\nDaniel also speaks Turkish, but he is not fluent. He has a Turkish teacher, and he has one lesson every week. His hobby is cooking. He doesn't like big classes. He likes one-to-one lessons because every student gets time to speak.", "questions": [{"q": "Where is Daniel from?", "options": ["Antalya", "Manchester", "London"], "answer": 1, "why": "'He is from Manchester, so he is a native speaker.'"}, {"q": "Where does Daniel teach?", "options": ["in a school", "online from his flat", "at a university"], "answer": 1, "why": "'He teaches English online from his flat.'"}, {"q": "What is his favourite subject?", "options": ["pronunciation", "grammar", "Turkish"], "answer": 0, "why": "'His favourite subject is pronunciation.'"}, {"q": "Is Daniel fluent in Turkish?", "options": ["Yes, he is.", "No, he isn't.", "The text doesn't say."], "answer": 1, "why": "'He speaks Turkish, but he is not fluent.'"}, {"q": "Why does he like one-to-one lessons?", "options": ["They are cheap.", "He has no experience with groups.", "Every student gets time to speak."], "answer": 2, "why": "'...because every student gets time to speak.'"}], "find": [{"meaning": "a person who speaks a language from birth", "word": "native speaker"}, {"meaning": "a paper that shows you are trained for a job", "word": "qualification"}, {"meaning": "something you do for fun", "word": "hobby"}]}, "listen": {"title": "At a language exchange", "situation": "Marta, a translator, meets Tom at a language exchange evening in Antalya.", "speakers": {"A": {"name": "Marta", "accent": "en-GB"}, "B": {"name": "Tom", "accent": "en-US"}}, "lines": [{"who": "A", "text": "Hi, I'm Marta. Is this your first time here?"}, {"who": "B", "text": "Yes, it is. I'm Tom. Nice to meet you."}, {"who": "A", "text": "Nice to meet you too. What do you do, Tom?"}, {"who": "B", "text": "I'm an English teacher. I teach online. And you?"}, {"who": "A", "text": "I'm a translator. I translate books and websites from Spanish into English."}, {"who": "B", "text": "Interesting! Do you speak Turkish too?"}, {"who": "A", "text": "A little. I'm a beginner. I have a lesson every Monday."}, {"who": "B", "text": "Me too. My Turkish grammar is terrible!"}, {"who": "A", "text": "Does your teacher speak English?"}, {"who": "B", "text": "No, she doesn't. That's good for me, because I practise all the time."}, {"who": "A", "text": "What's your hobby, Tom?"}, {"who": "B", "text": "Photography. And yours?"}, {"who": "A", "text": "Cooking. I love Turkish food!"}], "questions": [{"q": "What is Marta's job?", "options": ["teacher", "translator", "cook"], "answer": 1, "why": "Marta: 'I'm a translator.'"}, {"q": "How does Tom teach?", "options": ["online", "in a school", "at the cafe"], "answer": 0, "why": "Tom: 'I teach online.'"}, {"q": "When does Marta have a Turkish lesson?", "options": ["every Friday", "every Monday", "every day"], "answer": 1, "why": "Marta: 'I have a lesson every Monday.'"}, {"q": "Does Tom's teacher speak English?", "options": ["Yes, she does.", "Tom doesn't know.", "No, she doesn't."], "answer": 2, "why": "Tom: 'No, she doesn't.'"}, {"q": "What is Tom's hobby?", "options": ["photography", "cooking", "music"], "answer": 0, "why": "Tom: 'Photography.'"}]}, "accents": {"sentences": [{"text": "I am a teacher and a translator.", "accent": "en-GB"}, {"text": "Do you teach online?", "accent": "en-US"}, {"text": "She has ten years of experience.", "accent": "en-AU"}, {"text": "My students are beginners.", "accent": "en-IN"}, {"text": "Does he speak English fluently?", "accent": "en-IE"}, {"text": "Pronunciation is my favourite subject.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Introduce yourself: your city, your job, your students and your languages.", "model": "Hello! I live in Antalya and I am a teacher. I teach Russian to teenagers and adults. Some of my students are beginners and some are advanced. I speak Turkish, Russian and a little English. My English is not fluent yet, but I practise every day.", "checklist": ["I said my city and my job.", "I used 'I am' and 'I teach' correctly.", "I named my languages."]}, {"task": "Talk about your students. Who are they? Why do they learn Russian?", "model": "I have twelve students. Most of them are adults. They learn Russian for work or for travel. One student is a doctor, and she has a lesson every Tuesday. My students like conversation, but they don't like grammar!", "checklist": ["I used he/she + -s (she has, he learns).", "I used don't or doesn't.", "I used 3 new words."]}, {"task": "Ask your English teacher four questions about the job. Use Do you...? and Does...?", "model": "Do you teach online or face to face? Do you have many students? Does your favourite student speak Turkish? Do you like grammar lessons?", "checklist": ["My questions start with Do or Does.", "After does, the verb has no -s.", "I asked 4 questions."]}], "shadow": ["I'm a teacher, and I teach Russian online.", "Do you speak any other languages?", "She doesn't teach grammar on Fridays."]}, "conf": {"minute_topics": ["Talk for one minute about your job.", "Talk for one minute about your favourite student (no names!).", "Talk for one minute about a hobby you love.", "Talk for one minute about why you like teaching.", "Talk for one minute about the languages you speak."], "lifesavers": ["Let me think…", "How do you say … in English?"], "win": "Today I can introduce myself and my job in English."}}, {"n": 2, "focus": "Listening & Grammar", "classwork": ["Shadow the Marta recording 3 times (speak at the same time as the recording).", "Write 6 sentences about a colleague or friend (He/She… doesn’t… Does…?).", "Revise the 16 vocabulary cards."], "read": {"title": "My colleague Selin", "text": "Selin is my colleague. She is a translator, and she works in a small office in Izmir. She translates websites and letters from English into Turkish.\n\nSelin starts work at nine o'clock. She doesn't work at the weekend. She has a big dictionary on her desk, but she doesn't use it very much. She uses the internet!\n\nHer English is fluent. She studies German too, but she is still a beginner. She has a German lesson online twice a week. Her teacher is a native speaker from Berlin.\n\nSelin's husband, Murat, is a teacher. He teaches maths at a secondary school. He doesn't speak English, so Selin helps him with his emails. They have two children and a cat. Their hobby is walking in the mountains.", "questions": [{"q": "What does Selin translate?", "options": ["books and films", "websites and letters", "emails into English"], "answer": 1, "why": "'She translates websites and letters from English into Turkish.'"}, {"q": "Does Selin work at the weekend?", "options": ["No, she doesn't.", "Yes, she does.", "Only on Sundays."], "answer": 0, "why": "'She doesn't work at the weekend.'"}, {"q": "What does she use most for her work?", "options": ["a big dictionary", "the internet", "her husband"], "answer": 1, "why": "'...she doesn't use it very much. She uses the internet!'"}, {"q": "How often does she have a German lesson?", "options": ["once a week", "every day", "twice a week"], "answer": 2, "why": "'She has a German lesson online twice a week.'"}, {"q": "What is Murat's job?", "options": ["He is a translator.", "He is a maths teacher.", "He is a German teacher."], "answer": 1, "why": "'He teaches maths at a secondary school.'"}], "find": [{"meaning": "a person you work with", "word": "colleague"}, {"meaning": "able to speak a language very easily", "word": "fluent"}, {"meaning": "a person who is new to a subject", "word": "beginner"}]}, "listen": {"title": "A translator's job", "situation": "Tom interviews Marta for a podcast about language jobs.", "speakers": {"A": {"name": "Marta", "accent": "en-GB"}, "B": {"name": "Tom", "accent": "en-US"}}, "lines": [{"who": "B", "text": "Marta, you're a translator. What do you translate?"}, {"who": "A", "text": "Mostly books. I translate novels from Spanish into English."}, {"who": "B", "text": "Do you work at home?"}, {"who": "A", "text": "Yes, I do. I have a small office in my flat."}, {"who": "B", "text": "Does your husband work at home too?"}, {"who": "A", "text": "No, he doesn't. He's a doctor. He works at a hospital."}, {"who": "B", "text": "What do you like about your job?"}, {"who": "A", "text": "I love words. And I meet interesting writers."}, {"who": "B", "text": "Is it a difficult job?"}, {"who": "A", "text": "Yes, it is. Every language has its own grammar, and some words don't have a translation."}, {"who": "B", "text": "What do you say to new translators?"}, {"who": "A", "text": "Read a lot, in both languages. That's the secret."}], "questions": [{"q": "What does Marta translate?", "options": ["films", "novels", "letters"], "answer": 1, "why": "Marta: 'I translate novels from Spanish into English.'"}, {"q": "Where does Marta work?", "options": ["at home", "in a big office", "at a hospital"], "answer": 0, "why": "Marta: 'I have a small office in my flat.'"}, {"q": "What is her husband's job?", "options": ["writer", "translator", "doctor"], "answer": 2, "why": "Marta: 'He's a doctor.'"}, {"q": "What does Marta love about her job?", "options": ["the money", "words and meeting writers", "travelling"], "answer": 1, "why": "Marta: 'I love words. And I meet interesting writers.'"}, {"q": "What is her advice for new translators?", "options": ["Read a lot in both languages.", "Use a good dictionary.", "Study grammar every day."], "answer": 0, "why": "Marta: 'Read a lot, in both languages.'"}]}, "accents": {"sentences": [{"text": "She teaches English at a language school.", "accent": "en-US"}, {"text": "He doesn't have a qualification.", "accent": "en-GB"}, {"text": "Does she work online?", "accent": "en-AU"}, {"text": "My colleague translates books.", "accent": "en-IE"}, {"text": "He has a lot of experience.", "accent": "en-IN"}, {"text": "They don't speak Russian.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Describe a colleague or a friend: the job, the place of work, and one thing he or she doesn't do.", "model": "My friend Deniz is a nurse. She works at a big hospital in Antalya. She starts work very early. She doesn't like Mondays, but she loves her job. She doesn't speak Russian, but she wants lessons with me!", "checklist": ["I used he/she + -s every time.", "I used doesn't + verb (no -s).", "I spoke for 30 seconds or more."]}, {"task": "Describe Marta from the listening. What does she do? Where does she work?", "model": "Marta is a translator. She translates novels from Spanish into English. She works at home, in a small office in her flat. Her husband is a doctor. He works at a hospital. She loves words, and she meets interesting writers.", "checklist": ["I said 'she translates', 'she works' with -s.", "I said 'her husband', not 'his husband'.", "I gave 4 facts."]}, {"task": "A mother calls you about Russian lessons for her son. Ask her four questions.", "model": "How old is your son? Does he speak a little Russian? Does he have lessons on Saturdays? Do you want online lessons or lessons at home?", "checklist": ["I used Does Anna", "Lucia", "Kerem"], "answer": 1, "why": "Lucia: 'I am also a translator.'"}, {"q": "What are Anna's lessons about?", "options": ["grammar and writing", "Turkish for beginners", "speaking and pronunciation"], "answer": 2, "why": "Anna: 'My lessons are about speaking and pronunciation.'"}, {"q": "Kerem says he doesn't teach...", "options": ["adults", "children", "beginners"], "answer": 1, "why": "Kerem: 'I don't teach children.'"}], "find": [{"meaning": "a person who changes text from one language to another", "word": "translator"}, {"meaning": "the way you say words", "word": "pronunciation"}, {"meaning": "the years you do a job", "word": "experience"}]}, "listen": {"title": "Calling a tutor", "situation": "Jack sees Elena's profile on a tutor website and calls her.", "speakers": {"A": {"name": "Elena", "accent": "en-IE"}, "B": {"name": "Jack", "accent": "en-AU"}}, "lines": [{"who": "B", "text": "Hello, is that Elena? I see your profile on a tutor website."}, {"who": "A", "text": "Yes, hello! How can I help you?"}, {"who": "B", "text": "I'm a beginner. Do you teach beginners?"}, {"who": "A", "text": "Yes, I do. Most of my students are beginners."}, {"who": "B", "text": "Great. Do you have a qualification?"}, {"who": "A", "text": "Yes. I have a teaching qualification, and I have six years of experience."}, {"who": "B", "text": "Are your lessons online?"}, {"who": "A", "text": "Yes, they are. Every lesson is fifty minutes."}, {"who": "B", "text": "And what do you teach? Grammar?"}, {"who": "A", "text": "Grammar, yes, but my lessons are mostly speaking and pronunciation."}, {"who": "B", "text": "Perfect. How much is a lesson?"}, {"who": "A", "text": "It's twenty euros. The first lesson is free."}, {"who": "B", "text": "Wonderful. Thank you, Elena!"}], "questions": [{"q": "Why does Jack call Elena?", "options": ["He sees her profile on a website.", "He is her colleague.", "She is his friend."], "answer": 0, "why": "Jack: 'I see your profile on a tutor website.'"}, e day at work", "the money you earn"], "answer": 0, "why": "\"'Career' is a word we use to talk more about our work in the long term.\""}, {"q": "We use 'since' with...", "options": ["a length of time", "a date or a point in time", "a place"], "answer": 1, "why": "\"We use 'since' followed by a date or a point in time.\""}, {"q": "Complete: \"I worked in a fish and chip shop ___ a summer.\"", "options": ["since", "for", "at"], "answer": 1, "why": "\"I worked in a fish and chip shop for a summer.\""}], "after": "Retell in 4-5 sentences: Who are Neil and Beth? What jobs have they had? Record it."}}}, "words": [{"w": "teacher / tutor", "e": "👩‍🏫", "x": "I am a Russian teacher. I also work as a private tutor.", "ru": "öğretmen / özel ders öğretmeni"}, {"w": "translator", "e": "📝🌍", "x": "A translator changes a text from one language into another.", "ru": "çevirmen"}, {"w": "native speaker", "e": "🗣️🇷🇺", "x": "I am a native speaker of Russian.", "ru": "anadili konuşan kişi"}, {"w": "language", "e": "🔤", "x": "Russian is a beautiful but difficult language.", "ru": "dil"}, {"w": "subject", "e": "📚", "x": "My subject is Russian language and literature.", "ru": "ders, konu"}, {"w": "lesson", "e": "🧑‍💻📖", "x": "My lessons are fifty minutes long.", "ru": "ders"}, {"w": "beginner", "e": "🌱", "x": "Most of my students are beginners.", "ru": "başlangıç seviyesi"}, {"w": "advanced", "e": "🏔️", "x": "Advanced students read Russian books.", "ru": "ileri seviye"}, {"w": "grammar", "e": "🧩", "x": "Russian grammar has six cases.", "ru": "dil bilgisi"}, {"w": "pronunciation", "e": "👄", "x": "My pronunciation in English is getting better.", "ru": "telaffuz"}, {"w": "experience", "e": "⏳🏅", "x": "I have ten years of teaching experience.", "ru": "deneyim"}, {"w": "qualification", "e": "🎓📜", "x": "I have a university qualification in teaching.", "ru": "yeterlilik, diploma"}, {"w": "fluent", "e": "💬✨", "x": "I want to be fluent in English.", "ru": "akıcı"}, {"w": "online", "e": "💻🌐", "x": "I on?", "options": ["by phone", "by message", "by email"], "answer": 1, "why": "'Their parents usually book a lesson by message.'"}, {"q": "When is Hana never available?", "options": ["on Saturday", "on weekdays", "on Sunday"], "answer": 2, "why": "'Hana is never available on Sunday.'"}], "find": [{"meaning": "Monday to Friday", "word": "weekdays"}, {"meaning": "free to meet; not busy", "word": "available"}, {"meaning": "a plan of lessons and times", "word": "timetable"}]}, "listen": {"title": "Finding a time", "situation": "Laura, a tutor, and David, a new student, try to find a time for the first lesson.", "speakers": {"A": {"name": "Laura", "accent": "en-GB"}, "B": {"name": "David", "accent": "en-ZA"}}, "lines": [{"who": "B", "text": "Hi Laura, it's David. I want to book a lesson."}, {"who": "A", "text": "Hi David! Great. When are you available?"}, {"who": "B", "text": "I'm usually free on weekday evenings."}, {"who": "A", "text": "Hmm, I'm often busy in the evenings. What about Tuesday at five?"}, {"who": "B", "text": "Sorry, I always have a meeting on Tuesday afternoon."}, {"who": "A", "text": "OK. Are you free on Thursday at six?"}, {"who": "B", "text": "Thursday... yes, that's fine."}, {"who": "A", "text": "Perfect. And do you sometimes have time at the weekend?"}, {"who": "B", "text": "Rarely. I usually visit my parents on Saturdays."}, {"who": "A", "text": "No problem. So, Thursday at six. The lesson is online, and I always send the link by email."}, {"who": "B", "text": "Great. See you on Thursday!"}], "questions": [{"q": "When is David usually free?", "options": ["weekday mornings", "weekday evenings", "Saturday morning"], "answer": 1, "why": "David: 'I'm usually free on weekday evenings.'"}, {"q": "Why can't David come on Tuesday?", "options": ["He has a meeting.", "He visits his parents.", "He is on holiday."], "answer": 0, "why": "David: 'I always have a meeting on Tuesday afternoon.'"}, {"q": "When is the lesson?", "options": ["Tuesday at five", "Saturday at six", "Thursday at six"], "answer": 2, "why": "Laura: 'So, Thursday at six.'"}, {"q": "What does David usually do on Saturdays?", "options": ["He works.", "He visits his parents.", "He has a lesson."], "answer": 1, "why": "David: 'I usually visit my parents on Saturdays.'"}, {"q": "How does Laura send the link?", "options": ["by email", "by message", "by phone"], "answer": 0, "why": "Laura: 'I always send the link by email.'"}]}, "accents": {"sentences": [{"text": "I usually get up at seven o'clock.", "accent": "en-GB"}, {"text": "She never checks her emails at night.", "accent": "en-US"}, {"text": "Are you available on Friday?", "accent": "en-AU"}, {"text": "We often have lessons in the evening.", "accent": "en-IN"}, {"text": "I'm sorry, I'm busy on Monday.", "accent": "en-IE"}, {"text": "He rarely has free time on weekdays.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Describe your weekend. Use three frequency adverbs (usually, often, sometimes, rarely, never).", "model": "On Saturday I usually get up late, at about nine. I often have breakfast with my family. I sometimes have one or two online lessons in the morning. In the afternoon we usually go to the beach or to the market. On Sunday I never work. I rarely check my emails at the weekend.", "checklist": ["I used 3 frequency adverbs.", "The adverb is before the main verb (I usually get up).", "I used on + day and at + time."]}, {"task": "A student wants a lesson. Say when you are available and when you are busy.", "model": "I'm available on Monday and Wednesday afternoons. I'm usually busy on Tuesday and Thursday, because I have group lessons. On Friday I'm free in the morning. I'm never available on Sunday. That's my free time!", "checklist": ["I used available and busy.", "The adverb is after 'am' (I'm usually busy).", "I gave days and times."]}, {"task": "Describe your typical weekday, from morning to evening.", "model": "I usually get up at seven. I have breakfast and then I check my emails. I prepare my lessons in the morning. My first lesson is often at eleven. I have lunch at one. In the afternoon I teach two or three students. In the evening I cook dinner and sometimes watch a film.", "checklist": ["I spoke in order: morning, afternoon, evening.", "I used then.", "I used the present simple."]}], "shadow": ["I usually get up at seven o'clock.", "Are you available on Thursday at six?", "I never check my emails on Sundays."]}, "conf": {"minute_topics": ["Talk for one minute about your Monday.", "Talk for one minute about your perfect weekend.", "Talk for one minute about what you usually do in the morning.", "Talk for one minute about something you never do.", "Talk for one minute about your free time."], "lifesavers": ["Hmm, good question.", "Can you speak more slowly, please?"], "win": "Today I can describe my week with usually, often and never."}}, {"n": 5, "focus": "Listening & Grammar", "classwork": ["Shadow the Paul text 3 times.", "Write 8 sentences about your week with at / on / in.", "Practise saying 10 clock times aloud."], "read": {"title": "Paul's timetable", "text": "Paul is an English tutor, and he has a busy timetable. He has lessons in the morning, in the afternoon and in the evening.\n\nOn Mondays he teaches a group of doctors at nine o'clock. They are advanced students, and they want to speak English at international conferences. On Tuesdays and Thursdays he has online lessons with children at four o'clock in the afternoon.\n\nPaul doesn't teach on Fridays. He uses that day to prepare lessons and check emails. In summer he has a holiday in August, and in winter he has a short break at New Year.\n\nSometimes students want to reschedule a lesson. That is no problem for Paul, but they need to send a message 24 hours before the lesson. He never teaches at night, and he never has appointments at the weekend.", "questions": [{"q": "When does Paul teach the doctors?", "options": ["on Monday at nine", "on Tuesday at four", "on Friday at nine"], "answer": 0, "why": "'On Mondays he teaches a group of doctors at nine o'clock.'"}, {"q": "Who has lessons on Tuesdays and Thursdays?", "options": ["doctors", "children", "advanced students"], "answer": 1, "why": "'On Tuesdays and Thursdays he has online lessons with children.'"}, {"q": "What does Paul do on Fridays?", "options": ["He has a holiday.", "He teaches online.", "He prepares lessons and checks emails."], "answer": 2, "why": "'He uses that day to prepare lessons and check emails.'"}, {"q": "When is his summer holiday?", "options": ["in July", "in August", "at New Year"], "answer": 1, "why": "'In summer he has a holiday in August.'"}, {"q": "What must students do to reschedule?", "options": ["Send a message 24 hours before.", "Call him at night.", "Pay for the lesson."], "answer": 0, "why": "'...they need to send a message 24 hours before the lesson.'"}], "find": [{"meaning": "change the day or time of a lesson", "word": "reschedule"}, {"meaning": "times to meet someone, for example a doctor", "word": "appointments"}, {"meaning": "get ready", "word": "prepare"}]}, "listen": {"title": "Can we change the time?", "situation": "Sofia calls her tutor Paul because she needs to change her lesson.", "speakers": {"A": {"name": "Paul", "accent": "en-US"}, "B": {"name": "Sofia", "accent": "en-IN"}}, "lines": [{"who": "B", "text": "Hello, Paul? It's Sofia. I have a lesson with you on Wednesday at ten."}, {"who": "A", "text": "Hi Sofia. Yes, that's right."}, {"who": "B", "text": "I'm sorry, but I need to reschedule. I have a doctor's appointment on Wednesday morning."}, {"who": "A", "text": "No problem. Are you free on Wednesday afternoon?"}, {"who": "B", "text": "No, I work in the afternoon. What about Thursday?"}, {"who": "A", "text": "I'm busy on Thursday morning. I have a group at nine. But I'm available at two o'clock."}, {"who": "B", "text": "Two o'clock on Thursday is perfect."}, {"who": "A", "text": "Great. And remember, we don't have lessons at Christmas."}, {"who": "B", "text": "OK, thanks. See you on Thursday at two!"}], "questions": [{"q": "When is Sofia's usual lesson?", "options": ["on Wednesday at ten", "on Thursday at nine", "on Wednesday at two"], "answer": 0, "why": "Sofia: 'I have a lesson with you on Wednesday at ten.'"}, {"q": "Why does Sofia need to reschedule?", "options": ["She is on holiday.", "She has a doctor's appointment.", "She is busy at work."], "answer": 1, "why": "Sofia: 'I have a doctor's appointment on Wednesday morning.'"}, {"q": "Why can't she come on Wednesday afternoon?", "options": ["She works.", "She has a group lesson.", "She visits her mother."], "answer": 0, "why": "Sofia: 'I work in the afternoon.'"}, {"q": "What is the new time?", "options": ["Thursday at nine", "Wednesday at two", "Thursday at two"], "answer": 2, "why": "Sofia: 'Two o'clock on Thursday is perfect.'"}, {"q": "When don't they have lessons?", "options": ["in summer", "at Christmas", "on Fridays"], "answer": 1, "why": "Paul: 'we don't have lessons at Christmas.'"}]}, "accents": {"sentences": [{"text": "My lesson is on Monday at nine o'clock.", "accent": "en-US"}, {"text": "I don't work in the evening.", "accent": "en-GB"}, {"text": "Can we reschedule the appointment?", "accent": "en-AU"}, {"text": "We have a holiday in August.", "accent": "en-IE"}, {"text": "The meeting is at half past three.", "accent": "en-IN"}, {"text": "She prepares her lessons on Sunday night.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Say six sentences about your week with at, on and in.", "model": "I have lessons on Monday and Wednesday. My first lesson is at ten o'clock. I prepare my lessons in the morning. On Friday I go to the market. I meet my friends at the weekend. In summer I have more students, because a lot of tourists want to learn Russian.", "checklist": ["at + time, on + day, in + part of the day or month.", "I said 6 sentences.", "I used 'at the weekend'."]}, {"task": "Role play: a student calls you to reschedule. Offer two new times.", "model": "Hello! No problem, we can reschedule. I'm busy on Tuesday, but I'm available on Wednesday at four o'clock or on Thursday at eleven. Which time is better for you? The lesson is online, so I send you the link before the lesson.", "checklist": ["I offered 2 times.", "I used on + day and at + time.", "I was polite: No problem, Which time is better for you?"]}, {"task": "Say these times aloud: 7:15, 9:30, 12:45, 4:00, 6:20. Then use two of them in sentences.", "model": "Seven fifteen, or quarter past seven. Nine thirty, or half past nine. Twelve forty-five, or quarter to one. Four o'clock. Six twenty. I usually get up at quarter past seven, and my last lesson finishes at six twenty.", "checklist": ["I said the times two ways where possible.", "I used at before a time.", "I spoke clearly."]}], "shadow": ["I'm busy on Thursday morning, but I'm free at two.", "We don't have lessons at Christmas.", "Can we reschedule the lesson to Friday?"]}, "conf": {"minute_topics": ["Talk for one minute about your timetable this week.", "Talk for one minute about your favourite month and why.", "Talk for one minute about a typical Saturday.", "Talk for one minute about when you are busy and when you are free.", "Talk for one minute about the best time for lessons."], "lifesavers": ["How do you spell that?", "What does … mean?"], "win": "Today I can say when I am free and arrange a time."}}, {"n": 6, "focus": "Writing & Fluency", "classwork": ["Send the corrected email to the teacher.", "Voice note: ‘My weekend’ (if not done) or ‘My busiest day’.", "Shadow the Paul text once more and revise the error log."], "read": {"title": "Giulia replies to a new student", "text": "Dear Emma,\n\nThank you for your message. I am happy to teach you Italian! You are a beginner, so I usually suggest two lessons a week.\n\nHere is my timetable for next week. I am available on Monday at ten o'clock, on Wednesday at four o'clock and on Friday at eleven o'clock. I am busy on Tuesday and Thursday, because on those days I teach groups at a language school.\n\nAll my lessons are online, and every lesson is fifty minutes. I send the link by email one hour before the lesson.\n\nDo you want to book a lesson? Please choose two times and send me a message. To reschedule a lesson, please write to me one day before.\n\nI look forward to meeting you.\n\nBest wishes,\nGiulia", "questions": [{"q": "Why does Giulia write this email?", "options": ["Emma sends her a message first.", "Emma wants to cancel a lesson.", "Giulia wants a new job."], "answer": 0, "why": "'Thank you for your message.'"}, {"q": "How many lessons a week does Giulia suggest?", "options": ["one", "two", "three"], "answer": 1, "why": "'I usually suggest two lessons a week.'"}, {"q": "When is Giulia busy?", "options": ["Monday and Wednesday", "Friday", "Tuesday and Thursday"], "answer": 2, "why": "'I am busy on Tuesday and Thursday.'"}, {"q": "When does Giulia send the lesson link?", "options": ["one day before", "one hour before", "after the lesson"], "answer": 1, "why": "'I send the link by email one hour before the lesson.'"}, {"q": "What does Emma need to do now?", "options": ["choose two times and send a message", "pay for the lessons", "call Giulia"], "answer": 0, "why": "'Please choose two times and send me a message.'"}], "find": [{"meaning": "free; not busy", "word": "available"}, {"meaning": "reserve a time with a teacher", "word": "book a lesson"}, {"meaning": "move to a different time", "word": "reschedule"}]}, "listen": {"title": "My busiest day", "situation": "Two tutors, Ben and Priya, talk about their working days.", "speakers": {"A": {"name": "Ben", "accent": "en-AU"}, "B": {"name": "Priya", "accent": "en-IN"}}, "lines": [{"who": "A", "text": "Priya, what's your busiest day?"}, {"who": "B", "text": "Wednesday. I have six lessons on Wednesday."}, {"who": "A", "text": "Six? When do you start?"}, {"who": "B", "text": "At eight in the morning. I usually get up at half past six."}, {"who": "A", "text": "And when do you have lunch?"}, {"who": "B", "text": "I often have a quick lunch at my desk, at about one."}, {"who": "A", "text": "That's not good! I never eat at my desk."}, {"who": "B", "text": "I know. What's your busiest day?"}, {"who": "A", "text": "Monday. Students often reschedule their Friday lessons to Monday."}, {"who": "B", "text": "Do you work in the evening?"}, {"who": "A", "text": "Rarely. My last lesson is usually at five. After that, I go to the gym."}, {"who": "B", "text": "Lucky you! My last lesson on Wednesday is at eight in the evening."}], "questions": [{"q": "What is Priya's busiest day?", "options": ["Monday", "Wednesday", "Friday"], "answer": 1, "why": "Priya: 'Wednesday.'"}, {"q": "How many lessons does she have that day?", "options": ["four", "five", "six"], "answer": 2, "why": "Priya: 'I have six lessons on Wednesday.'"}, {"q": "Where does Priya often have lunch?", "options": ["at her desk", "in a cafe", "at home with her family"], "answer": 0, "why": "Priya: 'I often have a quick lunch at my desk.'"}, {"q": "Why is Monday busy for Ben?", "options": ["He has group lessons.", "Students move Friday lessons to Monday.", "He starts at six."], "answer": 1, "why": "Ben: 'Students often reschedule their Friday lessons to Monday.'"}, {"q": "What does Ben do after his last lesson?", "options": ["He has dinner.", "He prepares lessons.", "He goes to the gym."], "answer": 2, "why": "Ben: 'After that, I go to the gym.'"}]}, "accents": {"sentences": [{"text": "Thank you for your message.", "accent": "en-GB"}, {"text": "I'm available on Wednesday at four o'clock.", "accent": "en-US"}, {"text": "Please choose two times that are good for you.", "accent": "en-IE"}, {"text": "Every lesson is fifty minutes.", "accent": "en-ZA"}, {"text": "My busiest day is Wednesday.", "accent": "en-AU"}, {"text": "I send the link one hour before the lesson.", "accent": "en-IN"}]}, "speak": {"prompts": [{"task": "Talk for two minutes: 'My busiest day'.", "model": "My busiest day is Tuesday. I get up at half past six and I drink a coffee. Then I check my emails. My first lesson is at eight o'clock, with a businessman. He needs Russian for his work. I usually have five lessons on Tuesday, so I rarely have time for lunch. In the evening I am very tired, but I am happy.", "checklist": ["I used at + time and on + day.", "I used 2 frequency adverbs.", "I spoke for 2 minutes (it is OK to stop and continue)."]}, {"task": "Read your email to the new student aloud, like a voice message.", "model": "Hello Emma! Thank you for your message. I'm available on Monday at ten, on Wednesday at four and on Friday at eleven. Every lesson is fifty minutes, and all my lessons are online. Please choose two times and send me a message. See you soon!", "checklist": ["I started and finished in a friendly way.", "I gave 3 days and times.", "I asked the student to choose."]}, {"task": "Your student says: 'I'm very busy. I don't have time to study.' Help her find time.", "model": "I understand. Many of my students are busy. Look at your timetable. Do you have ten minutes in the morning? Do you take the bus to work? You can listen to Russian on the bus. Short lessons are fine. Twenty minutes, three times a week, is a good start.", "checklist": ["I asked questions about her day.", "I talked about times and days.", "I was kind and positive."]}], "shadow": ["Thank you for your message. I'm happy to help.", "My busiest day is Tuesday.", "Please choose two times and send me a message."]}, "conf": {"minute_topics": ["Talk for one minute about a very busy day.", "Talk for one minute about a funny thing a student does.", "Talk for one minute about what you do in your free time.", "Talk for one minute about how you plan your week.", "Talk for one minute about a relaxing day."], "lifesavers": ["It's a kind of…", "I'm not sure, but I think…"], "win": "Today I can talk about my week for one minute without stopping."}}], "mission": {"title": "Order your coffee in English", "why": "One short, real conversation with a stranger, and you are in control because you know exactly what to say.", "steps": ["Choose a café where staff speak English (Kaleiçi or Konyaaltı are good).", "Read the phrases below three times before you go.", "Order one drink in English. Only English, even if they answer in Turkish!", "After, write one sentence in your notebook: how did it feel?"], "say_this": ["Hi! Could I have a latte, please?", "Medium, please.", "To have here / to take away, please.", "Can I pay by card?", "Thank you, have a nice day!"], "bonus": "Ask one more question: 'What do you recommend?'"}, "video": {"youtube_id": "sJ7sRSK2in4", "title": "Talking about routines - Real Easy English", "channel": "BBC Learning English", "seconds": 342, "start": 25, "end": 310, "checked": "oEmbed OK + English subtitles read on 2026-11-18", "lessons": {"4": {"before": "What time do you usually have breakfast and lunch? Say it out loud.", "questions": [{"q": "What is the main topic?", "options": ["Sports", "Meal times and eating routines", "Shopping"], "answer": 1, "why": "\"Today we'll talk about our meal times and routines for eating.\""}, {"q": "A 'routine' is...", "options": ["the time and way we usually do something", "a kind of food", "a holiday"], "answer": 0, "why": "\"'routine', 'the time and way we usually do something'\""}, {"q": "Why doesn't Beth like to miss meals?", "options": ["She is a cook", "She gets 'hangry'", "She doesn't sleep well"], "answer": 1, "why": "\"I don't like to miss meals, because, like I said, I get hangry.\""}], "after": "Voice note (45 seconds): describe a normal weekday - meals, lessons, free time. Use usually, often, sometimes."}, "5": {"before": "Make 3 columns: Neil / Beth / Me. Fill in breakfast and lunch as you watch.", "questions": [{"q": "What time does Neil have breakfast?", "options": ["6am", "7am", "9am"], "answer": 0, "why": "\"I have my breakfast at 6am every day.\""}, {"q": "What does Beth usually have for breakfast?", "options": ["Cereal and toast", "Porridge", "Eggs"], "answer": 1, "why": "\"I usually have porridge.\""}, {"q": "What time does Beth normally have lunch?", "options": ["At 12", "At about one o'clock", "At two"], "answer": 1, "why": "\"I normally have lunch at about one o'clock.\""}, {"q": "When did Beth have brunch almost every day?", "options": ["At school", "At university", "At weekends now"], "answer": 1, "why": "\"When I was at university, I used to have brunch pretty much every day.\""}], "after": "Write 6 sentences comparing your routine with Neil's or Beth's: 'Neil has breakfast at 6am, but I usually...'"}, "6": {"before": "Watch again and listen for two new 'combined' words.", "questions": [{"q": "'Brunch' is a combination of...", "options": ["breakfast + lunch", "bread + lunch", "breakfast + bunch"], "answer": 0, "why": "\"that's a combination of the words 'breakfast' and 'lunch'.\""}, {"q": "'Hangry' means...", "options": ["happy and hungry", "hungry and angry", "very tired"], "answer": 1, "why": "\"if you're hungry and angry, we can combine them and say 'hangry'.\""}, {"q": "Complete: \"I have my breakfast at 6am ___ day.\"", "options": ["all", "every", "some"], "answer": 1, "why": "\"I have my breakfast at 6am every day.\""}], "after": "Make a 'my week' timetable and record 1 minute explaining it with always / usually / sometimes / never."}}}, "words": [{"w": "usually", "e": "🔁", "x": "I usually start work at nine.", "ru": "genellikle"}, {"w": "often", "e": "🔂", "x": "I often teach five lessons a day.", "ru": "sık sık"}, {"w": "sometimes", "e": "🎲", "x": "I sometimes teach on Saturday morning.", "ru": "bazen"}, {"w": "rarely", "e": "🐢", "x": "My students rarely cancel lessons.", "ru": "nadiren"}, {"w": "never", "e": "🚫", "x": "I never work on Sundays.", "ru": "asla, hiç"}, {"w": "get up", "e": "⏰🛏️", "x": "I get up at half past six.", "ru": "kalkmak"}, {"w": "prepare", "e": "🗂️✏️", "x": "I prepare my lessons in the evening.", ": ["I used go straight on and turn left / right.", "I used next to or opposite.", "My directions were in order."]}, {"task": "Describe your neighbourhood. Use there is / there are five times.", "model": "My neighbourhood is quiet and green. There is a small park near my flat. There are two supermarkets and a bakery. There is a school opposite my building. There aren't any big shopping centres, but there is a market on Wednesdays. There are some nice cafes next to the sea.", "checklist": ["there is + one thing, there are + many things.", "I used there is / are 5 times.", "I used 2 place words (near, opposite...)."]}, {"task": "What is good and what is bad about your neighbourhood?", "model": "The good thing is that it is quiet, and the beach is near. Public transport is good, too. There is a tram stop next to my street. The bad thing is that it is expensive. Also, in summer it is very crowded with tourists.", "checklist": ["I gave good and bad points.", "I used but or also.", "I used 3 new words."]}], "shadow": ["Go straight on and turn left at the hotel.", "There is a bakery opposite my building.", "Is there a bus stop near here?"]}, "conf": {"minute_topics": ["Talk for one minute about your neighbourhood.", "Talk for one minute about your flat.", "Talk for one minute about your favourite café.", "Talk for one minute about a beautiful place near Antalya.", "Talk for one minute about a city you love."], "lifesavers": ["Sorry, I didn't catch that.", "Is it correct to say …?"], "win": "Today I can describe my neighbourhood with there is and there are."}}, {"n": 8, "focus": "Listening & Grammar", "classwork": ["Shadow the model text 3 times.", "Write 8 sentences about your neighbourhood with some / any.", "Revise the place prepositions with the vocabulary cards."], "read": {"title": "Two flats, two neighbourhoods", "text": "Ahmet and Sara want to rent a new flat in Antalya. They have two choices.\n\nThe first flat is in the city centre. There are some good restaurants and a museum near it, and there are a lot of shops. Public transport is excellent. But there isn't any parking, the street is crowded and the flat is expensive.\n\nThe second flat is in a quiet neighbourhood near the mountains. It is cheap, and there is a big garden. There are some small shops, but there aren't any cinemas or museums. There is a bus to the city centre, but it is slow, and there aren't any buses after ten o'clock at night.\n\nSara works in the city centre, and she doesn't have a car. Ahmet works at home. He loves nature, and he wants a garden for their dog.", "questions": [{"q": "What is near the first flat?", "options": ["a museum and some restaurants", "a big garden", "the mountains"], "answer": 0, "why": "'There are some good restaurants and a museum near it.'"}, {"q": "What is a problem with the first flat?", "options": ["There aren't any shops.", "There isn't any parking.", "The buses are slow."], "answer": 1, "why": "'But there isn't any parking...'"}, {"q": "What does the second flat have?", "options": ["a cinema", "parking in the centre", "a big garden"], "answer": 2, "why": "'It is cheap, and there is a big garden.'"}, {"q": "Are there any buses after ten at night near the second flat?", "options": ["Yes, there are some.", "No, there aren't any.", "Only on Saturdays."], "answer": 1, "why": "'...there aren't any buses after ten o'clock at night.'"}, {"q": "Why does Ahmet like the second flat?", "options": ["It is near his office.", "He loves nature and wants a garden.", "It is near the museum."], "answer": 1, "why": "'He loves nature, and he wants a garden for their dog.'"}], "find": [{"meaning": "not expensive", "word": "cheap"}, {"meaning": "buses, trams and trains for everybody", "word": "public transport"}, {"meaning": "a part of a city where people live", "word": "neighbourhood"}]}, "listen": {"title": "Where are you from?", "situation": "Emma and Raj, two teachers in Antalya, talk about their home towns.", "speakers": {"A": {"name": "Emma", "accent": "en-GB"}, "B": {"name": "Raj", "accent": "en-IN"}}, "lines": [{"who": "A", "text": "Raj, where are you from?"}, {"who": "B", "text": "I'm from Pune, a big city in India. And you?"}, {"who": "A", "text": "I'm from a small village in Wales."}, {"who": "B", "text": "Is there a lot to do there?"}, {"who": "A", "text": "Not really. There's a pub and a church, but there aren't any cinemas or museums."}, {"who": "B", "text": "Pune is very different. There are a lot of universities, and the city centre is always crowded."}, {"who": "A", "text": "Are there any beaches?"}, {"who": "B", "text": "No, there aren't. But there are some mountains near the city."}, {"who": "A", "text": "There are some lovely mountains near my village too. It's very quiet and green."}, {"who": "B", "text": "And Antalya? What do you think?"}, {"who": "A", "text": "I love it. There's the sea, the mountains and the old town. But the centre is expensive."}, {"who": "B", "text": "I agree. But public transport is cheap here."}], "questions": [{"q": "Where is Raj from?", "options": ["a village in Wales", "a big city in India", "Antalya"], "answer": 1, "why": "Raj: 'I'm from Pune, a big city in India.'"}, {"q": "What is there in Emma's village?", "options": ["a pub and a church", "a cinema", "a museum"], "answer": 0, "why": "Emma: 'There's a pub and a church.'"}, {"q": "Are there any beaches in Pune?", "options": ["Yes, there are.", "Raj doesn't know.", "No, there aren't."], "answer": 2, "why": "Raj: 'No, there aren't.'"}, {"q": "What do both places have near them?", "options": ["beaches", "mountains", "universities"], "answer": 1, "why": "Both talk about mountains near their home towns."}, {"q": "What is cheap in Antalya, says Raj?", "options": ["the old town", "restaurants", "public transport"], "answer": 2, "why": "Raj: 'But public transport is cheap here.'"}]}, "accents": {"sentences": [{"text": "Are there any cafes near your flat?", "accent": "en-US"}, {"text": "There aren't any museums in my village.", "accent": "en-GB"}, {"text": "There are some lovely mountains near the city.", "accent": "en-ZA"}, {"text": "Is there any parking near the station?", "accent": "en-IE"}, {"text": "The flat in the city centre is very expensive.", "accent": "en-AU"}, {"text": "There is some fruit on the table.", "accent": "en-IN"}]}, "speak": {"prompts": [{"task": "Say eight sentences about your neighbourhood with some and any.", "model": "There are some good cafes in my street. There aren't any cinemas. There is some parking near my building. Are there any museums? No, there aren't. There are some old trees in the park. There isn't any noise at night. There are some small shops. There aren't any big hotels.", "checklist": ["some in positive sentences.", "any in negatives and questions.", "I said 8 sentences."]}, {"task": "Compare two places you know: your home town and Antalya, or two parts of your city.", "model": "My home town is small and quiet. There aren't any big shopping centres, but there are some lovely parks. Antalya is very different. There are a lot of hotels, and the beaches are beautiful. The city centre is crowded and expensive, but public transport is good.", "checklist": ["I talked about both places.", "I used but to show a difference.", "I used some / any correctly."]}, {"task": "A friend wants to visit your city. What is there to see and do?", "model": "There is a lot to see! There are some beautiful beaches, and there is an old town with small streets. There is a great museum, too. You can take a boat trip or walk to the waterfalls. In the evening there are some nice restaurants near the harbour.", "checklist": ["I used there is / there are.", "I used you can.", "I gave 4 ideas."]}], "shadow": ["Are there any good cafes near here?", "There aren't any cinemas in my village.", "There are some lovely mountains near the city."]}, "conf": {"minute_topics": ["Talk for one minute about a quiet place you love.", "Talk for one minute about a crowded place in summer.", "Talk for one minute about public transport in Antalya.", "Talk for one minute about a market you know.", "Talk for one minute about the beach or the mountains."], "lifesavers": ["It's like … but …", "You use it when…"], "win": "Today I can explain a word when I don't know the exact English."}}, {"n": 9, "focus": "Writing & Fluency", "classwork": ["Send the corrected city text to the teacher.", "Voice note: read your city text aloud like a tour guide.", "Revise the error log: this week’s 5 mistakes."], "read": {"title": "Hello from Izmir!", "text": "My name is Carlos and I am a Spanish teacher. I live in Izmir, a big city on the west coast of Turkey.\n\nIzmir is a great place to live. There is a long promenade next to the sea, and people walk, run and ride bikes there every evening. There are some busy markets in the old part of the city, and the food is cheap and delicious.\n\nMy favourite place is a small cafe in Alsancak, my neighbourhood. It is between a bookshop and a flower shop, opposite a quiet square. I often prepare my lessons there.\n\nPublic transport is easy. There is a metro, there are buses, and there are ferries across the bay. The city is not very crowded in winter, but in summer there are a lot of tourists. Come and visit!", "questions": [{"q": "Where is Izmir?", "options": ["on the west coast", "near the mountains", "in the east"], "answer": 0, "why": "'...a big city on the west coast of Turkey.'"}, {"q": "What do people do on the promenade?", "options": ["They go shopping.", "They walk, run and ride bikes.", "They visit museums."], "answer": 1, "why": "'...people walk, run and ride bikes there every evening.'"}, {"q": "Where is Carlos's favourite cafe?", "options": ["next to the sea", "in the metro station", "between a bookshop and a flower shop"], "answer": 2, "why": "'It is between a bookshop and a flower shop.'"}, {"q": "What does Carlos do in the cafe?", "options": ["He meets students.", "He prepares lessons.", "He reads books."], "answer": 1, "why": "'I often prepare my lessons there.'"}, {"q": "When is Izmir crowded?", "options": ["in winter", "in summer", "every evening"], "answer": 1, "why": "'...in summer there are a lot of tourists.'"}], "find": [{"meaning": "full of people", "word": "crowded"}, {"meaning": "the part of a city where you live", "word": "neighbourhood"}, {"meaning": "on the other side, facing", "word": "opposite"}]}, "listen": {"title": "My favourite place", "situation": "Kate, a radio presenter, asks Liam about his favourite place in Antalya.", "speakers": {"A": {"name": "Kate", "accent": "en-AU"}, "B": {"name": "Liam", "accent": "en-IE"}}, "lines": [{"who": "A", "text": "Liam, you live in Antalya. What's your favourite place in the city?"}, {"who": "B", "text": "The old harbour. I go there every Sunday morning."}, {"who": "A", "text": "Why do you like it?"}, {"who": "B", "text": "It's beautiful. There are old boats, and you can see the mountains across the water."}, {"who": "A", "text": "Is it crowded?"}, {"who": "B", "text": "In summer, yes, very. But on Sunday mornings in winter it's quiet."}, {"who": "A", "text": "Are there any good places to eat?"}, {"who": "B", "text": "There are some lovely fish restaurants, but they're expensive. I usually have a cheap simit and tea from a small shop next to the steps."}, {"who": "A", "text": "And how do you get there?"}, {"who": "B", "text": "By tram. There's a stop near the clock tower. Then I walk for five minutes."}, {"who": "A", "text": "It sounds perfect."}, {"who": "B", "text": "It is. Everybody visits the beach, but I prefer the harbour."}], "questions": [{"q": "When does Liam go to the harbour?", "options": ["every Saturday evening", "every Sunday morning", "every day"], "answer": 1, "why": "Liam: 'I go there every Sunday morning.'"}, {"q": "What can you see across the water?", "options": ["the mountains", "the museum", "the beach"], "answer": 0, "why": "Liam: '...you can see the mountains across the water.'"}, {"q": "When is the harbour quiet?", "options": ["in summer", "every evening", "on Sunday mornings in winter"], "answer": 2, "why": "Liam: 'But on Sunday mornings in winter it's quiet.'"}, {"q": "What does Liam usually eat there?", "options": ["fish", "a simit and tea", "pizza"], "answer": 1, "why": "Liam: 'I usually have a cheap simit and tea.'"}, {"q": "How does he get there?", "options": ["by bus", "by car", "by tram"], "answer": 2, "why": "Liam: 'By tram.'"}]}, "accents": {"sentences": [{"text": "My favourite place is the old harbour.", "accent": "en-AU"}, {"text": "There is a tram stop near the clock tower.", "accent": "en-GB"}, {"text": "The fish restaurants are lovely but expensive.", "accent": "en-US"}, {"text": "In winter the city is quiet.", "accent": "en-IN"}, {"text": "You can see the mountains across the water.", "accent": "en-IE"}, {"text": "There are a lot of tourists in summer.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Read your city text aloud like a tour guide. Smile and speak slowly.", "model": "Welcome to Antalya! Antalya is a beautiful city on the south coast of Turkey. There are long beaches, and there are high mountains behind the city. In the old town there are small streets, old houses and lovely cafes. There is a great museum, too. Public transport is cheap and easy. Come and visit!", "checklist": ["I spoke slowly and clearly.", "I used there is / there are.", "I finished with an invitation."]}, {"task": "Talk for two minutes about your favourite place in your city.", "model": "My favourite place is a small park near my flat. There are some old trees, and there is a little cafe in the middle. I often go there in the afternoon after my lessons. It is quiet, and I can read or prepare lessons. In spring there are flowers everywhere. Sometimes I meet my friends there. It is not expensive, and it is my place to relax.", "checklist": ["I said where it is and what is there.", "I said when and why I go there.", "I spoke for 2 minutes."]}, {"ta , "channel": "BBC Learning English", "seconds": 342, "start": 15, "end": 310, "checked": "oEmbed OK + English subtitles read on 2026-11-18", "lessons": {"7": {"before": "Think of your city. Say 2 good things and 2 bad things about it.", "questions": [{"q": "What are Neil and Georgie talking about?", "options": ["Travelling by plane", "Living in a city", "Buying a house"], "answer": 1, "why": "\"Today we're talking about cities.\""}, {"q": "Where do they both live and work?", "options": ["London", "Barcelona", "Edinburgh"], "answer": 0, "why": "\"We both live and work in London.\""}, {"q": "Which city would Neil like to visit?", "options": ["Rio de Janeiro", "Prague", "Tbilisi"], "answer": 2, "why": "\"I'd like to go to Tbilisi in Georgia.\""}], "after": "Voice note (45 seconds): What is good and bad about living in Antalya? Use there is / there are."}, "8": {"before": "Make 3 headings: Good things / Bad things / Other cities. Take notes.", "questions": [{"q": "Which good thing about London do they talk about?", "options": ["Cheap restaurants", "Lots of theatres and live music", "Quiet streets"], "answer": 1, "why": "\"lots of theatres where you can see plays. There's a really good music scene\""}, {"q": "Which is NOT a bad thing they say about the city?", "options": ["Noisy", "Dirty", "Expensive", "Too small"], "answer": 3, "why": "\"it's very noisy and dirty... and busy and expensive.\""}, {"q": "What does Barcelona have?", "options": ["A castle on a rock", "A beach and mountains", "A big carnival"], "answer": 1, "why": "\"it has a beach and the sea on one side and on the other side it has mountains\""}, {"q": "Why did Neil live in Edinburgh?", "options": ["He did his master's degree there", "He worked as a teacher there", "His family lived there"], "answer": 0, "why": "\"I lived in Edinburgh because I did my master's degree there\""}], "after": "Write 6 sentences about your neighbourhood: There is a... There are some... There isn't any..."}, "9": {"before": "Watch
