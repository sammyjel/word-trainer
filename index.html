plu taşıma"}, {"w": "beach", "e": "🏖️", "x": "In summer we go to the beach.", "ru": "plaj"}, {"w": "mountains", "e": "🏔️", "x": "In winter you can ski in the mountains.", "ru": "dağlar"}]}, {"week": 4, "topic": "Right Now: The Online Classroom", "lessons": [{"n": 10, "focus": "Speaking & Vocabulary", "classwork": ["Learn the 12 tech phrases by heart (say them aloud 3 times a day).", "Voice note (1 min): send a photo of a busy café or street and describe what people are doing.", "Word Trainer: learn the 16 Week 4 words."], "read": {"title": "A Busy Monday Online", "text": "Selin is a Spanish teacher in Izmir. She usually teaches in a small classroom, but this month she is teaching online because her school is closed for repairs.\n\nIt is ten o'clock on Monday morning. Selin is sitting at her desk with a cup of coffee. Her camera is on and she is sharing her screen. Five students are in the lesson today. Two of them are practising a dialogue. One student, Burak, is very quiet. His microphone is on mute, so nobody can hear him.\n\nSuddenly, Elif's video starts to freeze. Her connection is bad because she is travelling on a bus. Selin sends the link again and asks her to join from a different place.\n\nSelin likes online lessons. She doesn't need to drive to work, and her students always do their homework. But she wants a faster internet connection!", "questions": [{"q": "Why is Selin teaching online this month?", "options": ["Her students live far away", "Her school is closed for repairs", "She is ill"], "answer": 1, "why": "\"...because her school is closed for repairs.\""}, {"q": "What are two of the students doing?", "options": ["practising a dialogue", "writing an exercise", "watching a video"], "answer": 0, "why": "\"Two of them are practising a dialogue.\""}, {"q": "Why can't anybody hear Burak?", "options": ["His connection is bad", "He is not in the lesson", "His microphone is on mute"], "answer": 2, "why": "\"His microphone is on mute, so nobody can hear him.\""}, {"q": "Why is Elif's video freezing?", "options": ["Her camera is old", "She is travelling on a bus", "Selin is sharing her screen"], "answer": 1, "why": "\"Her connection is bad because she is travelling on a bus.\""}, {"q": "What does Selin want?", "options": ["more students", "a new camera", "a faster internet connection"], "answer": 2, "why": "\"But she wants a faster internet connection!\""}], "find": [{"meaning": "with the sound of your microphone turned off", "word": "mute"}, {"meaning": "when a video stops moving on the screen", "word": "freeze"}, {"meaning": "the internet address you click to join a lesson", "word": "link"}]}, "listen": {"title": "Can you hear me?", "situation": "Mark, an English teacher, is starting an online lesson with his student Nadia, but the technology is not working well.", "speakers": {"A": {"name": "Mark", "accent": "en-GB"}, "B": {"name": "Nadia", "accent": "en-US"}}, "lines": [{"who": "A", "text": "Hi Nadia! Can you hear me?"}, {"who": "B", "text": "Hi Mark. Yes, I can hear you, but I can't see you."}, {"who": "A", "text": "Oh, sorry. My camera is off. Is that better?"}, {"who": "B", "text": "Yes, now I can see you."}, {"who": "A", "text": "Great. Today we're practising questions. I'm sharing my screen now. Can you see the exercise?"}, {"who": "B", "text": "Sorry, you're breaking up. Can you repeat that, please?"}, {"who": "A", "text": "I'm sharing my screen. Can you see the exercise?"}, {"who": "B", "text": "Yes, I can see it. Number one is about my job, right?"}, {"who": "A", "text": "That's right. And your homework? Do you have it?"}, {"who": "B", "text": "Yes. I usually do my homework on Sunday evening."}, {"who": "A", "text": "Perfect. Oh, the connection is bad again. I'm sending the link in the chat."}, {"who": "B", "text": "OK, I'm clicking on it now."}], "questions": [{"q": "What is the first problem?", "options": ["Nadia can't hear Mark", "Nadia can't see Mark", "Mark can't hear Nadia"], "answer": 1, "why": "Nadia: \"I can hear you, but I can't see you.\""}, {"q": "What are they practising today?", "options": ["questions", "the alphabet", "pronunciation"], "answer": 0, "why": "Mark: \"Today we're practising questions.\""}, {"q": "What does Nadia say when Mark is breaking up?", "options": ["Can you speak louder?", "Can you send the link?", "Can you repeat that, please?"], "answer": 2, "why": "Nadia: \"Sorry, you're breaking up. Can you repeat that, please?\""}, {"q": "When does Nadia usually do her homework?", "options": ["on Saturday morning", "on Sunday evening", "before the lesson"], "answer": 1, "why": "Nadia: \"I usually do my homework on Sunday evening.\""}, {"q": "What does Mark do at the end?", "options": ["He sends the link in the chat", "He turns off his camera", "He finishes the lesson"], "answer": 0, "why": "Mark: \"I'm sending the link in the chat.\""}]}, "accents": {"sentences": [{"text": "Can you hear me? I think my microphone is on mute.", "accent": "en-GB"}, {"text": "Sorry, you're breaking up. Can you repeat that, please?", "accent": "en-US"}, {"text": "I'm sharing my screen now. Can you see it?", "accent": "en-AU"}, {"text": "My video is freezing because the connection is bad.", "accent": "en-IN"}, {"text": "Could you spell your name for me, please?", "accent": "en-IE"}, {"text": "I'm sending the link in the chat right now.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Look around you (or at a photo of a busy café or street). Describe what you can see and what people are doing right now.", "model": "Right now I'm sitting in a café in Antalya. A young man is working on his laptop. Two women are drinking tea and they are laughing. The waiter is carrying a big tray. Outside, a man is walking his dog and a child is eating an ice cream. It's busy, but I like it here.", "checklist": ["I used is/are + -ing at least 5 times", "I described at least 4 people", "I said where I am"]}, {"task": "Your student can't hear you in an online lesson. Say 4 phrases to fix the problem.", "model": "Can you hear me now? I think there is a problem with my microphone. Just a moment, I'm checking it. Is that better? If the connection is still bad, I'm sending you a new link in the chat. Please click on it and join again.", "checklist": ["I asked a question to check", "I used at least 2 tech words (microphone, connection, link)", "I spoke slowly and clearly"]}, {"task": "Talk about your lessons: what you usually do, and what you are doing this month.", "model": "I usually teach Russian in the evenings. Most of my students are adults and they usually want to speak, not only write. This month I'm working with a new student from Antalya. We're practising the alphabet and simple greetings. I'm also learning English, so I'm studying a lot this month!", "checklist": ["I used usually + present simple", "I used this month + present continuous", "I didn't say 'I'm knowing' or 'I'm wanting'"]}], "shadow": ["Sorry, you're breaking up. Could you say that again?", "I'm sharing my screen now. Can you see it?", "Let me check my microphone. Is that better?"]}, "conf": {"minute_topics": ["Talk for one minute about what is happening around you right now.", "Talk for one minute about what your family is doing today.", "Talk for one minute about your online lessons.", "Talk for one minute about what you are learning these days.", "Talk for one minute about a problem in an online lesson and how you fix it."], "lifesavers": ["Give me a moment.", "Sorry, what was the question?"], "win": "Today I can describe what people are doing right now."}}, {"n": 11, "focus": "Listening & Grammar", "classwork": ["Write 6 sentences: 3 about what she usually does in lessons, 3 about what she is doing this week.", "Shadow Ana’s text 3 times (the teacher sends the recording).", "Voice note: what is she doing right now? (30 sec, sent in real time.)"], "read": {"title": "Ana's Different Week", "text": "Ana lives in Mersin. She is a translator, and she usually works from home. Every day she gets up at seven, makes coffee and starts work at eight. She usually translates documents for a travel company: hotel websites, menus and tour information. She likes this work because it is quiet and she can choose her hours.\n\nThis week is different. Ana is working at an international conference in Istanbul. She isn't translating documents; she is interpreting for business people. At the moment she is standing next to a man from Germany and she is explaining his ideas to a group of Turkish managers. It's hard work, and she is learning a lot.\n\nAna knows that she needs more practice with speaking. She wants to do more conference work next year, so this week is very important for her.", "questions": [{"q": "Where does Ana usually work?", "options": ["in an office", "from home", "at a hotel"], "answer": 1, "why": "\"...she usually works from home.\""}, {"q": "What does she usually translate?", "options": ["books", "letters for a bank", "documents for a travel company"], "answer": 2, "why": "\"She usually translates documents for a travel company.\""}, {"q": "Where is Ana this week?", "options": ["in Istanbul", "in Mersin", "in Germany"], "answer": 0, "why": "\"Ana is working at an international conference in Istanbul.\""}, {"q": "What is she doing at the moment?", "options": ["She is translating a menu", "She is explaining a man's ideas to managers", "She is teaching German"], "answer": 1, "why": "\"...she is explaining his ideas to a group of Turkish managers.\""}, {"q": "Why is this week important for her?", "options": ["She is starting a new job", "She is moving to Istanbul", "She wants to do more conference work"], "answer": 2, "why": "\"She wants to do more conference work next year.\""}], "find": [{"meaning": "making something clear so other people understand", "word": "explaining"}, {"meaning": "a big meeting for many people, often from different countries", "word": "conference"}, {"meaning": "the opposite of noisy", "word": "quiet"}]}, "listen": {"title": "She's running late", "situation": "Lucy phones her friend Omar, a teacher, while he is waiting for a student.", "speakers": {"A": {"name": "Lucy", "accent": "en-GB"}, "B": {"name": "Omar", "accent": "en-IN"}}, "lines": [{"who": "A", "text": "Hi Omar, it's Lucy. Are you busy?"}, {"who": "B", "text": "A little. I'm waiting for my student. She usually comes at five, but today she's running late."}, {"who": "A", "text": "Oh no. So what are you doing now?"}, {"who": "B", "text": "I'm correcting homework. My students write a short text every week."}, {"who": "A", "text": "Nice. Listen, I'm calling about Saturday. Do you want to come to the beach with us?"}, {"who": "B", "text": "I'd love to, but I teach on Saturday mornings."}, {"who": "A", "text": "What about the afternoon? We're meeting at two."}, {"who": "B", "text": "That's fine. Oh, wait, she's here now. She's opening the door."}, {"who": "A", "text": "OK, go! Have a good lesson."}, {"who": "B", "text": "Thanks, Lucy. See you on Saturday!"}], "questions": [{"q": "Why is Omar waiting?", "options": ["His student is late", "His computer isn't working", "Lucy is late"], "answer": 0, "why": "\"I'm waiting for my student... today she's running late.\""}, {"q": "When does his student usually come?", "options": ["at four", "at five", "at six"], "answer": 1, "why": "\"She usually comes at five.\""}, {"q": "What is Omar doing while he waits?", "options": ["He is reading a book", "He is cooking", "He is correcting homework"], "answer": 2, "why": "\"I'm correcting homework.\""}, {"q": "Why can't Omar go to the beach in the morning?", "options": ["He doesn't like the beach", "He teaches on Saturday mornings", "He works in a café"], "answer": 1, "why": "\"I teach on Saturday mornings.\""}, {"q": "What time are they meeting on Saturday?", "options": ["at twelve", "at one", "at two"], "answer": 2, "why": "Lucy: \"We're meeting at two.\""}]}, "accents": {"sentences": [{"text": "She usually comes on time, but today she's running late.", "accent": "en-GB"}, {"text": "I'm correcting homework at the moment.", "accent": "en-US"}, {"text": "This month we're studying the past tense.", "accent": "en-AU"}, {"text": "He doesn't usually work on Fridays.", "accent": "en-IN"}, {"text": "I know the answer, but I can't remember the word.", "accent": "en-IE"}, {"text": "What are you doing right now?", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Describe your typical lesson: what you usually do from start to finish.", "model": "My lessons usually start with a short chat. Then I explain a new grammar point and my student practises it with some exercises. I always correct mistakes at the end, not in the middle, because I want my students to speak freely. The lesson usually finishes with homework.", "checklist": ["I used present simple for habits", "I used usually / always", "I used 3 words from this week (explain, practise, correct...)"]}, {"task": "Imagine you are in an online lesson right now. Say what you are doing and what your student is doing, live.", "model": "OK, right now I'm sharing my screen. My student is reading the text, and she's taking notes. Now she's asking a question about a word. I'm explaining the meaning and I'm writing an example in the chat. She's smiling, so I think she understands!", "checklist": ["I used am/is/are + -ing at least 5 times", "I used right now or now", "I said 'she understands', not 'she is understanding'"]}, {"task": "Tell me about a friend or colleague: what they usually do and what they are doing these days.", "model": "My friend Zeynep is a nurse. She usually works at night and sleeps in the morning. These days she isn't working because she's on holiday. She's staying with her family in Izmir and she's learning to swim. She likes it a lot!", "checklist": ["I used he/she correctly every time", "I used both present simple and present continuous", "I added -s: she works, she sleeps"]}], "shadow": ["She usually comes at five, but today she's running late.", "I'm correcting homework at the moment.", "I know the answer, but I'm thinking about the best word."]}, "conf": {"minute_topics": ["Talk for one minute about your week now and a normal week.", "Talk for one minute about a funny tech problem.", "Talk for one minute about what you usually do in a lesson.", "Talk for one minute about what your students are learning now.", "Talk for one minute about your favourite part of teaching online."], "lifesavers": ["How do I say this…", "Is that the right word?"], "win": "Today I can choose between 'I do' and 'I'm doing'."}}, {"n": 12, "focus": "Writing & Fluency", "classwork": ["Send the corrected message to the teacher as a real message.", "Write 5 teacher phrases she needed today and learn them.", "Record herself teaching the 5 greetings (2 min) and send it."], "read": {"title": "Two Messages", "text": "Hi Ms Petrova,\n\nI'm sorry, but I can't join our lesson today at six. My laptop isn't working, and the screen is completely black. My brother is trying to fix it now, but I think it needs a new battery. I'm writing this message on my phone.\n\nCan we have the lesson on my phone? The camera on my phone is good, but the microphone is not very good. Or can we change the lesson to Thursday? I'm free all day on Thursday.\n\nThank you, and sorry again!\nKerem\n\nHi Kerem,\n\nNo problem! These things happen. Your phone is fine for today. Please download the app and click on the link in my email. If the sound is bad, we can use the chat and I can spell new words for you there. Remember to do the exercise on page 12 before the lesson.\n\nSee you at six,\nIrina Petrova", "questions": [{"q": "Why can't Kerem join the lesson on his laptop?", "options": ["He is ill", "His laptop isn't working", "He has no internet"], "answer": 1, "why": "\"My laptop isn't working, and the screen is completely black.\""}, {"q": "Who is trying to fix the laptop?", "options": ["his brother", "Kerem", "the teacher"], "answer": 0, "why": "\"My brother is trying to fix it now.\""}, {"q": "What is the problem with Kerem's phone?", "options": ["The camera isn't good", "The battery is old", "The microphone isn't very good"], "answer": 2, "why": "\"...the microphone is not very good.\""}, {"q": "What does the teacher decide?", "options": ["to change the lesson to Thursday", "to have the lesson on the phone today", "to cancel the lesson"], "answer": 1, "why": "\"Your phone is fine for today... See you at six.\""}, {"q": "What must Kerem do before the lesson?", "options": ["buy a new laptop", "send a voice message", "the exercise on page 12"], "answer": 2, "why": "\"Remember to do the exercise on page 12 before the lesson.\""}], "find": [{"meaning": "to say the letters of a word one by one", "word": "spell"}, {"meaning": "a practice activity in a book", "word": "exercise"}, {"meaning": "the part of a computer or phone you speak into", "word": "microphone"}]}, "listen": {"title": "Your first lesson", "situation": "Daniel, an online teacher, explains to his new student Rosa how his lessons work.", "speakers": {"A": {"name": "Daniel", "accent": "en-IE"}, "B": {"name": "Rosa", "accent": "en-AU"}}, "lines": [{"who": "A", "text": "Welcome, Rosa! Today is your first lesson, so let me explain how my lessons work."}, {"who": "B", "text": "Great, thank you."}, {"who": "A", "text": "Every lesson is fifty minutes. First, we talk for five minutes. Then I share my screen and we look at new words."}, {"who": "B", "text": "Do you send the words after the lesson?"}, {"who": "A", "text": "Yes, I always send a list and a short exercise. Can you see my screen now?"}, {"who": "B", "text": "Yes, I can see a picture of a kitchen."}, {"who": "A", "text": "Good. Repeat after me, please: fridge, cooker, sink."}, {"who": "B", "text": "Fridge, cooker, sink."}, {"who": "A", "text": "Very good. Your pronunciation is clear. Now, can you spell fridge for me?"}, {"who": "B", "text": "F, R, I, D, G, E."}, {"who": "A", "text": "Perfect. And remember, if you don't understand, just say: Sorry, can you repeat that?"}, {"who": "B", "text": "OK. I'm writing that down now."}], "questions": [{"q": "Why does Daniel explain how his lessons work?", "options": ["It's Rosa's first lesson", "Rosa is late", "The connection is bad"], "answer": 0, "why": "\"Today is your first lesson, so let me explain...\""}, {"q": "How long is every lesson?", "options": ["thirty minutes", "fifty minutes", "an hour"], "answer": 1, "why": "\"Every lesson is fifty minutes.\""}, {"q": "What does Daniel always send after the lesson?", "options": ["a video", "a bill", "a list of words and a short exercise"], "answer": 2, "why": "\"I always send a list and a short exercise.\""}, {"q": "What is the picture on the screen?", "options": ["a classroom", "a kitchen", "a street"], "answer": 1, "why": "Rosa: \"I can see a picture of a kitchen.\""}, {"q": "What should Rosa say when she doesn't understand?", "options": ["Sorry, can you repeat that?", "I don't know.", "Please speak English."], "answer": 0, "why": "Daniel: \"just say: Sorry, can you repeat that?\""}]}, "accents": {"sentences": [{"text": "My laptop isn't working, so I'm writing on my phone.", "accent": "en-GB"}, {"text": "Can we change the lesson to Thursday?", "accent": "en-US"}, {"text": "Please click on the link in my email.", "accent": "en-AU"}, {"text": "If the sound is bad, we can use the chat.", "accent": "en-IN"}, {"text": "Repeat after me, please.", "accent": "en-IE"}, {"text": "Can you spell that word for me?", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Leave a voice message for a student: you have a tech problem and can't start the lesson on time.", "model": "Hi Emma, it's your teacher. I'm really sorry, but I have a problem with my internet connection. A technician is checking it right now. Can we start the lesson at six thirty, not six? I'm sending you the new link by email. Thank you for understanding!", "checklist": ["I said sorry and explained the problem", "I used present continuous for now", "I suggested a new time"]}, {"task": "Teach a 1-minute mini-lesson in English: explain to a new student how your lessons work.", "model": "Welcome to your first Russian lesson! Every lesson is one hour. First, we have a short chat. Then I explain a new topic and we practise it together. I always correct your mistakes gently. At the end I give you homework. Please don't worry about mistakes; they help you learn.", "checklist": ["I used First / Then / At the end", "I used teacher words: explain, practise, correct, homework", "I spoke slowly, like a teacher"]}, {"task": "Give your student 4 instructions for an online lesson.", "model": "Please turn on your camera so I can see you. Mute your microphone when you are not speaking. Click on the link in the chat to open the exercise. And if you don't understand, please ask me to repeat.", "checklist": ["I started each instruction with a verb (Turn on..., Click...)", "I used please", "I used at least 3 tech words"]}], "shadow": ["Sorry, I have a problem with my connection.", "Let me explain how my lessons work.", "If you don't understand, just ask me to repeat."]}, "conf": {"minute_topics": ["Talk for one minute about how you teach a new word.", "Talk for one minute about the most difficult Russian sound.", "Talk for one minute about a common mistake your students make.", "Talk for one minute about how you correct students kindly.", "Talk for one minute about your best lesson ever."], "lifesavers": ["Let me explain.", "Do you know what I mean?"], "win": "Today I can teach a short lesson in English."}}], "mission": {"title": "Help a tourist (or ask one question)", "why": "One tiny public step: Antalya is full of English speakers, and most tourists are happy when someone helps them.", "steps": ["When you see tourists looking at a map or phone, smile.", "Say one sentence: 'Can I help you?' or ask: 'Where are you from?'", "Listen to the answer. Nod. Ask one more question if you can.", "Write down one new word or phrase you heard."], "say_this": ["Excuse me, can I help you?", "Are you looking for …?", "It's next to the … / It's near …", "Where are you from?", "Enjoy Antalya!"], "bonus": "Ask them: 'What are you doing in Antalya?' and tell your teacher the answer."}, "video": {"youtube_id": "c1KFqXL0I0Q", "title": "Talking about social media - Real Easy English", "channel": "BBC Learning English", "seconds": 324, "start": 25, "end": 315, "checked": "oEmbed OK + English subtitles read on 2026-11-18", "lessons": {"10": {"before": "How many hours a day do you use your phone? Guess, then check your screen time.", "questions": [{"q": "What is the topic?", "options": ["Online lessons", "Social media and how much we use it", "Buying a phone"], "answer": 1, "why": "\"Today we're talking about social media and how much we use it.\""}, {"q": "Who uses social media all the time?", "options": ["Neil", "Georgie", "Neither of them"], "answer": 1, "why": "Georgie: \"I use social media all the time, so I have lots of things to say.\""}, {"q": "What is Georgie's main reason for using social media?", "options": ["For work", "To sell things", "To stay in touch with friends"], "answer": 2, "why": "\"The main reason I think is to stay in touch with my friends.\""}], "after": "Voice note: How are you using your phone and the internet for your lessons at the moment? What do you usually do online?"}, "11": {"before": "Listen for apps and the reasons people use them.", "questions": [{"q": "Why does Georgie also dislike social media?", "options": ["It is expensive", "It can be addictive and waste time", "It is boring"], "answer": 1, "why": "\"it can be very addictive and you can waste a lot of time watching TikTok videos.\""}, {"q": "Why does Neil try not to watch TikTok?", "options": ["He has no phone", "He thinks he's too old", "He doesn't like videos"], "answer": 1, "why": "\"I try not to, to be honest, because I'm too old.\""}, {"q": "What does Neil mainly use?", "options": ["Messaging apps and group chats", "TikTok", "Photo apps"], "answer": 0, "why": "\"I like messaging apps, mainly, and group chats\""}, {"q": "What might Georgie do in the future?", "options": ["Delete all her apps", "Put limits on her phone to reduce screen time", "Buy a new phone"], "answer": 1, "why": "\"maybe in the future, I will put those limits that your phone can put to help me reduce my screen time.\""}], "after": "Write 5 sentences: what you are doing this week (present continuous) and what you usually do (present simple)."}, "12": {"before": "Watch again and listen for 'definitely', 'maybe', 'probably'.", "questions": [{"q": "'Catch up with someone' means...", "options": ["run after them", "talk to them and find out what they have been doing", "call them at work"], "answer": 1, "why": "\"you contact them and you find out what they've been doing in their life.\""}, {"q": "Which word means 'certain'?", "options": ["maybe", "probably", "definitely"], "answer": 2, "why": "\"'Definitely', which we use to say something 'is certain'.\""}, {"q": "Which word means 'most likely'?", "options": ["probably", "maybe", "definitely"], "answer": 0, "why": "\"'Probably', which means 'most likely'.\""}], "after": "Retell: how do Georgie and Neil use social media? 5 sentences. Record it."}}}, "words": [{"w": "explain", "e": "👩‍🏫💬", "x": "I explain the grammar in a simple way.", "ru": "açıklamak"}, {"w": "repeat", "e": "🔁", "x": "Can you repeat that, please?", "ru": "tekrarlamak"}, {"w": "practise", "e": "🏋️‍♀️📖", "x": "We practise speaking in every lesson.", "ru": "pratik yapmak"}, {"w": "correct", "e": "✅✏️", "x": "I correct my students’ homework every evening.", "ru": "düzeltmek"}, {"w": "mistake", "e": "❌", "x": "Don’t worry, everybody makes mistakes.", "ru": "hata"}, {"w": "homework", "e": "📚🏠", "x": "Your homework is to learn ten new words.", "ru": "ödev"}, {"w": "exercise", "e": "📝", "x": "Let’s do exercise 3 together.", "ru": "alıştırma"}, {"w": "pronounce", "e": "👄🔊", "x": "How do you pronounce this word?", "ru": "telaffuz etmek"}, {"w": "spell", "e": "🔤", "x": "Can you spell your name, please?", "ru": "harf harf söylemek"}, {"w": "screen share", "e": "🖥️➡️", "x": "I’m sharing my screen now. Can you see it?", "ru": "ekran paylaşımı"}, {"w": "camera", "e": "📷", "x": "Please turn on your camera.", "ru": "kamera"}, {"w": "microphone", "e": "🎙️", "x": "My microphone isn’t working.", "ru": "mikrofon"}, {"w": "connection", "e": "📶", "x": "Your connection is bad today.", "ru": "bağlantı"}, {"w": "mute", "e": "🔇", "x": "Sorry, you’re on mute.", "ru": "sesi kapatmak"}, {"w": "freeze", "e": "🥶🖥️", "x": "Your screen froze for a moment.", "ru": "donmak (ekran)"}, {"w": "link", "e": "🔗", "x": "I’m sending you the link in the chat.", "ru": "bağlantı, link"}]}, {"week": 5, "topic": "My Story", "lessons": [{"n": 13, "focus": "Speaking & Vocabulary", "classwork": ["Learn the circled irregular verbs; write a sentence about her life with each.", "Voice note (90 sec): ‘The best day of my childhood’.", "Word Trainer: Week 5 vocabulary + the 30 irregular verbs."], "read": {"title": "Daniela's Story", "text": "Daniela was born in 1985 in a small town in Romania. She grew up in a big family with three brothers. Her childhood was happy, but the family didn't have much money. She remembers the old piano in her grandmother's house. She played it every weekend, and it became her favourite thing.\n\nWhen she was eighteen, Daniela moved to Bucharest and studied music at university. She graduated in 2008 with a degree in piano. Her first job was at a music school for children. She taught there for six years, and she loved it.\n\nIn 2014 she met a Turkish engineer at a concert in Bucharest. Two years later they got married, and she moved to Antalya. At first life was difficult. She didn't speak Turkish, and she didn't know anybody. Then she decided to give private piano lessons. She put an advert online, and three weeks later she had ten students.\n\nToday Daniela teaches children and adults. She says, 'Moving to Turkey was a big change, but I chose the right career.'", "questions": [{"q": "Where did Daniela grow up?", "options": ["in Bucharest", "in a small town in Romania", "in Antalya"], "answer": 1, "why": "\"Daniela was born in 1985 in a small town in Romania. She grew up in a big family...\""}, {"q": "What did she study at university?", "options": ["music", "engineering", "languages"], "answer": 0, "why": "\"...studied music at university.\""}, {"q": "Where was her first job?", "options": ["at a university", "in a hotel", "at a music school for children"], "answer": 2, "why": "\"Her first job was at a music school for children.\""}, {"q": "Why was life difficult at first in Antalya?", "options": ["She didn't have a piano", "She didn't speak Turkish or know anybody", "Her husband worked far away"], "answer": 1, "why": "\"She didn't speak Turkish, and she didn't know anybody.\""}, {"q": "How did she find students?", "options": ["Her husband helped her", "She worked at a school", "She put an advert online"], "answer": 2, "why": "\"She put an advert online, and three weeks later she had ten students.\""}], "find": [{"meaning": "the time in your life when you are a child", "word": "childhood"}, {"meaning": "finished university and got a diploma", "word": "graduated"}, {"meaning": "the work you do in your life, often for many years", "word": "career"}]}, "listen": {"title": "Where were you born?", "situation": "At a party for teachers, Paul asks his new colleague Leyla about her life.", "speakers": {"A": {"name": "Paul", "accent": "en-US"}, "B": {"name": "Leyla", "accent": "en-GB"}}, "lines": [{"who": "A", "text": "So, Leyla, where were you born?"}, {"who": "B", "text": "I was born in Ankara, but I grew up in Bursa. My family moved there when I was five."}, {"who": "A", "text": "And did you always want to be a teacher?"}, {"who": "B", "text": "No, I didn't. When I was a child, I wanted to be a doctor!"}, {"who": "A", "text": "Really? What happened?"}, {"who": "B", "text": "I didn't like biology at school, so I chose languages. I studied French at university in Istanbul."}, {"who": "A", "text": "When did you graduate?"}, {"who": "B", "text": "In 2012. My first job was in a hotel. I worked at the reception for two years."}, {"who": "A", "text": "And when did you start teaching?"}, {"who": "B", "text": "About eight years ago. A friend needed a French teacher for her son, and I loved it."}, {"who": "A", "text": "Do you remember your first lesson?"}, {"who": "B", "text": "Yes! I was very nervous, and I forgot the boy's name!"}, {"who": "A", "text": "Ha! I did the same thing in my first lesson."}], "questions": [{"q": "Where did Leyla grow up?", "options": ["in Ankara", "in Bursa", "in Istanbul"], "answer": 1, "why": "\"I was born in Ankara, but I grew up in Bursa.\""}, {"q": "What did she want to be as a child?", "options": ["a doctor", "a teacher", "a singer"], "answer": 0, "why": "\"When I was a child, I wanted to be a doctor!\""}, {"q": "Why did she choose languages?", "options": ["Her father was a teacher", "She lived in France", "She didn't like biology"], "answer": 2, "why": "\"I didn't like biology at school, so I chose languages.\""}, {"q": "What was her first job?", "options": ["at a school", "at a hotel reception", "at a bank"], "answer": 1, "why": "\"My first job was in a hotel. I worked at the reception...\""}, {"q": "What happened in her first lesson?", "options": ["She was late", "The boy didn't come", "She forgot the boy's name"], "answer": 2, "why": "\"I was very nervous, and I forgot the boy's name!\""}]}, "accents": {"sentences": [{"text": "I was born in a small town, but I grew up in the city.", "accent": "en-GB"}, {"text": "She graduated from university in 2010.", "accent": "en-US"}, {"text": "When did you decide to become a teacher?", "accent": "en-AU"}, {"text": "I didn't want to be a teacher at first.", "accent": "en-IN"}, {"text": "We moved to Antalya three years ago.", "accent": "en-IE"}, {"text": "I remember my first job very well.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Tell the main events of your life, from birth to today, in 6–8 sentences.", "model": "I was born in a small town near Antalya. I grew up with my two sisters. I studied Russian at university and graduated in 2012. My first job was in a hotel, where I spoke Russian with the guests every day. Then I decided to teach. Five years ago I started giving private lessons, and now I teach online too.", "checklist": ["I used at least 6 past simple verbs", "I used irregular verbs: was, grew up, spoke...", "I used time words: in 2012, five years ago, then"]}, {"task": "Describe the best day of your childhood.", "model": "The best day of my childhood was my seventh birthday. My parents took me to the sea, and we had a picnic on the beach. My grandfather gave me a red bicycle. I rode it all afternoon and I fell twice, but I didn't cry! In the evening we ate cake together. I remember it very well.", "checklist": ["I used past simple, not present", "I used 3 irregular verbs (took, gave, ate...)", "I said how I felt"]}, {"task": "Ask yourself 4 'Did...?' questions about last weekend and answer them.", "model": "Did I work last weekend? Yes, I did. I taught two lessons on Saturday. Did I go out? Yes, I went to the market with my friend. Did I study English? Yes, I did. I learned ten new words. Did I sleep a lot? No, I didn't!", "checklist": ["I used Did + base verb (Did I go, not Did I went)", "I used short answers: Yes, I did / No, I didn't", "I used last weekend correctly"]}], "shadow": ["I was born in a small town, but I grew up by the sea.", "When did you start teaching?", "I didn't want to be a teacher at first, but I changed my mind."]}, "conf": {"minute_topics": ["Talk for one minute about the town where you grew up.", "Talk for one minute about your favourite teacher at school.", "Talk for one minute about your first job.", "Talk for one minute about a happy day in your childhood.", "Talk for one minute about why you chose to teach Russian."], "lifesavers": ["So, what happened was…", "Let me start at the beginning."], "win": "Today I can tell the main events of my life in the past simple."}}, {"n": 14, "focus": "Listening & Grammar", "classwork": ["Write the answers to 5 of the interview questions (2–3 sentences each).", "Shadow Elena’s text 3 times.", "Watch one short ‘How I became a…’ interview on YouTube with English subtitles; write 3 facts."], "read": {"title": "Interview: How I Became a Translator (Murat, Izmir)", "text": "Q: When did you start translating?\nA: I started fifteen years ago, when I was still a student. I studied English and German at university in Izmir, and a local company needed someone to translate its website. I didn't have any experience, but I said yes.\n\nQ: Was it easy?\nA: No, it wasn't! I worked very slowly, and I checked every word in the dictionary. The job took three weeks. But the company liked my work and asked me to translate their price lists too.\n\nQ: When did you decide to become a full-time translator?\nA: After I graduated, I worked in a bank for two years. I hated it. One evening I talked to my old teacher, and she asked, 'Why don't you translate?' The next month I left the bank and opened my own small office.\n\nQ: What did you learn in the first year?\nA: I learned that good translators always ask questions. I also learned to say no to very cheap jobs!", "questions": [{"q": "When did Murat start translating?", "options": ["after he left the bank", "when he was a student", "when he was a child"], "answer": 1, "why": "\"I started fifteen years ago, when I was still a student.\""}, {"q": "Why was his first job slow?", "options": ["He checked every word in the dictionary", "The company changed the text", "He was ill"], "answer": 0, "why": "\"I worked very slowly, and I checked every word in the dictionary.\""}, {"q": "What did Murat do after he graduated?", "options": ["He opened an office", "He taught German", "He worked in a bank"], "answer": 2, "why": "\"After I graduated, I worked in a bank for two years.\""}, {"q": "Who gave him the idea to translate full-time?", "options": ["his manager at the bank", "his old teacher", "his father"], "answer": 1, "why": "\"I talked to my old teacher, and she asked, 'Why don't you translate?'\""}, {"q": "What did he learn in the first year?", "options": ["to say no to very cheap jobs", "to work faster", "to use a computer"], "answer": 0, "why": "\"I also learned to say no to very cheap jobs!\""}], "find": [{"meaning": "finished university", "word": "graduated"}, {"meaning": "make a choice about what to do", "word": "decide"}, {"meaning": "knowledge you get from doing a job before", "word": "experience"}]}, "listen": {"title": "From the office to the piano", "situation": "On a local radio programme, Sam interviews Elena, a music teacher in Fethiye, about how she became a teacher.", "speakers": {"A": {"name": "Sam", "accent": "en-AU"}, "B": {"name": "Elena", "accent": "en-GB"}}, "lines": [{"who": "A", "text": "Today I'm talking to Elena, a music teacher in Fethiye. Elena, how did you become a teacher?"}, {"who": "B", "text": "Well, I didn't plan it. I studied economics and worked in an office in Moscow."}, {"who": "A", "text": "So what changed?"}, {"who": "B", "text": "I visited Turkey on holiday in 2015, and I loved it. A year later I moved here."}, {"who": "A", "text": "Did you find work quickly?"}, {"who": "B", "text": "No. I looked for office jobs, but I didn't speak Turkish. Then a neighbour asked me to help her daughter with the piano."}, {"who": "A", "text": "And that was the start?"}, {"who": "B", "text": "Exactly. I enjoyed it so much. More parents called me, and soon I had twenty students."}, {"who": "A", "text": "Did you need a teaching certificate?"}, {"who": "B", "text": "Yes. I completed an online course in 2018. It helped me a lot."}, {"who": "A", "text": "What's the best part of your job?"}, {"who": "B", "text": "When a shy child smiles and plays a song for the first time. I love that moment."}], "questions": [{"q": "What did Elena study?", "options": ["music", "economics", "Turkish"], "answer": 1, "why": "\"I studied economics and worked in an office in Moscow.\""}, {"q": "When did she visit Turkey on holiday?", "options": ["in 2015", "in 2016", "in 2018"], "answer": 0, "why": "\"I visited Turkey on holiday in 2015.\""}, {"q": "Why didn't she get an office job?", "options": ["She didn't like offices", "There were no jobs", "She didn't speak Turkish"], "answer": 2, "why": "\"I looked for office jobs, but I didn't speak Turkish.\""}, {"q": "How did her teaching start?", "options": ["She opened a school", "A neighbour asked her to help her daughter", "She put an advert online"], "answer": 1, "why": "\"...a neighbour asked me to help her daughter with the piano.\""}, {"q": "What did she do in 2018?", "options": ["She completed an online course", "She moved to Fethiye", "She bought a piano"], "answer": 0, "why": "\"I completed an online course in 2018.\""}]}, "accents": {"sentences": [{"text": "I started teaching ten years ago.", "accent": "en-GB"}, {"text": "She worked in an office and hated it.", "accent": "en-US"}, {"text": "We moved to the coast last year.", "accent": "en-AU"}, {"text": "I decided to change my career.", "accent": "en-IN"}, {"text": "He studied German at university.", "accent": "en-IE"}, {"text": "They visited Turkey and loved it.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Answer the question: How did you become a teacher? Speak for 1 minute.", "model": "I didn't plan to become a teacher. At university I studied Russian because I loved the language. After I graduated, I worked in a hotel and I translated for the guests. One day a colleague asked me to teach her son. I enjoyed it a lot, so I decided to give private lessons. That was my first step.", "checklist": ["I used past simple all the time", "I said -ed correctly: worked /t/, decided /id/, enjoyed /d/", "I used linking words: after, one day, so"]}, {"task": "Interview yourself: ask and answer 4 questions about your studies.", "model": "Where did you study? I studied at a university in Ankara. What did you study? I studied Russian language and literature. When did you graduate? I graduated in 2010. Did you like it? Yes, I did, but the exams were very hard!", "checklist": ["I used Did / When did / Where did + base verb", "I answered in full sentences", "I didn't say 'did you studied'"]}, {"task": "Tell a short story about a big change in your life.", "model": "Five years ago I decided to change my life. I left my job in an office and started teaching online. At first it was difficult because I didn't have many students. Then I created a profile on a teaching website, and slowly more students found me. It was the best decision of my life.", "checklist": ["I used ago / at first / then", "I used past verbs: decided, left, started, found", "I said why it was a good or bad change"]}], "shadow": ["I started teaching ten years ago, and I loved it.", "I looked for an office job, but I didn't find one.", "Then I decided to change my career."]}, "conf": {"minute_topics": ["Talk for one minute about your first student.", "Talk for one minute about your university.", "Talk for one minute about a good decision you made.", "Talk for one minute about a teacher you remember.", "Talk for one minute about a big change in your life."], "lifesavers": ["Really? Tell me more!", "That's interesting!"], "win": "Today I can ask and answer questions about my past with 'Did you…?'."}}, {"n": 15, "focus": "Writing & Fluency", "classwork": ["Type her corrected biography and keep it for her tutor profile.", "Voice note (90 sec): ‘How I became a teacher’ (no notes).", "Learn any irregular verbs she still gets wrong; the race is on Monday!"], "read": {"title": "Meet Our Teachers", "text": "Ana Lopez (Spanish)\nAna was born in Seville and grew up in a family of teachers. She studied Spanish literature at the University of Granada and graduated in 2011. Her first job was at a language school in London. In 2016 she moved to Antalya, and she became a private tutor. Ana loves cooking, and her students often learn new words through recipes.\n\nThomas Weber (German)\nThomas grew up in Hamburg. He studied engineering, but he didn't enjoy it, so he changed his career at twenty-five. He completed a teaching course in Berlin and taught adults there for six years. He came to Turkey three years ago. Thomas is patient and calm, and he explains grammar in a simple way.\n\nYuki Tanaka (Japanese)\nYuki was born in Osaka. When she was a child, she watched Turkish TV series with her mother, and she decided to learn Turkish. She studied in Istanbul for two years and then chose to stay. Today she teaches Japanese online to students in twelve countries.", "questions": [{"q": "Where was Ana's first job?", "options": ["in Seville", "in London", "in Antalya"], "answer": 1, "why": "\"Her first job was at a language school in London.\""}, {"q": "Why did Thomas change his career?", "options": ["He didn't enjoy engineering", "He moved to Turkey", "He lost his job"], "answer": 0, "why": "\"He studied engineering, but he didn't enjoy it, so he changed his career.\""}, {"q": "How long did Thomas teach in Berlin?", "options": ["three years", "twenty-five years", "six years"], "answer": 2, "why": "\"...taught adults there for six years.\""}, {"q": "Why did Yuki decide to learn Turkish?", "options": ["Her father was Turkish", "She watched Turkish TV series with her mother", "She went to school in Istanbul as a child"], "answer": 1, "why": "\"...she watched Turkish TV series with her mother, and she decided to learn Turkish.\""}, {"q": "Which teacher uses recipes in lessons?", "options": ["Thomas", "Yuki", "Ana"], "answer": 2, "why": "\"Ana loves cooking, and her students often learn new words through recipes.\""}], "find": [{"meaning": "the job or jobs you do in your working life", "word": "career"}, {"meaning": "finished a degree at university", "word": "graduated"}, {"meaning": "picked one thing from different possibilities", "word": "chose"}]}, "listen": {"title": "Your biography is too short", "situation": "Katie helps her friend Selim, a maths teacher, with the biography for his tutor profile.", "speakers": {"A": {"name": "Katie", "accent": "en-GB"}, "B": {"name": "Selim", "accent": "en-IN"}}, "lines": [{"who": "A", "text": "Hi Selim. I read your biography last night."}, {"who": "B", "text": "And? Was it OK?"}, {"who": "A", "text": "It was good, but it was very short. You wrote only three sentences, and they were all about your degree."}, {"who": "B", "text": "I know. I didn't know what to say."}, {"who": "A", "text": "Tell students about your story. Where did you grow up?"}, {"who": "B", "text": "In Trabzon, near the Black Sea."}, {"who": "A", "text": "Great, write that. And why did you choose to teach maths?"}, {"who": "B", "text": "My father was a maths teacher. When I was a child, he gave me puzzles every evening."}, {"who": "A", "text": "That's perfect! Students love stories like that. What about your experience?"}, {"who": "B", "text": "I taught at a high school for nine years. Then I decided to work online."}, {"who": "A", "text": "Write all of that, and add a friendly sentence at the end."}, {"who": "B", "text": "Like, I can't wait to meet you?"}, {"who": "A", "text": "Exactly!"}, {"who": "B", "text": "Thanks, Katie. I'm writing it again tonight."}], "questions": [{"q": "What was the problem with Selim's biography?", "options": ["It was too long", "It was very short", "It had many mistakes"], "answer": 1, "why": "\"It was good, but it was very short.\""}, {"q": "Where did Selim grow up?", "options": ["in Trabzon", "in Ankara", "in Izmir"], "answer": 0, "why": "\"In Trabzon, near the Black Sea.\""}, {"q": "Why did he choose to teach maths?", "options": ["He loved computers", "His father was a maths teacher", "He needed money"], "answer": 1, "why": "\"My father was a maths teacher.\""}, {"q": "How long did he teach at a high school?", "options": ["five years", "seven years", "nine years"], "answer": 2, "why": "\"I taught at a high school for nine years.\""}, {"q": "What does Katie tell him to add at the end?", "options": ["his phone number", "his prices", "a friendly sentence"], "answer": 2, "why": "\"...add a friendly sentence at the end.\""}]}, "accents": {"sentences": [{"text": "She was born in Seville and grew up in a family of teachers.", "accent": "en-GB"}, {"text": "He changed his career when he was twenty-five.", "accent": "en-US"}, {"text": "I chose this job because I love languages.", "accent": "en-AU"}, {"text": "My first job was at a language school.", "accent": "en-IN"}, {"text": "We met at university twenty years ago.", "accent": "en-IE"}, {"text": "When did you become a private tutor?", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Say your tutor biography as if you are recording a short video for your profile (about 1 minute).", "model": "Hello! I'm a Russian teacher from Antalya. I was born here and I grew up by the sea. I studied Russian at university and graduated in 2011. My first job was in a travel company, where I translated every day. Six years ago I decided to teach, and I love it. I can't wait to meet you!", "checklist": ["I used past simple for my story", "I told students about my experience", "I finished with a friendly sentence"]}, {"task": "Tell your teaching story without notes: how you started, a difficult moment, and today.", "model": "I started teaching by accident. A neighbour needed help with Russian, so I taught her daughter. At first it was hard because I didn't have any books or plans. One day the girl cried because the grammar was difficult, and I felt terrible. So I changed my method and used games. Today I have many students, and they enjoy the lessons.", "checklist": ["I used At first / One day / Today", "I used 3 irregular verbs (taught, felt, had...)", "I didn't stop for a long time"]}, {"task": "Describe a teacher who changed your life.", "model": "When I was fourteen, I had a wonderful Russian teacher called Anna. She was strict, but she was very kind. She gave us songs and films in Russian, and I fell in love with the language. Because of her, I chose Russian at university. I remember her every time I start a new class.", "checklist": ["I used past simple", "I described the person (kind, strict...)", "I explained why she or he was important"]}], "shadow": ["I studied at university and graduated in 2011.", "Six years ago I decided to become a private tutor.", "I can't wait to meet you!"]}, "conf": {"minute_topics": ["Talk for one minute about how you became a teacher.", "Talk for one minute about the day you moved to a new home.", "Talk for one minute about a person who helped you in your career.", "Talk for one minute about something you learned ten years ago.", "Talk for one minute about your favourite childhood memory."], "lifesavers": ["Anyway, …", "Where was I?"], "win": "Today I can tell my teaching story for two minutes."}}], "mission": {"title": "Ask a tourist one question", "why": "Talking to a stranger for 30 seconds shows you that people understand your English, and that is a big step to talking with new students.", "steps": ["Go to a busy place in Antalya: Kaleiçi, the marina or a beach café.", "Find a friendly tourist who is not in a hurry.", "Ask ONE question from the list and listen to the answer.", "Say thank you and smile. Then write one sentence in your notebook: what happened?"], "say_this": ["Excuse me, where are you from?", "When did you arrive in Antalya?", "Did you visit the old town?", "Have a great holiday!"], "bonus": "Ask a second question: 'What was the best thing you saw?'"}, "video": {"youtube_id": "yHNOHXFbP78", "title": "Talking about your childhood - Real Easy English", "channel": "BBC Learning English", "seconds": 355, "start": 24, "end": 320, "checked": "oEmbed OK + English subtitles read on 2026-11-18", "lessons": {"13": {"before": "Remember one thing you did a lot when you were a child.", "questions": [{"q": "What are Neil and Beth talking about?", "options": ["Their first jobs", "Their childhoods", "Their schools today"], "answer": 1, "why": "\"Today we're talking about our childhoods.\""}, {"q": "Where did Neil live as a child?", "options": ["In Spain", "In Canada", "In Scotland"], "answer": 1, "why": "\"I lived in Canada until I was ten years old.\""}, {"q": "What did Beth and her friends often do?", "options": ["Put on shows", "Play ice hockey", "Go to the cinema"], "answer": 0, "why": "\"my friends and I used to always put on shows.\""}], "after": "Voice note (1 minute): Where did you grow up? What did you do as a child?"}, "14": {"before": "Listen for past simple verbs. Write down 5 that you hear.", "questions": [{"q": "What were winters like in Canada?", "options": ["Short and warm", "Long, cold and snowy", "Rainy"], "answer": 1, "why": "\"very long and very cold and snowy winters.\""}, {"q": "What did Beth and her friend send to a recording studio?", "options": ["A tape of their own song", "A video", "A letter"], "answer": 0, "why": "\"We recorded our own song onto a tape, and we sent it to a recording studio\""}, {"q": "Which sport did Neil play in Canada?", "options": ["Tennis", "Basketball", "Ice hockey"], "answer": 2, "why": "\"I played ice hockey.\""}, {"q": "Why do group chats drive Neil mad?", "options": ["They are expensive", "His son tries to arrange to meet friends and nothing happens", "They are too loud"], "answer": 1, "why": "\"my son will try to arrange to go out with his friends... in a group chat, and then nothing ever happens.\""}], "after": "Write 6 sentences about your childhood: I was born... I grew up... I studied... I remember..."}, "15": {"before": "Watch again and listen for 'used to' and 'brings back memories'.", "questions": [{"q": "'Brings back memories' means...", "options": ["gives you a present", "reminds you of something in the past", "makes you forget"], "answer": 1, "why": "\"it reminds you of something that happened in the past.\""}, {"q": "\"I used to play ice hockey\" means...", "options": ["I play it now", "I played it a lot, but I don't now", "I never played it"], "answer": 1, "why": "\"It means: I played ice hockey a lot, and now I don't any more.\""}, {"q": "Complete: \"I ___ in Canada until I was ten years old.\"", "options": ["live", "lived", "living"], "answer": 1, "why": "\"I lived in Canada until I was ten years old.\""}], "after": "Retell Neil's or Beth's childhood in 5 sentences. Then say how the world has changed since you were a child."}}}, "words": [{"w": "was born", "e": "👶🏥", "x": "I was born in a small town near the Volga.", "ru": "doğdu"}, {"w": "grew up", "e": "🧒➡️🧑", "x": "I grew up with my grandparents.", "ru": "büyüdü"}, {"w": "moved", "e": "🚚🏠", "x": "We moved to a big city five years ago.", "ru": "taşındı"}, {"w": "studied", "e": "📚🎓", "x": "I studied languages at university.", "ru": "okudu, çalıştı"}, {"w": "graduated", "e": "🎓🎉", "x": "She graduated in 2008.", "ru": "mezun oldu"}, {"w": "degree", "e": "📜", "x": "I have a degree in Russian literature.", "ru": "diploma, derece"}, {"w": "university", "e": "🏛️", "x": "My university was in the city centre.", "ru": "üniversite"}, {"w": "first job", "e": "💼1️⃣", "x": "My first job was at a language school.", "ru": "ilk iş"}, {"w": "became", "e": "🦋", "x": "I became a teacher in 2010.", "ru": "oldu (…oldu)"}, {"w": "decided", "e": "🤔➡️✅", "x": "I decided to teach online.", "ru": "karar verdi"}, {"w": "chose", "e": "👉", "x": "I chose this job because I love languages.", "ru": "seçti"}, {"w": "career", "e": "📈💼", "x": "Teaching is a wonderful career.", "ru": "kariyer"}, {"w": "remember", "e": "🧠💭", "x": "I remember my first lesson very well.", "ru": "hatırlamak"}, {"w": "childhood", "e": "🧸", "x": "I had a happy childhood.", "ru": "çocukluk"}, {"w": "ago", "e": "⏪", "x": "I started teaching fifteen years ago.", "ru": "önce"}, {"w": "change", "e": "🔄", "x": "Online teaching changed my life.", "ru": "değişmek; değişiklik"}]}, {"week": 6, "topic": "Travel and Stories", "lessons": [{"n": 16, "focus": "Speaking & Vocabulary", "classwork": ["Write the picture story (80–100 words) from the woman’s point of view.", "Word Trainer: Week 6 vocabulary.", "Voice note: ‘What were you doing at 7 a.m., 1 p.m. and 9 p.m. yesterday?’"], "read": {"title": "The Wrong Bus", "text": "Last summer, my friend Ceren and I booked a three-day trip to Cappadocia. We were very excited. First, we took a night bus from Antalya. While the other passengers were sleeping, we were talking and eating snacks.\n\nAt six in the morning the bus stopped, and we got off. We were looking for our hotel when we noticed something strange: there were no famous rock houses and no balloons. Then a man told us, 'This is Konya, not Cappadocia!' We were on the wrong bus!\n\nAfter that, we went to the bus station and asked about the next bus. It was three hours later, so we did some sightseeing in Konya. We visited a beautiful old mosque and a museum, and we bought a souvenir for my mother.\n\nIn the end, we arrived in Cappadocia in the evening. We were tired, but the next morning, while we were drinking coffee on the hotel roof, a hundred balloons flew over us. It was amazing.", "questions": [{"q": "How did they travel to Cappadocia?", "options": ["by plane", "by night bus", "by car"], "answer": 1, "why": "\"First, we took a night bus from Antalya.\""}, {"q": "What were they doing while the other passengers were sleeping?", "options": ["talking and eating snacks", "reading", "watching a film"], "answer": 0, "why": "\"...we were talking and eating snacks.\""}, {"q": "Where were they at six in the morning?", "options": ["in Cappadocia", "in Ankara", "in Konya"], "answer": 2, "why": "\"This is Konya, not Cappadocia!\""}, {"q": "What did they do while they were waiting for the next bus?", "options": ["They slept at the station", "They did some sightseeing", "They called the hotel"], "answer": 1, "why": "\"...so we did some sightseeing in Konya.\""}, {"q": "What happened while they were drinking coffee on the roof?", "options": ["It started to rain", "Ceren lost her bag", "A hundred balloons flew over them"], "answer": 2, "why": "\"...a hundred balloons flew over us.\""}], "find": [{"meaning": "visiting famous places as a tourist", "word": "sightseeing"}, {"meaning": "a small thing you buy to remember a place", "word": "souvenir"}, {"meaning": "finally, after everything", "word": "In the end"}]}, "listen": {"title": "The night the lights went off", "situation": "Two neighbours, Jack and Maria, talk about a power cut in their street last night.", "speakers": {"A": {"name": "Jack", "accent": "en-AU"}, "B": {"name": "Maria", "accent": "en-IE"}}, "lines": [{"who": "A", "text": "Did you hear the noise last night?"}, {"who": "B", "text": "No! What happened? Tell me."}, {"who": "A", "text": "The electricity went off at nine o'clock last night. The whole street was dark."}, {"who": "B", "text": "Really? What were you doing when it happened?"}, {"who": "A", "text": "I was cooking dinner. Suddenly the lights went off, and the oven stopped."}, {"who": "B", "text": "Oh no! What did you do?"}, {"who": "A", "text": "First, I looked for a candle. Then I went outside. All our neighbours were standing in the street and talking."}, {"who": "B", "text": "I didn't know anything. I was sleeping on the sofa with the TV on!"}, {"who": "A", "text": "You were lucky. The electricity came back at eleven, so we ate very late."}, {"who": "B", "text": "What were your children doing?"}, {"who": "A", "text": "They were playing a game with a torch. In the end, they loved it!"}, {"who": "B", "text": "Ha! Children always love a little adventure."}, {"who": "A", "text": "True. But I want my dinner on time tonight!"}], "questions": [{"q": "When did the electricity go off?", "options": ["at seven", "at nine", "at eleven"], "answer": 1, "why": "\"The electricity went off at nine o'clock.\""}, {"q": "What was Jack doing when it happened?", "options": ["He was cooking dinner", "He was sleeping", "He was watching TV"], "answer": 0, "why": "\"I was cooking dinner.\""}, {"q": "What were the neighbours doing?", "options": ["They were calling the police", "They were sleeping", "They were standing in the street and talking"], "answer": 2, "why": "\"All our neighbours were standing in the street and talking.\""}, {"q": "What was Maria doing?", "options": ["She was cooking", "She was sleeping on the sofa", "She was playing a game"], "answer": 1, "why": "\"I was sleeping on the sofa with the TV on!\""}, {"q": "What were Jack's children doing?", "options": ["They were doing homework", "They were crying", "They were playing a game with a torch"], "answer": 2, "why": "\"They were playing a game with a torch.\""}]}, "accents": {"sentences": [{"text": "I was waiting for the bus when it started to rain.", "accent": "en-GB"}, {"text": "While we were walking, we saw an old friend.", "accent": "en-US"}, {"text": "What were you doing at eight o'clock last night?", "accent": "en-AU"}, {"text": "First we booked the hotel, then we bought the tickets.", "accent": "en-IN"}, {"text": "Suddenly the lights went off.", "accent": "en-IE"}, {"text": "In the end, it was an amazing trip.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "What were you doing at 7 a.m., 1 p.m. and 9 p.m. yesterday?", "model": "At seven a.m. yesterday I was having breakfast and I was reading my messages. At one p.m. I was teaching an online lesson; my student was practising the alphabet. At nine p.m. I was sitting on the sofa and I was watching a film with my family.", "checklist": ["I used was/were + -ing", "I said the times clearly", "I added details"]}, {"task": "Tell a story about a trip. Use First, Then, After that and In the end.", "model": "Two years ago I went to Istanbul with my sister. First, we took an early flight. Then we left our luggage at the hotel and went sightseeing. After that, we had dinner by the sea. While we were walking back, it started to rain. In the end, we arrived at the hotel completely wet, but we laughed a lot.", "checklist": ["I used First / Then / After that / In the end", "I used when or while once", "I used past simple for the main events"]}, {"task": "Imagine a busy airport. Describe what was happening when you arrived.", "model": "When I arrived at the airport, it was very busy. A family was running to their gate. A man was sleeping on three chairs. Two pilots were drinking coffee, and a little boy was crying because he lost his toy. Suddenly I heard an announcement about a delay on our flight.", "checklist": ["I used was/were + -ing for the background", "I used past simple for the sudden action", "I used suddenly"]}], "shadow": ["I was waiting for the bus when it started to rain.", "While we were walking, we saw an old friend.", "First we went to the hotel, and after that we went sightseeing."]}, "conf": {"minute_topics": ["Talk for one minute about your best trip.", "Talk for one minute about a city you want to visit again.", "Talk for one minute about a funny thing that happened on holiday.", "Talk for one minute about a souvenir you bought.", "Talk for one minute about a long journey you made."], "lifesavers": ["And then…", "After that, …"], "win": "Today I can tell a short story with first, then, suddenly and in the end."}}, {"n": 17, "focus": "Listening & Grammar", "classwork": ["Review the error log; tick off the mistakes she no longer makes.", "Shadow the Istanbul story 3 times.", "Prepare for Friday: the midpoint check (no preparation needed, just a good night’s sleep!)."], "read": {"title": "A Lucky Delay", "text": "Karen is a travel writer from Canada. Last spring she was flying from Istanbul to Rome for work. When she arrived at the airport, she saw a long line at the information desk. Her flight had a two-hour delay.\n\nKaren was annoyed. While she was waiting at the gate, she opened her laptop and started to write. But the connection was terrible, so she closed it and went to a cafe.\n\nThe cafe was full. A woman with a big bag asked, 'Can I sit here?' Karen said yes, and they started to talk. The woman was a guide from Rome. She was coming home after a holiday in Cappadocia.\n\nWhile they were drinking coffee, the woman gave Karen some wonderful ideas for her article: a small restaurant, a secret garden and a quiet market. Then she wrote her phone number on a napkin.\n\nIn the end, Karen's article about Rome became very popular on her website. 'That delay was very lucky for me,' she says.", "questions": [{"q": "Where was Karen flying?", "options": ["from Rome to Istanbul", "from Istanbul to Rome", "from Canada to Turkey"], "answer": 1, "why": "\"...she was flying from Istanbul to Rome for work.\""}, {"q": "Why did she close her laptop?", "options": ["The connection was terrible", "The battery was empty", "The gate was noisy"], "answer": 0, "why": "\"But the connection was terrible, so she closed it.\""}, {"q": "Who was the woman in the cafe?", "options": ["a travel writer", "a pilot", "a guide from Rome"], "answer": 2, "why": "\"The woman was a guide from Rome.\""}, {"q": "What was the woman doing in Turkey?", "options": ["She was working", "She was on holiday", "She was visiting her family"], "answer": 1, "why": "\"She was coming home after a holiday in Cappadocia.\""}, {"q": "When did the woman give Karen ideas?", "options": ["while they were drinking coffee", "while they were on the plane", "after Karen arrived in Rome"], "answer": 0, "why": "\"While they were drinking coffee, the woman gave Karen some wonderful ideas.\""}], "find": [{"meaning": "a time when something happens later than planned", "word": "delay"}, {"meaning": "very bad", "word": "terrible"}, {"meaning": "a person who shows tourists a city", "word": "guide"}]}, "listen": {"title": "Where's my suitcase?", "situation": "Raj tells his friend Sophie about the first day of his trip to Istanbul.", "speakers": {"A": {"name": "Sophie", "accent": "en-GB"}, "B": {"name": "Raj", "accent": "en-IN"}}, "lines": [{"who": "A", "text": "How was your trip to Istanbul?"}, {"who": "B", "text": "Amazing, but the first day was terrible!"}, {"who": "A", "text": "Why? What happened?"}, {"who": "B", "text": "When I arrived at the airport, my luggage wasn't there. I waited for an hour, but my suitcase didn't come."}, {"who": "A", "text": "Oh no! What did you do?"}, {"who": "B", "text": "I went to the lost luggage office. While I was filling in a form, I realised my phone charger was in the suitcase too."}, {"who": "A", "text": "That's bad. Did you have any clothes?"}, {"who": "B", "text": "Only the clothes I was wearing! So I went shopping in the evening."}, {"who": "A", "text": "And did they find your suitcase?"}, {"who": "B", "text": "Yes. Two days later, while I was having breakfast at the hotel, the receptionist called me. My suitcase was downstairs!"}, {"who": "A", "text": "Where was it?"}, {"who": "B", "text": "It was on a flight to Athens! In the end, it had a better trip than me."}], "questions": [{"q": "What was the problem on the first day?", "options": ["His flight was late", "His luggage wasn't at the airport", "He lost his passport"], "answer": 1, "why": "\"When I arrived at the airport, my luggage wasn't there.\""}, {"q": "What did Raj realise while he was filling in a form?", "options": ["His phone charger was in the suitcase", "His hotel was far away", "He had no money"], "answer": 0, "why": "\"...I realised my phone charger was in the suitcase too.\""}, {"q": "Why did Raj go shopping?", "options": ["He needed souvenirs", "He wanted a new suitcase", "He only had the clothes he was wearing"], "answer": 2, "why": "\"Only the clothes I was wearing! So I went shopping.\""}, {"q": "What was Raj doing when the receptionist called him?", "options": ["He was sleeping", "He was having breakfast", "He was sightseeing"], "answer": 1, "why": "\"...while I was having breakfast at the hotel, the receptionist called me.\""}, {"q": "Where was the suitcase?", "options": ["at another hotel", "in a taxi", "on a flight to Athens"], "answer": 2, "why": "\"It was on a flight to Athens!\""}]}, "accents": {"sentences": [{"text": "When I arrived at the airport, my luggage wasn't there.", "accent": "en-GB"}, {"text": "While I was filling in a form, my phone rang.", "accent": "en-US"}, {"text": "Our flight had a two-hour delay.", "accent": "en-AU"}, {"text": "She was having breakfast when the receptionist called.", "accent": "en-IN"}, {"text": "We were walking by the sea when we saw the guide.", "accent": "en-IE"}, {"text": "It was a long journey, but it was worth it.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Tell a real travel story (1–2 minutes). Use when and while at least twice.", "model": "Three years ago I travelled to Saint Petersburg with a group of students. On the second day, while we were walking along the river, it suddenly started to snow. We were wearing summer jackets! We ran into a small cafe and ordered hot chocolate. While we were drinking it, the owner told us about the history of the city. In the end, it was my favourite day of the trip.", "checklist": ["I used when and while", "I used past continuous for the background", "I finished with In the end"]}, {"task": "Make 4 sentences with when or while about your last week.", "model": "I was cooking dinner when my student called me. While I was teaching on Tuesday, my camera froze. My neighbour started to play loud music while I was trying to sleep. While my friend was talking about her holiday, I was looking at her photos.", "checklist": ["long action: was/were + -ing", "short action: past simple", "I used when and while correctly"]}, {"task": "Describe a problem you had on a journey and how you solved it.", "model": "Last year I was flying to Moscow for a conference. While I was waiting at the gate, I heard about a five-hour delay. I was worried because I had a meeting in the evening. So I called the organisers and explained the problem. They moved my meeting to the next morning. In the end, everything was fine.", "checklist": ["I explained the problem", "I said what I did", "I used past simple + past continuous"]}], "shadow": ["When I arrived at the airport, my luggage wasn't there.", "While I was having breakfast, the receptionist called me.", "In the end, it was an amazing trip."]}, "conf": {"minute_topics": ["Talk for one minute about what you were doing last night at nine.", "Talk for one minute about a time something went wrong on a trip.", "Talk for one minute about a flight or bus journey you remember.", "Talk for one minute about a person you met while you were travelling.", "Talk for one minute about a day you got lost."], "lifesavers": ["Does that make sense?", "It's on the tip of my tongue."], "win": "Today I can join a long and a short action with when and while."}}, {"n": 18, "focus": "Midpoint Check & Writing", "classwork": ["Rewrite the story after correction and record herself reading it.", "Voice note: a funny or strange thing that happened to her.", "Read the 2 targets on her card every day this week."], "read": {"title": "A Trip I'll Never Forget (Nadia, a French teacher in Bodrum)", "text": "I usually travel in summer, but my favourite trip was in winter. Four years ago my students gave me a wonderful present: a weekend in Paris. I teach French, but at that time I didn't know France at all, so I was very excited.\n\nFirst, we had a problem. Our flight had a delay of four hours because of snow. While we were waiting at the airport, I made a plan with my friend Burcu: museums, cafes and a boat trip on the river.\n\nWe arrived late at night. The next morning, while we were walking to the Louvre, it started to snow again. Paris was white and quiet. It was amazing. Then, in a small cafe, I ordered breakfast in French for the first time. The waiter understood me, and he answered in French! I felt very proud.\n\nIn the end, we didn't see all the museums, but I didn't care. Today I always tell my students this story. It helps them understand that a language is a door to a new world.", "questions": [{"q": "What present did Nadia's students give her?", "options": ["a French book", "a boat trip", "a weekend in Paris"], "answer": 2, "why": "\"...my students gave me a wonderful present: a weekend in Paris.\""}, {"q": "Why was the flight late?", "options": ["because of snow", "because of a strike", "because the pilot was ill"], "answer": 0, "why": "\"Our flight had a delay of four hours because of snow.\""}, {"q": "What happened while they were walking to the Louvre?", "options": ["The museum closed", "It started to snow again", "They got lost"], "answer": 1, "why": "\"...while we were walking to the Louvre, it started to snow again.\""}, {"q": "Why did Nadia feel proud?", "options": ["She saw all the museums", "She found a cheap hotel", "She ordered breakfast in French and the waiter understood her"], "answer": 2, "why": "\"I ordered breakfast in French... The waiter understood me.\""}, {"q": "Why does she tell her students this story?", "options": ["to tell them to visit Paris", "to show that a language is a door to a new world", "to explain the weather in France"], "answer": 1, "why": "\"It helps them understand that a language is a door to a new world.\""}], "find": [{"meaning": "a time when something happens later than planned", "word": "delay"}, {"meaning": "very, very good and surprising", "word": "amazing"}, {"meaning": "finally, after everything", "word": "In the end"}]}, "listen": {"title": "Old friends at the station", "situation": "Lisa and Ahmet, two old friends, meet by chance at a train station and talk about their lives.", "speakers": {"A": {"name": "Lisa", "accent": "en-US"}, "B": {"name": "Ahmet", "accent": "en-ZA"}}, "lines": [{"who": "A", "text": "Ahmet! I don't believe it! What are you doing here?"}, {"who": "B", "text": "Lisa! I'm waiting for my sister. Her train is late."}, {"who": "A", "text": "Mine too! So, how are you? Are you still working at the bank?"}, {"who": "B", "text": "No, I left the bank two years ago. Now I work as a translator."}, {"who": "A", "text": "Really? How did that happen?"}, {"who": "B", "text": "Well, I was working on a project with a Japanese company when they needed someone to translate some documents. I tried it and I loved it."}, {"who": "A", "text": "That's great. Do you work from home?"}, {"who": "B", "text": "Usually, yes. But this month I'm working in an office in the city because we have a big project."}, {"who": "A", "text": "And are you happy?"}, {"who": "B", "text": "Very happy. What about you?"}, {"who": "A", "text": "I'm teaching yoga now. I started last year. Oh, look, my train is coming!"}, {"who": "B", "text": "Let's have coffee next week. Here's my number."}], "questions": [{"q": "Why is Ahmet at the station?", "options": ["He is waiting for his sister", "He is going to work", "He is meeting Lisa"], "answer": 0, "why": "\"I'm waiting for my sister. Her train is late.\""}, {"q": "When did Ahmet leave the bank?", "options": ["last year", "two years ago", "last month"], "answer": 1, "why": "\"I left the bank two years ago.\""}, {"q": "How did he start translating?", "options": ["He studied it at university", "Lisa helped him", "A company he was working with needed some documents translated"], "answer": 2, "why": "\"I was working on a project with a Japanese company when they needed someone to translate some documents.\""}, {"q": "Why is he working in an office this month?", "options": ["His computer is broken", "They have a big project", "He doesn't like working from home"], "answer": 1, "why": "\"...this month I'm working in an office... because we have a big project.\""}, {"q": "What does Lisa do now?", "options": ["She teaches yoga", "She works at a bank", "She is a translator"], "answer": 0, "why": "\"I'm teaching yoga now.\""}]}, "accents": {"sentences": [{"text": "I usually work from home, but this month I'm working in an office.", "accent": "en-GB"}, {"text": "I left the bank two years ago.", "accent": "en-US"}, {"text": "I was working on a project when they called me.", "accent": "en-AU"}, {"text": "Our flight had a delay because of the snow.", "accent": "en-IN"}, {"text": "I didn't know the city, so I booked a guide.", "accent": "en-IE"}, {"text": "It was a trip I'll never forget.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Tell the story 'A trip I'll never forget' in about 2 minutes.", "model": "The trip I'll never forget was to Kazan, five years ago. I was travelling with a group of Turkish students. On the first evening, while we were looking for a restaurant, we got lost in the old town. Suddenly a kind old man stopped and asked, 'Can I help you?' He took us to his favourite restaurant, and we had a wonderful dinner. In the end, he became our guide for the whole trip!", "checklist": ["I used past simple and past continuous", "I used sequencing words", "I spoke for at least 1 minute without stopping"]}, {"task": "Midpoint check: talk about yourself in 4 ways: what you usually do, what you're doing these days, what you did last week, and what you were doing yesterday at 8 p.m.", "model": "I usually teach Russian in the evenings. These days I'm also studying English three times a week. Last week I found two new students online. Yesterday at eight p.m. I was preparing a lesson when my friend called me.", "checklist": ["present simple", "present continuous", "past simple + past continuous"]}, {"task": "Tell something funny or strange that happened to you.", "model": "Last month I was teaching an online lesson when my cat jumped on the keyboard. Suddenly my screen went black! My student was laughing when I came back two minutes later. She said, 'Your cat wants to learn Russian too!' Now the cat is famous with all my students.", "checklist": ["I used when or suddenly", "My story was clear: start, problem, end", "I used was/were + -ing once"]}], "shadow": ["I was waiting at the airport when I heard the news.", "First we got lost, then a kind man helped us.", "It was a trip I'll never forget."]}, "conf": {"minute_topics": ["Talk for one minute about a trip you'll never forget.", "Talk for one minute about the worst journey of your life.", "Talk for one minute about a beautiful place you saw.", "Talk for one minute about what you were doing on your last birthday.", "Talk for one minute about a holiday with your family."], "lifesavers": ["The funny thing is…", "To cut a long story short, …"], "win": "Today I can tell a travel story for one minute without stopping."}}], "mission": {"title": "Share a travel story in English", "why": "Posting a short story in English helps you see yourself as an English speaker, and future students can see it too.", "steps": ["Choose one photo from a trip you remember.", "Write 3–4 sentences in English about it. Use 'when' or 'while' once.", "Read it out loud two times.", "Post it on your Instagram or WhatsApp status (or send it to one friend)."], "say_this": ["Last summer I went to…", "While I was walking in the old town, …", "Suddenly, …", "In the end, it was an amazing trip!"], "bonus": "Record yourself reading the story and post the voice note too."}, "video": {"youtube_id": "N2StxicQois", "title": "Talking about holidays - Real Easy English", "channel": "BBC Learning English", "seconds": 368, "start": 30, "end": 330, "checked": "oEmbed OK + English subtitles read on 2026-11-18", "lessons": {"16": {"before": "What is your dream holiday destination? Why?", "questions": [{"q": "What is the topic?", "options": ["Train problems", "Holidays and dream destinations", "Hotel jobs"], "answer": 1, "why": "\"today, we're talking about holidays and our dream destinations.\""}, {"q": "Neil's favourite place he has visited is...", "options": ["Japan", "Scotland", "South America"], "answer": 0, "why": "\"I really, really liked Japan, when I visited Japan.\""}, {"q": "Georgie's best holiday place is...", "options": ["Japan", "London", "Edinburgh"], "answer": 2, "why": "\"I really love Edinburgh in Scotland.\""}], "after": "Voice note (1 minute): tell the story of your best trip. Where did you go? What happened?"}, "17": {"before": "Listen for the names of places. Write them down.", "questions": [{"q": "Which two kinds of holidays does Neil like?", "options": ["Beaches and cruises", "Old cities, and mountains and countryside", "Theme parks and shopping"], "answer": 1, "why": "\"I like interesting cities... but I also like mountains and countryside\""}, {"q": "What should you do in Japan, says Neil?", "options": ["Buy souvenirs", "Eat as much food as you can", "Go skiing"], "answer": 1, "why": "\"You should eat as much food as you can, cos the food is fantastic.\""}, {"q": "When is the Fringe Festival in Edinburgh?", "options": ["In August", "In December", "In April"], "answer": 0, "why": "\"in August, for example, you could go to the Fringe Festival\""}, {"q": "A 'staycation' is...", "options": ["a long work trip", "a holiday at or near your home", "a holiday in a hotel abroad"], "answer": 1, "why": "\"a 'staycation' is 'a holiday at, actually in, your house, or near your house'.\""}], "after": "Write a 6-sentence travel story: I was ... when ... While I was ..., ... Then, In the end..."}, "18": {"before": "Watch again and listen for 'should' and 'could'.", "questions": [{"q": "A 'destination' is...", "options": ["a ticket", "a place you are going to", "a hotel"], "answer": 1, "why": "\"A 'destination' is what we call a place we are going to.\""}, {"q": "We use 'should' for...", "options": ["advice - a good idea", "something in the past", "something impossible"], "answer": 0, "why": "\"'Should', which we use to talk about 'something that it's a good idea to do'. This is advice.\""}, {"q": "We use 'could' for...", "options":
