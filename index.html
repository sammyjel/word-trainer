g Russian", "The best language app or website, in your opinion", "How you stay motivated when you are tired", "A mistake that helped you learn something", "Your goal for your English this month"], "lifesavers": ["To be honest, …", "That's true, but I also think …"], "win": "Today I can give my opinion politely and support it with a reason and an example."}}], "mission": {"title": "Your first English podcast: 5 tips for learning Russian", "why": "A 60-second tip in English shows future students that you are a confident, modern teacher, and it is great content for your profile.", "steps": ["Choose your three best tips from the blog post you wrote this week.", "Practise each tip out loud two times. Don't read; look at your notes only.", "Record a 60-second voice note or video on your phone. One take is enough!", "Send it to your teacher. Brave option: post it on your Instagram or tutor profile."], "say_this": ["Hi, I'm a Russian teacher, and today I want to share three tips.", "Tip number one: you should practise a little every day.", "You don't have to be perfect. You just have to be regular.", "Try this tip this week and tell me how it goes!"], "bonus": "Post it publicly with the caption 'My first English podcast!' and count the likes and comments."}, "video": {"youtube_id": "-XcALxwXJVY", "title": "Can apps teach you a language? - 6 Minute English", "channel": "BBC Learning English", "seconds": 376, "start": 7, "end": 307, "checked": "oEmbed OK + English subtitles read on 2026-11-18", "lessons": {"25": {"before": "Do you use a language app? Does it help you? Say why or why not.", "questions": [{"q": "What is the big question in this episode?", "options": ["Which app is the cheapest?", "Do language apps really help you learn?", "How do children learn grammar?"], "answer": 1, "why": "\"Apps like Duolingo, Babbel and Busuu all aim to help you learn a language, but do they really help?\""}, {"q": "What is the best way to improve, says Liz?", "options": ["Use only apps", "Combine apps with other ways of studying", "Take classes only"], "answer": 1, "why": "\"combining learning in apps with some other ways of studying is the best way\""}, {"q": "Which language can you NOT learn on Duolingo?", "options": ["Latin", "Klingon", "Elvish"], "answer": 2, "why": "\"you were right. It's c) Elvish\""}], "after": "Voice note (1 minute): give advice to a new Russian learner. What should they do? What mustn't they do?"}, "26": {"before": "This is B1 English - fast. Watch once, then use the gear icon for 0.75 speed.", "questions": [{"q": "How do children learn their first language?", "options": ["With grammar lessons", "Mostly implicitly - surrounded by the language", "With apps"], "answer": 1, "why": "\"it's mostly implicit - they don't have lessons.\""}, {"q": "How much time do many adults spend learning a language?", "options": ["All day", "A few hours a week", "One hour a month"], "answer": 1, "why": "\"adults are often learning for only a few hours a week.\""}, {"q": "In the study, who improved more on written grammar tests?", "options": ["The Duolingo learners", "The classroom learners", "Both the same"], "answer": 0, "why": "\"in some of the tests, written grammar tests, the Duolingo learners actually improved a bit more\""}, {"q": "Who improved more on listening?", "options": ["The Duolingo learners", "The classroom learners", "Neither"], "answer": 1, "why": "\"in a test where they were looking at listening the classroom learners appeared to improve more.\""}], "after": "Write 6 rules for your own Russian students: 'You should... You must... You don't have to...'"}, "27": {"before": "Watch again and listen for 'explicit', 'immersion' and 'key finding'.", "questions": [{"q": "'Explicit' means...", "options": ["communicated directly", "suggested but not said", "very difficult"], "answer": 0, "why": "\"'Explicit' is the opposite of 'implicit'. It means something is communicated directly.\""}, {"q": "'Immersion' means...", "options": ["a short test", "being completely surrounded by something", "a type of app"], "answer": 1, "why": "\"Immersion means being completely surrounded by something.\""}, {"q": "A 'key finding' is...", "options": ["the most important conclusion of research", "a lost key", "a test question"], "answer": 0, "why": "\"A key finding is the most important conclusion of a piece of research.\""}], "after": "Retell the study in 5 sentences. Then give your opinion: should your students use apps? Record it."}}}, "words": [{"w": "memorise", "e": "🧠", "x": "I memorise ten new words every day.", "ru": "ezberlemek"}, {"w": "revise", "e": "🔁", "x": "Revise the words from last week before the lesson.", "ru": "tekrar etmek (konu)"}, {"w": "motivation", "e": "🔥", "x": "Good results give students motivation.", "ru": "motivasyon"}, {"w": "confident", "e": "😎", "x": "I feel more confident when I speak English now.", "ru": "kendinden emin"}, {"w": "accent", "e": "🗣️", "x": "Don’t worry about your accent; people understand you.", "ru": "aksan"}, {"w": "practise", "e": "🏋️", "x": "You should practise speaking every day.", "ru": "pratik yapmak"}, {"w": "regularly", "e": "📅", "x": "Students who study regularly make fast progress.", "ru": "düzenli olarak"}, {"w": "effective", "e": "⚡", "x": "Shadowing is a very effective method.", "ru": "etkili"}, {"w": "method", "e": "🧩", "x": "My method is: speak first, grammar second.", "ru": "yöntem"}, {"w": "tip", "e": "💡", "x": "Here’s a tip: label things in your flat in Russian.", "ru": "ipucu"}, {"w": "avoid", "e": "🚫", "x": "Avoid translating every word.", "ru": "kaçınmak"}, {"w": "focus on", "e": "🔍", "x": "Focus on the main idea, not every word.", "ru": "odaklanmak"}, {"w": "progress", "e": "📈", "x": "You have made great progress this month.", "ru": "ilerleme"}, {"w": "mistake", "e": "❌", "x": "Everyone makes mistakes. That’s how we learn.", "ru": "hata"}, {"w": "habit", "e": "🔄", "x": "Reading ten minutes a day is a good habit.", "ru": "alışkanlık"}, {"w": "goal", "e": "🎯", "x": "Set a small goal for every week.", "ru": "hedef"}]}, {"week": 10, "topic": "Comparing and Choosing", "lessons": [{"n": 28, "focus": "Speaking & Vocabulary", "classwork": ["Voice note (1 min): compare her life now with her life 10 years ago (3 comparatives).", "Learn the 16 words; write one sentence with each about her lessons.", "Shadow the model text ‘Group or private?’ 3 times."], "read": {"title": "Group or private? A school owner explains", "text": "My name is Daniel Ross and I run a small language school in Izmir. Every week, new students ask me the same question: which option is better, a group lesson or a private lesson? The honest answer is that it depends on the student.\n\nPrivate lessons are more expensive than group lessons, but they are usually faster. The teacher follows your speed, corrects every mistake and plans the lesson around your goals. They are also more flexible, because you choose the day and the time. For busy people, this is often the most convenient option.\n\nGroup lessons are cheaper and more affordable for students and young people. You also hear other learners speak, and that is a real benefit. The disadvantage is that you speak less. In a group of eight, you only talk for a few minutes in each lesson.\n\nSo what should you choose? My advice is simple: compare the price, the time and your goal. If you need English quickly for a new job, private lessons are worth it. If you want to practise slowly and meet people, a group is a great choice.\n\nNot sure? Book a trial lesson first. We offer one free trial lesson to every new student, so you can try before you pay.", "questions": [{"q": "Who wrote this text?", "options": ["A student in a group class", "The owner of a language school", "A private teacher from Antalya"], "answer": 1, "why": "\"I run a small language school in Izmir.\""}, {"q": "According to Daniel, what is one advantage of private lessons?", "options": ["They are cheaper than group lessons", "You meet a lot of new people", "The teacher corrects every mistake"], "answer": 2, "why": "\"The teacher follows your speed, corrects every mistake...\""}, {"q": "What is the main disadvantage of group lessons?", "options": ["You speak less", "They are too expensive", "The times are not flexible enough for anybody"], "answer": 0, "why": "\"The disadvantage is that you speak less.\""}, {"q": "Who does Daniel think private lessons are worth it for?", "options": ["People who want to meet friends", "People who need English quickly for a new job", "Young students with little money"], "answer": 1, "why": "\"If you need English quickly for a new job, private lessons are worth it.\""}, {"q": "What does the school offer every new student?", "options": ["A discount on group lessons", "A free book", "One free trial lesson"], "answer": 2, "why": "\"We offer one free trial lesson to every new student.\""}], "find": [{"meaning": "costing not too much money", "word": "affordable"}, {"meaning": "easy to change; you can choose", "word": "flexible"}, {"meaning": "a good result that helps you", "word": "benefit"}]}, "listen": {"title": "Which course should I choose?", "situation": "Emma, a tutor, is talking on the phone to Mark, who wants to learn Spanish before he moves to Madrid.", "speakers": {"A": {"name": "Emma", "accent": "en-GB"}, "B": {"name": "Mark", "accent": "en-US"}}, "lines": [{"who": "B", "text": "Hi Emma. I'm moving to Madrid in March, and I want to start Spanish lessons. What options do you have?"}, {"who": "A", "text": "Hi Mark. I have two options: a group lesson on Tuesday evenings, or private lessons online."}, {"who": "B", "text": "Which one is cheaper?"}, {"who": "A", "text": "The group lesson is cheaper. It's fifteen pounds a lesson. Private lessons are thirty pounds, so they're more expensive."}, {"who": "B", "text": "Hmm. And which one is faster?"}, {"who": "A", "text": "Private lessons, definitely. In the group there are six people, so you speak less. In a private lesson you speak all the time."}, {"who": "B", "text": "I only have three months, and I work late on Tuesdays."}, {"who": "A", "text": "Then private lessons are more convenient for you. They're more flexible. You choose the time."}, {"who": "B", "text": "That's true. Is there a trial lesson?"}, {"who": "A", "text": "Yes, the first lesson is half price. You can see if it's worth it."}, {"who": "B", "text": "Great. Let's book the trial lesson for Saturday morning."}, {"who": "A", "text": "Perfect. See you then, Mark. Is ten o'clock convenient for you? I'll send you the link on Friday, and we can talk about your goals in the first lesson."}], "questions": [{"q": "Why does Mark want to learn Spanish?", "options": ["He is moving to Madrid", "He has a Spanish wife", "He wants a new job in London"], "answer": 0, "why": "\"I'm moving to Madrid in March.\""}, {"q": "How much does one group lesson cost?", "options": ["Thirty pounds", "Fifteen pounds", "Fifty pounds"], "answer": 1, "why": "\"It's fifteen pounds a lesson.\""}, {"q": "How many people are in the group?", "options": ["Six", "Three", "Eight"], "answer": 0, "why": "\"In the group there are six people.\""}, {"q": "Why can't Mark go to the group lesson easily?", "options": ["It is too expensive", "It is too far from his home", "He works late on Tuesdays"], "answer": 2, "why": "\"I work late on Tuesdays.\""}, {"q": "What does Mark decide to do?", "options": ["Join the group in March", "Book a trial lesson on Saturday", "Wait until he is in Madrid"], "answer": 1, "why": "\"Let's book the trial lesson for Saturday morning.\""}]}, "accents": {"sentences": [{"text": "Private lessons are more expensive, but they're much faster.", "accent": "en-GB"}, {"text": "This is the most convenient option for busy people.", "accent": "en-US"}, {"text": "Online lessons are as effective as face-to-face lessons.", "accent": "en-AU"}, {"text": "Group lessons are more affordable for students.", "accent": "en-IN"}, {"text": "The trial lesson is free, so it's definitely worth it.", "accent": "en-IE"}, {"text": "Let's compare the two options before you choose.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Compare your life now with your life ten years ago. Use three comparatives (for example: busier, happier, more confident).", "model": "Ten years ago my life was quieter than now. I had fewer students and more free time. Now I'm busier, but I'm also happier, because I teach online and I have students from different countries. My English is better than before, and I feel more confident at work. Life is more expensive now, but it's more interesting too.", "checklist": ["I used three comparatives (-er / more ...)", "I used 'than' correctly", "I spoke for about one minute"]}, {"task": "A friend wants to learn Russian. Compare a group lesson and a private lesson with you. Which option is better for her?", "model": "Group lessons are cheaper and more affordable, and you can meet other learners. But private lessons are faster, because you speak all the time and I correct every mistake. They are also more flexible. You choose the day and the time. For you, I think private lessons are the best option, because you are very busy and you want to learn quickly.", "checklist": ["I gave one advantage and one disadvantage", "I used a superlative (the best / the most ...)", "I gave a reason with 'because'"]}, {"task": "Talk about the best and the worst thing about teaching online.", "model": "The best thing about teaching online is that it's very convenient. I don't travel, so I save time and money. My students are more relaxed at home, too. The worst thing is the connection. Sometimes the screen freezes and we lose five minutes. But for me, online lessons are as effective as face-to-face lessons.", "checklist": ["I used 'the best' and 'the worst'", "I used 'as ... as'", "I used two words from this week"]}], "shadow": ["Private lessons are more expensive than group lessons, but they're faster.", "For busy people, this is the most convenient option.", "Book a trial lesson first, and see if it's worth it."]}, "conf": {"minute_topics": ["Compare your city now with your city ten years ago", "The best café in Antalya, in your opinion", "Compare online lessons and face-to-face lessons", "Your favourite holiday place and why it is better than others", "The most useful thing in your bag"], "lifesavers": ["On the one hand, … on the other hand, …", "It depends on …"], "win": "Today I can compare options quickly and explain my choice."}}, {"n": 29, "focus": "Listening & Grammar", "classwork": ["Write the 10 transformations again from memory and check with the key.", "Voice note: ‘My lessons are worth it because…’ (1 min).", "Find 2 real tutor profiles online and copy 5 useful phrases."], "read": {"title": "Three tutoring websites: which is best for you?", "text": "If you want to teach online, you need a good platform. Here we compare three popular websites for tutors: TalkBridge, LinguaPro and EasyTutor.\n\nTalkBridge is the biggest platform. It has the most students, so it's the easiest place to find your first clients. But it takes 25 percent of your price, and that is the highest fee of the three. For many new teachers, it's too expensive.\n\nLinguaPro is smaller than TalkBridge, but the students are more serious. Most of them are adults who need a language for work. The fee is 15 percent. The disadvantage is that your profile must be very good. A short profile isn't good enough, and you need a video.\n\nEasyTutor is the cheapest option for teachers. It takes only 10 percent. However, there aren't enough students yet, because the website is new. It's not as popular as the other two.\n\nSo which one should you choose? If you need students quickly, TalkBridge is the best choice. If you want better quality students and you have a strong profile, try LinguaPro. If you already have some students and you want to pay less, EasyTutor is good value.\n\nOur tip: you don't have to choose only one. Many tutors start on two platforms and compare the results after three months.", "questions": [{"q": "Which platform has the most students?", "options": ["LinguaPro", "TalkBridge", "EasyTutor"], "answer": 1, "why": "\"TalkBridge is the biggest platform. It has the most students.\""}, {"q": "What percentage does LinguaPro take?", "options": ["10 percent", "25 percent", "15 percent"], "answer": 2, "why": "\"The fee is 15 percent.\""}, {"q": "What do you need on LinguaPro?", "options": ["A very good profile and a video", "A university degree", "Twenty students"], "answer": 0, "why": "\"Your profile must be very good... and you need a video.\""}, {"q": "Why doesn't EasyTutor have enough students?", "options": ["It is too expensive", "It is new", "It is only for children"], "answer": 1, "why": "\"there aren't enough students yet, because the website is new.\""}, {"q": "What is the writer's final tip?", "options": ["Always choose the cheapest platform", "Never pay a fee", "Start on two platforms and compare"], "answer": 2, "why": "\"Many tutors start on two platforms and compare the results after three months.\""}], "find": [{"meaning": "to look at two things and see what is different", "word": "compare"}, {"meaning": "a good price for what you get", "word": "good value"}, {"meaning": "one of the things you can choose", "word": "option"}]}, "listen": {"title": "Can you give me a better price?", "situation": "Laura, a German tutor, is talking to a new client, Peter, about the price of a lesson package.", "speakers": {"A": {"name": "Laura", "accent": "en-IE"}, "B": {"name": "Peter", "accent": "en-AU"}}, "lines": [{"who": "B", "text": "Hi Laura. I enjoyed the trial lesson. How much is one lesson, exactly?"}, {"who": "A", "text": "One private lesson is twenty-five euros. It's sixty minutes long."}, {"who": "B", "text": "Hmm, that's a bit too expensive for me. I want two lessons a week."}, {"who": "A", "text": "I understand. I have a package of ten lessons for two hundred euros. That's cheaper than paying for each lesson."}, {"who": "B", "text": "So it's twenty euros a lesson. That's better. Is it as flexible as single lessons?"}, {"who": "A", "text": "Yes, it's just as flexible. You can cancel a lesson twenty-four hours before, and we choose a new time."}, {"who": "B", "text": "And how long can I use the package?"}, {"who": "A", "text": "Three months. That's long enough for ten lessons, even if you travel."}, {"who": "B", "text": "My friend says your lessons are the best in the city. I think it's worth it."}, {"who": "A", "text": "Thank you! Shall we start next Monday?"}, {"who": "B", "text": "Monday is perfect. I'll pay for the package today."}, {"who": "A", "text": "Great. I'll send you the link and the timetable this evening. And if you have any questions about the package, just send me a message. I usually answer quickly."}], "questions": [{"q": "How much is one single lesson?", "options": ["Twenty euros", "Twenty-five euros", "Two hundred euros"], "answer": 1, "why": "\"One private lesson is twenty-five euros.\""}, {"q": "How many lessons does Peter want each week?", "options": ["One", "Three", "Two"], "answer": 2, "why": "\"I want two lessons a week.\""}, {"q": "How much does one lesson cost in the package?", "options": ["Twenty euros", "Fifteen euros", "Twenty-five euros"], "answer": 0, "why": "\"So it's twenty euros a lesson.\""}, {"q": "When can Peter cancel a lesson?", "options": ["Any time", "Twenty-four hours before", "One week before"], "answer": 1, "why": "\"You can cancel a lesson twenty-four hours before.\""}, {"q": "When will they start?", "options": ["Today", "Next Monday", "In three months"], "answer": 1, "why": "\"Shall we start next Monday?\" - \"Monday is perfect.\""}]}, "accents": {"sentences": [{"text": "This package is cheaper than paying for each lesson.", "accent": "en-US"}, {"text": "The website is new, so there aren't enough students yet.", "accent": "en-GB"}, {"text": "Is it as flexible as single lessons?", "accent": "en-AU"}, {"text": "Twenty-five euros is a bit too expensive for me.", "accent": "en-IE"}, {"text": "TalkBridge is the biggest platform, but it has the highest fee.", "accent": "en-IN"}, {"text": "Three months is long enough for ten lessons.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Finish this sentence and talk for one minute: 'My lessons are worth it because...'", "model": "My lessons are worth it because they're personal. I plan every lesson for one student, so we never waste time. My students speak a lot, and I correct their mistakes. I'm patient and flexible, too. If a student is busy, we choose a new time. My price is not the cheapest, but the quality is high, and my students make fast progress.", "checklist": ["I said 'worth it because...'", "I used one comparative or superlative", "I used three words from this week"]}, {"task": "A client says: 'Your price is too expensive.' Answer politely and offer a package.", "model": "I understand. One lesson is twenty euros, but I also have a package. Ten lessons cost one hundred and eighty euros, so it's cheaper than single lessons. The package is just as flexible. You can change the time if you tell me one day before. And the first trial lesson is free, so you can see if it's worth it.", "checklist": ["I used 'too' or 'enough'", "I used 'as ... as'", "I offered a package or a discount"]}, {"task": "Compare two websites or apps that you use for your work. Which is the best one for you?", "model": "I use Zoom and WhatsApp for my lessons. Zoom is better for long lessons, because I can share my screen. WhatsApp is easier and faster for short messages and voice notes. But the connection on WhatsApp isn't good enough for a full lesson. For me, Zoom is the best option for teaching, and WhatsApp is the most convenient for homework.", "checklist": ["I compared two things", "I used 'the best' or 'the most ...'", "I used 'not ... enough' or 'too ...'"]}], "shadow": ["That's a bit too expensive for me.", "The package is cheaper than paying for each lesson.", "Is it as flexible as single lessons?"]}, "conf": {"minute_topics": ["Why your lessons are worth the price", "The difference between a good teacher and a great teacher", "A time you said no politely", "What you would put in a perfect lesson package", "The best value thing you ever bought"], "lifesavers": ["Let me check and get back to you.", "What I can offer is …"], "win": "Today I can negotiate politely and still make a good deal for me."}}, {"n": 30, "focus": "Writing & Fluency", "classwork": ["Re-record the 60-second pitch until she is happy with it, and send it to the teacher.", "Rewrite the package description after correction (clean copy for the portfolio).", "Voice note: compare two places she has lived."], "read": {"title": "Lucia's lesson packages", "text": "Hello! I'm Lucia, a native Spanish teacher with eight years of experience. I teach adults online, and I offer three packages, so you can choose the best option for your goals and your budget.\n\nStarter: 5 lessons for 100 euros. This is the most affordable package. It's perfect for beginners who want to try Spanish and learn the basics. Each lesson is 45 minutes.\n\nStandard: 10 lessons for 180 euros. This is my most popular package, and it's better value than the Starter, because one lesson costs only 18 euros. We work on speaking, grammar and real conversations. Lessons are 60 minutes.\n\nBusiness: 10 lessons for 250 euros. This package is more expensive, but it's the fastest way to use Spanish at work. We practise meetings, emails and phone calls. I also check your work documents.\n\nWhy choose me? My lessons are flexible: you choose the day and the time, and you can cancel 24 hours before. I'm patient and organised, and I send you notes after every lesson. My students say my lessons are clearer than any course they tried before.\n\nNot sure which package is right for you? Book a free 20-minute trial lesson. We will talk about your level and your goals, and then you can choose. I'm sure the lessons will be worth it!", "questions": [{"q": "Which package is the cheapest?", "options": ["Starter", "Standard", "Business"], "answer": 0, "why": "\"Starter... This is the most affordable package.\""}, {"q": "How long is a Standard lesson?", "options": ["45 minutes", "60 minutes", "20 minutes"], "answer": 1, "why": "\"Lessons are 60 minutes.\""}, {"q": "Why is the Standard package better value than the Starter?", "options": ["It has a free book", "One lesson costs only 18 euros", "The lessons are shorter"], "answer": 1, "why": "\"it's better value than the Starter, because one lesson costs only 18 euros.\""}, {"q": "What extra thing does Lucia do in the Business package?", "options": ["She checks your work documents", "She visits your office", "She gives you a certificate"], "answer": 0, "why": "\"I also check your work documents.\""}, {"q": "How long is the free trial lesson?", "options": ["45 minutes", "60 minutes", "20 minutes"], "answer": 2, "why": "\"Book a free 20-minute trial lesson.\""}], "find": [{"meaning": "costing not too much money", "word": "affordable"}, {"meaning": "easy to change to fit your plans", "word": "flexible"}, {"meaning": "to give or sell something to people", "word": "offer"}]}, "listen": {"title": "Antalya or Istanbul?", "situation": "Two friends, Sara and Ben, are comparing two cities where Sara has lived.", "speakers": {"A": {"name": "Sara", "accent": "en-GB"}, "B": {"name": "Ben", "accent": "en-ZA"}}, "lines": [{"who": "B", "text": "Sara, you lived in Istanbul before Antalya, right? Which city do you prefer?"}, {"who": "A", "text": "That's a difficult question! Istanbul is bigger and more exciting. There's always something to do."}, {"who": "B", "text": "So why did you move?"}, {"who": "A", "text": "Istanbul was too crowded for me. The traffic was terrible, and my flat was very small and expensive."}, {"who": "B", "text": "And Antalya is cheaper?"}, {"who": "A", "text": "Yes, much cheaper. My flat here is bigger, and it's only ten minutes from the beach."}, {"who": "B", "text": "But is it as interesting as Istanbul?"}, {"who": "A", "text": "No, it isn't as interesting. There are fewer museums and theatres. But life is calmer and the weather is better."}, {"who": "B", "text": "What about work? Is it easier to find students in Istanbul?"}, {"who": "A", "text": "In Istanbul, yes, there were more students. But now I teach online, so the city doesn't matter so much."}, {"who": "B", "text": "So Antalya is the best place for you now."}, {"who": "A", "text": "Exactly. For me, it's the most relaxing city in Turkey, and it's good enough for my work."}, {"who": "B", "text": "Do you ever miss Istanbul?"}, {"who": "A", "text": "Sometimes, yes. I miss my old friends and the food markets. But I visit them twice a year, and that's enough for me."}], "questions": [{"q": "Where did Sara live before Antalya?", "options": ["Izmir", "Istanbul", "Ankara"], "answer": 1, "why": "\"you lived in Istanbul before Antalya, right?\""}, {"q": "Why did Sara leave Istanbul?", "options": ["It was too crowded", "She lost her job", "It was too quiet"], "answer": 0, "why": "\"Istanbul was too crowded for me.\""}, {"q": "How far is her flat from the beach now?", "options": ["Thirty minutes", "Ten minutes", "One hour"], "answer": 1, "why": "\"it's only ten minutes from the beach.\""}, {"q": "What does Antalya have less of?", "options": ["Sunny days", "Museums and theatres", "Cheap flats"], "answer": 1, "why": "\"There are fewer museums and theatres.\""}, {"q": "Why doesn't the city matter so much for her work now?", "options": ["She teaches online", "She stopped teaching", "Her students live in Antalya"], "answer": 0, "why": "\"now I teach online, so the city doesn't matter so much.\""}]}, "accents": {"sentences": [{"text": "The Standard package is better value than the Starter.", "accent": "en-GB"}, {"text": "Istanbul is bigger and more exciting than Antalya.", "accent": "en-ZA"}, {"text": "It isn't as interesting, but life is calmer.", "accent": "en-US"}, {"text": "Why choose me? My lessons are flexible and clear.", "accent": "en-AU"}, {"text": "Business lessons are the fastest way to use Spanish at work.", "accent": "en-IN"}, {"text": "My flat was too small and too expensive.", "accent": "en-IE"}]}, "speak": {"prompts": [{"task": "Record your 60-second pitch: 'Why choose me as your Russian teacher?'", "model": "Hello! I'm a Russian teacher from Antalya, and I teach adults online. Why choose me? First, my lessons are flexible. You choose the day and the time. Second, I'm patient and organised, and I plan every lesson for your goals. I offer three packages, from beginner to business Russian. My prices are affordable, and the first trial lesson is free. Book a lesson today and start speaking Russian with confidence!", "checklist": ["I spoke for about 60 seconds", "I gave two reasons to choose me", "I ended with an invitation (Book a lesson...)"]}, {"task": "Describe two lesson packages you could offer. Compare them.", "model": "I offer two packages. The first package is five lessons for one hundred and twenty euros. It's good for beginners who want to try Russian. The second package is ten lessons for two hundred euros. It's better value, because each lesson is cheaper, and it's the best option if you want to make fast progress.", "checklist": ["I gave prices", "I used 'better value' or 'cheaper'", "I used a superlative"]}, {"task": "Compare two places you have lived. Which do you prefer, and why?", "model": "Before Antalya, I lived in a smaller town. It was quieter and cheaper than Antalya, but there weren't enough jobs. Antalya is bigger and more expensive, but there are more opportunities, and the sea is beautiful. For me, Antalya is the best place to live now, because I have more students and a better life.", "checklist": ["I compared two places", "I used 'not as ... as' or 'enough'", "I said which I prefer and why"]}], "shadow": ["I offer three packages, so you can choose the best option.", "This package is more expensive, but it's the fastest way.", "Book a free trial lesson, and then you can choose."]}, "conf": {"minute_topics": ["Why choose me? Your 60-second sales message", "The best thing about your job", "Your perfect student", "A lesson you are really proud of", "How your lessons are different from a textbook"], "lifesavers": ["The main reason is …", "What makes my lessons different is …"], "win": "Today I can explain why my lessons are the best choice for a student."}}], "mission": {"title": "Put your lesson packages online in English", "why": "A clear English description of your packages helps international students choose you, and it shows you can write like a professional.", "steps": ["Write two packages: for example, 'Trial lesson' and '10 private lessons'.", "For each one, write the price, the length and one benefit.", "Read it out loud as a 60-second 'Why choose me?' message.", "Send the text and the recording to your teacher for a quick check."], "say_this": ["My private lessons are more flexible than group lessons.", "The ten-lesson package is the best value.", "A trial lesson is a good option if you are not sure.", "It's affordable, and it's really worth it."], "bonus": "Add the packages to a real tutor profile or your social media page."}, "video": {"youtube_id": "I4G9TjlbdtM", "title": "Films at home or at the cinema - which is better? - Real Easy English", "channel": "BBC Learning English", "seconds": 401, "start": 0, "end": 300, "checked": "oEmbed OK + English subtitles read on 2026-11-18", "lessons": {"28": {"before": "Do you prefer watching films at home or at the cinema? Why?", "questions": [{"q": "What are Phil and Georgie talking about?", "options": ["How to make films", "Watching films at home or at the cinema", "Jobs in a cinema"], "answer": 1, "why": "\"in this episode of Real Easy English, we're talking about cinema.\""}, {"q": "Where did one of them watch a film last night?", "options": ["At the cinema", "At home on the sofa with housemates", "At a friend's house"], "answer": 1, "why": "\"I watched it at home on my sofa with my housemates.\""}, {"q": "How often does Phil go to the cinema?", "options": ["Every week", "Not very often", "Every day"], "answer": 1, "why": "\"No. No, I don't go very often at all.\""}], "after": "Voice note (1 minute): compare films at home and at the cinema. Use 'more comfortable than', 'cheaper than', 'the best'."}, "29": {"before": "Make 2 columns: Cinema + / Home +. Take notes.", "questions": [{"q": "When did Phil last go to the cinema?", "options": ["Last week, alone", "Maybe two years ago, with his kids", "Last night"], "answer": 1, "why": "\"I've not actually been to the cinema for maybe two years... the last time I went, I went with my kids.\""}, {"q": "Why does Phil prefer home when he wants to spend time with people?", "options": ["Tickets are expensive", "In the cinema you can't talk", "The screen is small"], "answer": 1, "why": "\"in a cinema you can't talk to anyone. You sit in the dark.\""}, {"q": "Which downside of the cinema do they mention?", "options": ["The seats are not very comfortable", "The popcorn is cold", "The films are too short"], "answer": 0, "why": "\"the seats are not very comfortable.\""}, {"q": "What are 'trailers'?", "options": ["Cinema tickets", "Short adverts for films coming soon", "Snacks"], "answer": 1, "why": "\"film trailers, which are short adverts for films that are coming up soon\""}], "after": "Write 6 sentences comparing online lessons and face-to-face lessons (cheaper, more convenient, the best, too..., not ... enough)."}, "30": {"before": "Watch again and listen for comparatives: more..., better, less...", "questions": [{"q": "'Spectacular' means...", "options": ["very exciting to look at", "very boring", "very quiet"], "answer": 0, "why": "\"'spectacular', which is a very strong adjective to describe something that is very exciting to look at.\""}, {"q": "'Distractions' are...", "options": ["film tickets", "things that make you look away from what you want to watch", "snacks"], "answer": 1, "why": "\"things that make you look at something you might not have wanted to look at\""}, {"q": "Complete: \"It's much ___ to watch a film at home.\"", "options": ["more comfortable", "comfortabler", "most comfortable"], "answer": 0, "why": "\"It's much more comfortable to watch a film at home\""}], "after": "Retell: give 3 reasons for the cinema and 3 for home. Which is better for you? Record it."}}}, "words": [{"w": "flexible", "e": "🤸", "x": "Online lessons are flexible: you choose the time.", "ru": "esnek"}, {"w": "convenient", "e": "🛋️", "x": "Lessons at home are very convenient for busy parents.", "ru": "uygun, pratik"}, {"w": "quality", "e": "⭐", "x": "I care about the quality of every lesson.", "ru": "kalite"}, {"w": "value", "e": "💎", "x": "My 10-lesson package is good value for money.", "ru": "değer"}, {"w": "affordable", "e": "👛", "x": "Group lessons are more affordable than private lessons.", "ru": "uygun fiyatlı"}, {"w": "option", "e": "🔀", "x": "There are three options: trial, 5 lessons or 10 lessons.", "ru": "seçenek"}, {"w": "advantage", "e": "👍", "x": "One advantage of online lessons is that you don’t travel.", "ru": "avantaj"}, {"w": "disadvantage", "e": "👎", "x": "A disadvantage of group lessons is that you speak less.", "ru": "dezavantaj"}, {"w": "compare", "e": "⚖️", "x": "Students often compare prices before they book.", "ru": "karşılaştırmak"}, {"w": "choose", "e": "👉", "x": "You can choose the topics for your lessons.", "ru": "seçmek"}, {"w": "trial lesson", "e": "🎟️", "x": "The trial lesson is 30 minutes and costs half price.", "ru": "deneme dersi"}, {"w": "group lesson", "e": "👥", "x": "My group lessons have four students.", "ru": "grup dersi"}, {"w": "private lesson", "e": "👤", "x": "In a private lesson I focus only on you.", "ru": "özel ders"}, {"w": "offer", "e": "🏷️", "x": "This month I have a special offer: 10% off.", "ru": "teklif; teklif etmek"}, {"w": "benefit", "e": "🎁", "x": "The main benefit of my course is speaking practice.", "ru": "fayda"}, {"w": "worth it", "e": "✅", "x": "It’s more expensive, but it’s worth it.", "ru": "değer, buna değer"}]}, {"week": 11, "topic": "Talking to Clients (Lessons & Translation)", "lessons": [{"n": 31, "focus": "Speaking & Vocabulary", "classwork": ["Listen to the recording of call 2 and write down 3 sentences she wants to improve.", "Learn the 16 words; write the ‘story of a translation job’ in 8 sentences.", "Voice note: leave a ‘voicemail’ for a client confirming a lesson time."], "read": {"title": "The story of a translation job", "text": "Nadia is a freelance translator in Izmir. She translates from German into English. Last month she received an enquiry from a small travel company. The manager, Mr Klein, wrote: \"Could you translate our new brochure into English? We'd like it by Friday.\"\n\nFirst, Nadia asked him to attach the document, because she always reads a text before she gives a price. The brochure had 3,000 words. Her rate is 8 cents per word, so she sent a quote of 240 euros. She wrote: \"Would you like me to proofread the final version, too? It's free for this job.\"\n\nMr Klein confirmed the price on the same day. Then he asked, \"Could you tell me when you can start?\" Nadia answered, \"I can start tomorrow, and I'll send it to you on Thursday, one day before the deadline.\"\n\nOn Wednesday there was a small problem. The company wanted to change two pages. Nadia didn't panic. She said, \"Of course. Shall I send you the first part now, so you can check it?\"\n\nShe finished on time and sent the invoice with the translation. Mr Klein made the payment the next week. He also sent her very good feedback: \"Clear, fast and professional. We'd like to work with you again.\"\n\nFor Nadia, polite and clear messages are as important as good translation. Happy clients come back.", "questions": [{"q": "What did the travel company want?", "options": ["A German teacher", "A translation of their brochure", "A new website"], "answer": 1, "why": "\"Could you translate our new brochure into English?\""}, {"q": "Why did Nadia ask for the document first?", "options": ["She always reads a text before she gives a price", "She wanted to cancel the job", "She needed the payment first"], "answer": 0, "why": "\"she always reads a text before she gives a price.\""}, {"q": "How much was the quote?", "options": ["300 euros", "80 euros", "240 euros"], "answer": 2, "why": "\"3,000 words... 8 cents per word... a quote of 240 euros.\""}, {"q": "What did Nadia offer to do for free?", "options": ["Translate two more pages", "Proofread the final version", "Visit the office"], "answer": 1, "why": "\"Would you like me to proofread the final version, too? It's free for this job.\""}, {"q": "When did Nadia plan to send the translation?", "options": ["On Thursday", "On Friday", "On Wednesday"], "answer": 0, "why": "\"I'll send it to you on Thursday, one day before the deadline.\""}], "find": [{"meaning": "a question from a possible client", "word": "enquiry"}, {"meaning": "the last day or time to finish something", "word": "deadline"}, {"meaning": "a paper that asks a client to pay", "word": "invoice"}]}, "listen": {"title": "Booking a trial lesson", "situation": "Olga, a Russian tutor, is on a video call with a new client, James, who wants to learn Russian for work.", "speakers": {"A": {"name": "Olga", "accent": "en-GB"}, "B": {"name": "James", "accent": "en-US"}}, "lines": [{"who": "A", "text": "Hello James, thank you for your enquiry. Can you hear me well?"}, {"who": "B", "text": "Yes, perfectly. I'd like to start Russian lessons. My company works with a partner in Kazakhstan."}, {"who": "A", "text": "That's great. Could you tell me what your level is?"}, {"who": "B", "text": "I'm a complete beginner. I only know 'hello' and 'thank you'."}, {"who": "A", "text": "No problem. Would you like to book a trial lesson first? It's thirty minutes and it's free."}, {"who": "B", "text": "Yes, please. Could you tell me what days you're available?"}, {"who": "A", "text": "I'm free on Monday and Wednesday evenings, and on Saturday mornings."}, {"who": "B", "text": "Wednesday evening is best for me. Is seven o'clock OK?"}, {"who": "A", "text": "Seven is fine. Shall I send you the link by email?"}, {"who": "B", "text": "Yes, please. And could you send me your rate for regular lessons, too?"}, {"who": "A", "text": "Of course. I'll attach my price list to the email. I'd like to confirm one more thing: do you want lessons once or twice a week?"}, {"who": "B", "text": "Twice a week, if possible. I need to speak some Russian before my trip in June."}, {"who": "A", "text": "Then twice a week is a good plan. See you on Wednesday at seven!"}], "questions": [{"q": "Why does James want to learn Russian?", "options": ["His wife is Russian", "His company works with a partner in Kazakhstan", "He wants to live in Moscow"], "answer": 1, "why": "\"My company works with a partner in Kazakhstan.\""}, {"q": "What is James's level?", "options": ["Intermediate", "Advanced", "Complete beginner"], "answer": 2, "why": "\"I'm a complete beginner.\""}, {"q": "How long is the trial lesson?", "options": ["Thirty minutes", "Sixty minutes", "Fifteen minutes"], "answer": 0, "why": "\"It's thirty minutes and it's free.\""}, {"q": "When is the trial lesson?", "options": ["Monday at seven", "Saturday morning", "Wednesday at seven"], "answer": 2, "why": "\"Wednesday evening is best for me. Is seven o'clock OK?\""}, {"q": "What will Olga attach to the email?", "options": ["Her price list", "A Russian textbook", "An invoice"], "answer": 0, "why": "\"I'll attach my price list to the email.\""}]}, "accents": {"sentences": [{"text": "Could you send me the document, please?", "accent": "en-GB"}, {"text": "Would you like to book a trial lesson?", "accent": "en-US"}, {"text": "Shall I send you the link by email?", "accent": "en-AU"}, {"text": "I'd like to confirm the time of our lesson.", "accent": "en-IN"}, {"text": "Could you tell me when the deadline is?", "accent": "en-IE"}, {"text": "I'll attach the invoice to the email.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Leave a voicemail for a client. Confirm the time of your next lesson and offer to send the link.", "model": "Hello Anna, this is your Russian teacher. I'm calling to confirm our lesson on Thursday at six o'clock. Could you tell me if this time is still OK for you? Shall I send you the Zoom link by email, or would you like it on WhatsApp? Please send me a message when you can. Thank you, and see you on Thursday!", "checklist": ["I confirmed the day and the time", "I used 'Could you...?' or 'Would you like...?'", "I made an offer with 'Shall I...?'"]}, {"task": "Tell the story of a translation job in 6-8 sentences: the enquiry, the quote, the deadline, the payment.", "model": "Last month a client sent me an enquiry. He wanted to translate a contract from Russian into Turkish. First, I asked him to attach the document. It had 2,000 words, so I sent a quote. He confirmed the price, and the deadline was Monday. I finished on Sunday and proofread the text. Then I sent the invoice, and he made the payment two days later. His feedback was very good.", "checklist": ["I used past simple", "I used five words from this week", "My story has a beginning, middle and end"]}, {"task": "A client asks for a lesson at a bad time. Say no politely and offer two other times.", "model": "Thank you for your message. I'm sorry, but I'm not available on Tuesday at five, because I have another student. Would you like a lesson on Tuesday at seven instead? Or I'm free on Wednesday morning. Could you tell me which time is better for you? Then I'll confirm and send you the link.", "checklist": ["I said sorry and gave a reason", "I offered two other times", "I used a polite request"]}], "shadow": ["Thank you for your enquiry. Could you tell me what your level is?", "Would you like to book a trial lesson first?", "Shall I send you the link by email?"]}, "conf": {"minute_topics": ["Your perfect client", "How you start a first lesson with a new student", "A polite way to say no to a client", "What clients usually ask you", "The best thing about working for yourself"], "lifesavers": ["Thank you for getting in touch.", "Just to confirm, …"], "win": "Today I can make polite requests and offers to a client on a call."}}, {"n": 32, "focus": "Listening & Grammar", "classwork": ["Write the 8 indirect questions again from memory.", "Find a short Russian text (menu, sign, advert) and translate it into English in writing.", "Shadow the translation-call text twice."], "read": {"title": "Ask the right questions before you start", "text": "Many new translators make the same mistake: they say yes to a job too quickly. Then they discover problems later. A professional translator asks questions first. Here are five questions you should always ask a client, and how to ask them politely.\n\n1. The deadline. Don't say \"When do you need it?\" in a short, direct way. Say: \"Could you tell me when you need the translation?\" This sounds kinder and more professional.\n\n2. The type of document. Ask: \"Do you know who will read the text?\" A legal document for a court is very different from a menu for a restaurant.\n\n3. The format. Ask: \"Could you tell me which format you need: Word or PDF?\" This saves time at the end.\n\n4. The price. Clients often ask, \"How much does it cost?\" But you should ask them a question, too: \"Could you send me the document, so I can give you an exact quote?\" Your rate per word is only one part of the price. Urgent jobs usually cost more.\n\n5. Proofreading. Ask: \"Would you like me to proofread the final version?\" Many clients don't know this service exists.\n\nNotice the word order in these questions. After \"Could you tell me...\" or \"Do you know...\", we don't use a question form: we say \"when you need it\", not \"when do you need it\". This small change makes your English sound much more natural with clients.", "questions": [{"q": "What mistake do many new translators make?", "options": ["They ask too many questions", "They say yes to a job too quickly", "Their prices are too low"], "answer": 1, "why": "\"they say yes to a job too quickly.\""}, {"q": "Why should you ask who will read the text?", "options": ["Because a legal document is very different from a menu", "Because readers pay the translator", "Because you need their email"], "answer": 0, "why": "\"A legal document for a court is very different from a menu for a restaurant.\""}, {"q": "What should you ask for before you give an exact quote?", "options": ["The client's address", "The payment", "The document"], "answer": 2, "why": "\"Could you send me the document, so I can give you an exact quote?\""}, {"q": "What does the text say about urgent jobs?", "options": ["They usually cost more", "They are always free", "Translators never accept them"], "answer": 0, "why": "\"Urgent jobs usually cost more.\""}, {"q": "Which question is correct, according to the text?", "options": ["Could you tell me when do you need it?", "Could you tell me when you need it?", "Could you tell me when need you it?"], "answer": 1, "why": "\"we say 'when you need it', not 'when do you need it'.\""}], "find": [{"meaning": "very important and needed quickly", "word": "urgent"}, {"meaning": "to read a text carefully and correct small mistakes", "word": "proofread"}, {"meaning": "the money you ask for each word, hour or lesson", "word": "rate"}]}, "listen": {"title": "An urgent document", "situation": "Ivan, a translator, receives a phone call from Claire, who works for a hotel and needs a document translated quickly.", "speakers": {"A": {"name": "Ivan", "accent": "en-IE"}, "B": {"name": "Claire", "accent": "en-AU"}}, "lines": [{"who": "B", "text": "Hello, is that Ivan? I found your number on a translators' website. I have an urgent job."}, {"who": "A", "text": "Yes, speaking. How can I help?"}, {"who": "B", "text": "We have a group of Russian guests at our hotel next week. We need our welcome letter and hotel rules in Russian."}, {"who": "A", "text": "No problem. Could you tell me how long the documents are?"}, {"who": "B", "text": "About eight hundred words in total. Do you know how much it will cost?"}, {"who": "A", "text": "My rate is ten cents per word, but for urgent jobs I add twenty percent. Could you tell me when you need it?"}, {"who": "B", "text": "By Thursday morning, if possible. The guests arrive on Thursday afternoon."}, {"who": "A", "text": "That's fine. So the quote is ninety-six euros. Would you like me to proofread it twice? It's included in the price."}, {"who": "B", "text": "Yes, please. I'd like to confirm the job now. Shall I email you the documents?"}, {"who": "A", "text": "Yes, please attach them in Word format. And do you know who I should send the invoice to?"}, {"who": "B", "text": "Send it to our accounts manager. I'll give you her email address in my message."}, {"who": "A", "text": "Perfect. As soon as I receive the files, I'll start. You'll have everything on Wednesday evening."}], "questions": [{"q": "Why does the hotel need a translation?", "options": ["A group of Russian guests is coming", "They are opening a hotel in Russia", "Their manager is Russian"], "answer": 0, "why": "\"We have a group of Russian guests at our hotel next week.\""}, {"q": "How many words are in the documents?", "options": ["About eight thousand", "About eight hundred", "About eighty"], "answer": 1, "why": "\"About eight hundred words in total.\""}, {"q": "Why is the price higher than usual?", "options": ["The text is very difficult", "It's an urgent job", "He needs to visit the hotel"], "answer": 1, "why": "\"for urgent jobs I add twenty percent.\""}, {"q": "What format does Ivan want?", "options": ["PDF", "Photos", "Word"], "answer": 2, "why": "\"please attach them rd", "I used the present simple", "I said it slowly and clearly"]}], "shadow": ["Could you tell me when you need the translation?", "Do you know how many words it has?", "As soon as I receive the files, I'll start."]}, "conf": {"minute_topics": ["The most interesting document you ever translated", "A question you love answering", "How you check a translation", "What a client should know before booking", "A word that is hard to translate"], "lifesavers": ["Could you tell me a bit more about …?", "Do you mean that …?"], "win": "Today I can ask and answer client questions politely, even fast ones."}}, {"n": 33, "focus": "Writing & Fluency", "classwork": ["Rewrite the email after correction and keep it as a template.", "Write 2 more client emails: one about lessons, one about translation.", "Prepare the 15-minute Russian taster lesson (in English) for Week 12."], "read": {"title": "An enquiry and a reply", "text": "Dear Ms Petrova,\n\nI found your profile on LinguaPro. My daughter is 16 and she would like to learn Russian, because she wants to study in Saint Petersburg in two years. Could you tell me if you teach teenagers? I would also like to know your rate and what days you are available. We live in Germany, so the lessons must be online.\n\nBest regards,\nThomas Weber\n\nDear Mr Weber,\n\nThank you for your enquiry. Yes, I teach teenagers, and I have helped several students prepare to study abroad.\n\nMy rate is 22 euros for a 60-minute online lesson. I also offer a package of 10 lessons for 200 euros, which is better value. Payment is by bank transfer at the start of each month, and I send an invoice every time.\n\nI am available on Monday, Wednesday and Friday afternoons, from 3 pm to 7 pm, German time. If your daughter has any questions, she can contact me directly.\n\nWould you like to book a free 30-minute trial lesson first? This will help me understand her level and her goals. Could you tell me which day suits her best? I will then confirm the time and send you the link.\n\nIf you need to cancel a lesson, please tell me 24 hours before. Lessons cancelled later than that cannot be refunded.\n\nI look forward to hearing from you.\n\nKind regards,\nElena Petrova", "questions": [{"q": "Why does Thomas's daughter want to learn Russian?", "options": ["She wants to study in Saint Petersburg", "Her grandmother is Russian", "She has a Russian exam next month"], "answer": 0, "why": "\"she wants to study in Saint Petersburg in two years.\""}, {"q": "How much is the 10-lesson package?", "options": ["220 euros", "200 euros", "22 euros"], "answer": 1, "why": "\"a package of 10 lessons for 200 euros.\""}, {"q": "How does the client pay?", "options": ["In cash after each lesson", "By card on the website", "By bank transfer at the start of each month"], "answer": 2, "why": "\"Payment is by bank transfer at the start of each month.\""}, {"q": "What does Elena offer before regular lessons?", "options": ["A free trial lesson", "A discount for two students", "A Russian book"], "answer": 0, "why": "\"Would you like to book a free 30-minute trial lesson first?\""}, {"q": "What happens if a lesson is cancelled less than 24 hours before?", "options": ["The lesson is free", "The money is not refunded", "Elena teaches two lessons next time"], "answer": 1, "why": "\"Lessons cancelled later than that cannot be refunded.\""}], "find": [{"meaning": "to say that something is definitely true or arranged", "word": "confirm"}, {"meaning": "money that you get back", "word": "refunded"}, {"meaning": "the act of paying money", "word": "Payment"}]}, "listen": {"title": "A client wants to cancel", "situation": "Maria, a translator, gets an unexpected call from a client, Robert, who wants to cancel part of a job.", "speakers": {"A": {"name": "Maria", "accent": "en-ZA"}, "B": {"name": "Robert", "accent": "en-GB"}}, "lines": [{"who": "A", "text": "Hello, Maria speaking."}, {"who": "B", "text": "Hi Maria, it's Robert from Green Hotels. I'm sorry to call so late. fect client sends a clear enquiry and attaches the document immediately. They tell me the deadline, and it's not too urgent! They confirm the quote quickly, and they make the payment on time. After the job, they give me feedback and they come back with more work. Many of my clients are like this, and I'm very happy about it.", "checklist": ["I used five words from this week", "I used present simple correctly (they send / they tell)", "I spoke for about one minute"]}], "shadow": ["Thank you for your enquiry.", "Could you tell me which day suits you best?", "I'll send you a new invoice with the correct total."]}, "conf": {"minute_topics": ["How you write a quote for a client", "A deadline you finished just in time", "Good feedback you received from a student or client", "What you do when a client cancels", "Your favourite tool for work"], "lifesavers": ["I'm afraid that …", "I'll send it to you by …"], "win": "Today I can reply to a client clearly and handle a surprise question calmly."}}], "mission": {"title": "Answer a client in English", "why": "Clients write to tutors and translators in English every day; one real reply makes the next one easy.", "steps": ["Find a real enquiry, or use the practice one from your lesson.", "Write a short, polite reply: thank them, give a quote and a deadline.", "Read it out loud once, then send it (or send it to your teacher first).", "Note one phrase you want to use again."], "say_this": ["Thank you for your enquiry.", "My rate is … per word / per lesson.", "Could you send me the document, please?", "I can deliver it by Friday. Would that be OK?", "Please let me know if you have any questions."], "bonus": "Do a five-minute video call with a real or practice client in English."}, "video": {"youtube_id": "TL61VKkme14", "title": "Talking about meetings - Real Easy English", "channel": "BBC Learning English", "seconds": 351, "start": 24, "end": 320, "checked": "oEmbed OK + English subtitles read on 2026-11-18", "lessons": {"31": {"before": "Do you have meetings or calls with clients or students? Online or in person?", "questions": [{"q": "What is the topic?", "options": ["Restaurants", "Work meetings", "Holidays"], "answer": 1, "why": "\"today we are talking about meetings - in particular work meetings\""}, {"q": "Who has a lot of meetings today?", "options": ["Beth", "Georgie", "Neither"], "answer": 0, "why": "Beth: \"I am very busy. I have a lot of meetings.\""}, {"q": "When are meetings really useful, they say?", "options": ["When you need to brainstorm new ideas", "When you are tired", "At lunchtime"], "answer": 0, "why": "\"I think when you need to brainstorm.\""}], "after": "Voice note: a polite first call with a new student. Ask 3 polite questions (Could you...? Would you like...? Shall I...?)."}, "32": {"before": "Listen for pros and cons of meeting in person and on a call.", "questions": [{"q": "Most of their work is...", "options": ["teaching", "producing things, editing and writing", "selling"], "answer": 1, "why": "\"Most of our work is producing things and editing and writing.\""}, {"q": "When is it more stressful to speak up?", "options": ["In a meeting with lots of people", "In a team meeting", "On Fridays"], "answer": 0, "why": "\"if the meeting has lots of people, I find it a bit more stressful to speak up\""}, {"q": "Why do some people prefer meetings in person?", "options": ["They are shorter", "You can see facial expressions and body language", "They are cheaper"], "answer": 1, "why": "\"you can kind of see the facial expressions and body language more easily\""}, {"q": "Why was a call better for some recent meetings?", "options": ["The office was closed", "People were in different time zones and countries", "Calls are more fun"], "answer": 1, "why": "\"with people in different time zones in different countries. So, definitely then a call is better\""}], "after": "Write a polite email to a client to arrange a trial lesson by video call (Would you like..., Could you..., I'd like to...)."}, "33": {"before": "Watch again and listen for 'brainstorm', 'speak up' and 'remote'.", "questions": [{"q": "A 'brainstorm' is when...", "options": ["a group gets together to come up with ideas", "the weather is bad", "you write a long email"], "answer": 0, "why": "\"'brainstorm', which is when you get together with a group of people to come up with ideas.\""}, {"q": "'Speak up' in a meeting means...", "options": ["speak very quietly", "express your opinion using your voice", "stop talking"], "answer": 1, "why": "\"If you 'speak up' in a meeting, you express your opinion using your voice.\""}, {"q": "A 'remote' meeting is...", "options": ["a phone or video call", "a meeting in the same room", "a meeting outside"], "answer": 0, "why": "\"a phone call or a video call. And we can also describe this as a 'remote' meeting.\""}], "after": "Retell: pros and cons of in-person meetings and calls. Which do you prefer for your lessons? Record it."}}}, "words": [{"w": "enquiry", "e": "❓", "x": "I got an enquiry from a new client today.", "ru": "bilgi talebi"}, {"w": "confirm", "e": "✔️", "x": "Could you confirm the time of the lesson?", "ru": "onaylamak"}, {"w": "cancel", "e": "❌", "x": "Please cancel at least 24 hours before the lesson.", "ru": "iptal etmek"}, {"w": "refund", "e": "💸", "x": "If I cancel, I give you a full refund.", "ru": "para iadesi"}, {"w": "invoice", "e": "🧾", "x": "I’ll send you the invoice today.", "ru": "fatura"}, {"w": "payment", "e": "💳", "x": "Payment is by bank transfer or card.", "ru": "ödeme"}, {"w": "deadline", "e": "⏰", "x": "The deadline for the translation is Thursday.", "ru": "son teslim tarihi"}, {"w": "translate", "e": "🔁", "x": "I translate documents from Russian into English.", "ru": "çevirmek"}, {"w": "document", "e": "📄", "x": "Could you send me the document as a PDF?", "ru": "belge"}, {"w": "proofread", "e": "🔍", "x": "I always proofread a translation twice.", "ru": "redaksiyon yapmak"}, {"w": "quote", "e": "💬", "x": "I’ll give you a quote when I see the text.", "ru": "fiyat teklifi"}, {"w": "rate", "e": "💶", "x": "My rate is eight cents per word.", "ru": "ücret"}, {"w": "per word", "e": "🔤", "x": "Translators often charge per word.", "ru": "kelime başına"}, {"w": "urgent", "e": "🚨", "x": "Urgent translations cost 30% more.", "ru": "acil"}, {"w": "feedback", "e": "🗣️", "x": "I give feedback after every lesson.", "ru": "geri bildirim"}, {"w": "attach", "e": "📎", "x": "Please attach the file to your email.", "ru": "eklemek (dosya)"}]}, {"week": 12, "topic": "My Future in English", "lessons": [{"n": 34, "focus": "Speaking & Vocabulary", "classwork": ["Write her own reflection: 5 sentences about her mini-teach (What went well? What will I change?).", "Learn the 16 words; write 5 ‘If …’ sentences about her future career.", "Prepare notes (keywords only) for a 1-minute introduction for her tutor video."], "read": {"title": "Irina's next step", "text": "Irina is 38 and she lives in Bodrum. For ten years she worked as a hotel receptionist, but two years ago she decided to change her career. She speaks Russian, Turkish and English, so she became a freelance interpreter.\n\nAt first it was a big challenge. She had very few clients, and she wasn't sure about her English. \"I was afraid of phone calls,\" she remembers. \"I always wrote emails, because I didn't have the confidence to speak.\"\n\nNow things are different. She has a small network of hotels and travel agencies that call her when they have Russian guests. Last month she interpreted at an international conference for the first time, and she was very proud of herself. She celebrated with her family at a fish restaurant by the sea.\n\nWhat is her next step? \"If I get my interpreting certificate this year, I'll ask for higher rates,\" she says. \"And as soon as I have enough regular clients, I'll stop working on weekends.\" She also wants to make a website. \"If clients can find me online, I'll get more opportunities.\"\n\nDoes she have any advice for other freelancers? \"Don't wait until your English is perfect. You won't succeed unless you take the first step. Start small, be professional, and say yes to opportunities. You'll achieve more than you think.\"", "questions": [{"q": "What was Irina's job before?", "options": ["A teacher", "A hotel receptionist", "A travel agent"], "answer": 1, "why": "\"For ten years she worked as a hotel receptionist.\""}, {"q": "Why did Irina always write emails at first?", "options": ["She didn't have the confidence to speak", "Her phone didn't work", "Her clients preferred emails"], "answer": 0, "why": "\"I didn't have the confidence to speak.\""}, {"q": "What happened last month?", "options": ["She got her certificate", "She opened a website", "She interpreted at an international conference"], "answer": 2, "why": "\"Last month she interpreted at an international conference for the first time.\""}, {"q": "What will she do as soon as she has enough regular clients?", "options": ["Stop working on weekends", "Move to Istanbul", "Ask for lower rates"], "answer": 0, "why": "\"as soon as I have enough regular clients, I'll stop working on weekends.\""}, {"q": "What is her main advice?", "options": ["Wait until your English is perfect", "Only work with big companies", "Take the first step and say yes to opportunities"], "answer": 2, "why": "\"You won't succeed unless you take the first step... say yes to opportunities.\""}], "find": [{"meaning": "a person who translates speech, not writing", "word": "interpreter"}, {"meaning": "people you know who can help your work", "word": "network"}, {"meaning": "a chance to do something good", "word": "opportunities"}]}, "listen": {"title": "Plans for next year", "situation": "Two friends who are both language teachers, Kate and Sam, are talking about their plans for next year.", "speakers": {"A": {"name": "Kate", "accent": "en-AU"}, "B": {"name": "Sam", "accent": "en-IN"}}, "lines": [{"who": "A", "text": "So, Sam, what's your big plan for next year?"}, {"who": "B", "text": "I want to start my own online school. If I find two more teachers, I'll open it in September."}, {"who": "A", "text": "Wow, that's a big step! Are you nervous?"}, {"who": "B", "text": "A little. But I won't do it unless I have enough students. I need at least thirty."}, {"who": "A", "text": "How many do you have now?"}, {"who": "B", "text": "Twenty-two. As soon as I have thirty, I'll start looking for teachers. What about you?"}, {"who": "A", "text": "I'd like to work as an interpreter, not only as a teacher. If I pass my exam in March, I'll start with small jobs, like business meetings."}, {"who": "B", "text": "You'll pass, I'm sure. Your English is fluent now."}, {"who": "A", "text": "Thanks! But it's a challenge. Interpreting is much faster than teaching."}, {"who": "B", "text": "If you need practice, I'll help you. We can do a role play every Friday."}, {"who": "A", "text": "That's a great idea. And if I succeed, I'll take you out for dinner to celebrate!"}, {"who": "B", "text": "Deal! I'll choose the most expensive restaurant in town. And if my school opens in September, you'll be my first guest teacher."}], "questions": [{"q": "What does Sam want to start?", "options": ["An online school", "A translation agency", "A restaurant"], "answer": 0, "why": "\"I want to start my own online school.\""}, {"q": "How many students does Sam need before he opens the school?", "options": ["Twenty-two", "Thirty", "Two"], "answer": 1, "why": "\"I need at least thirty.\""}, {"q": "When is Kate's exam?", "options": ["In September", "On Friday", "In March"], "answer": 2, "why": "\"If I pass my exam in March...\""}, {"q": "How will Sam help Kate?", "options": ["He'll pay for her exam", "They'll do a role play every Friday", "He'll find her clients"], "answer": 1, "why": "\"We can do a role play every Friday.\""}, {"q": "What will Kate do if she succeeds?", "options": ["Take Sam out for dinner", "Stop teaching", "Open a school with Sam"], "answer": 0, "why": "\"if I succeed, I'll take you out for dinner to celebrate!\""}]}, "accents": {"sentences": [{"text": "If I get more students, I'll open my own school.", "accent": "en-GB"}, {"text": "I won't stop unless I'm too tired.", "accent": "en-US"}, {"text": "I'll call you as soon as I receive the document.", "accent": "en-AU"}, {"text": "If you need practice, I'll help you.", "accent": "en-IN"}, {"text": "She was very proud of herself after the conference.", "accent": "en-IE"}, {"text": "You won't succeed unless you take the first step.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Talk about your future career. Make five 'If...' sentences.", "model": "If I get more students, I'll make a website for my lessons. If my English is good enough, I'll teach Russian to international students. If I find translation clients, I'll work as a freelancer, too. If I have more money, I'll travel to Russia and Europe. And if all this happens, I'll be very proud of myself!", "checklist": ["I made five 'If...' sentences", "I used present after 'if' and 'will' in the result", "I talked about my real goals"]}, {"task": "Reflect on your mini-lesson in English: what went well, and what will you change next time?", "model": "I think my mini-lesson went well. I explained the Russian alphabet clearly, and my student understood the first ten letters. I was nervous at the start, but then I felt more confident. Next time, I'll speak more slowly, and I'll prepare more examples. If I practise more, I'll be more relaxed.", "checklist": ["I used the past simple for what happened", "I used 'will' for next time", "I said one good thing and one thing to change"]}, {"task": "Use 'as soon as' and 'unless' to talk about your plans for this month.", "model": "As soon as I finish this course, I'll update my tutor profile. I'll record my video this weekend, unless the weather is bad, because I want to record it outside by the sea. And as soon as the video is ready, I'll send it to my teacher.", "checklist": ["I used 'as soon as' + present", "I used 'unless'", "My plans are clear"]}], "shadow": ["If I get more students, I'll open my own school.", "As soon as I receive the document, I'll call you.", "You won't succeed unless you take the first step."]}, "conf": {"minute_topics": ["Your dream job in five years", "What you will do if you get ten new students", "Your next step as a freelance teacher", "A challenge you want to try next year", "How English will help your career"], "lifesavers": ["I'm not sure yet, but …", "If everything goes well, …"], "win": "Today I can talk about my real future plans and possibilities."}}, {"n": 35, "focus": "Listening & Grammar", "classwork": ["Rewrite the final profile after correction; this is the portfolio copy.", "Practise the 60-second video introduction 3 times in front of a mirror.", "Think about her next 3-month goal: an exam, launching on a platform, or translation clients."], "read": {"title": "From nervous beginner to confident speaker", "text": "When Marco started English lessons last year, he was 45 and he owned a small Italian restaurant in Antalya. Many of his customers were tourists, but he couldn't talk to them. \"I only knew 'hello' and 'thank you',\" he says. \"I felt terrible when customers asked me questions.\"\n\nHe decided to take private lessons twice a week. At first it was difficult. He was busy every evening, and he often forgot his homework. But his teacher gave him short tasks: five new words a day and a one-minute voice note.\n\nNow, a year later, Marco speaks English every day at work. He has learned more than 800 words, and he has already passed his first exam. He isn't fluent yet, but he can explain the menu, take bookings on the phone and chat with customers about their holiday. \"Yesterday a British family stayed for two hours and we talked about football!\" he laughs.\n\nHis biggest change is not his grammar. It's his confidence. \"Before, I hid in the kitchen. Now I go to the tables and start the conversation.\"\n\nWhat's next? \"I'm going to start a B1 course in January,\" he says. \"If I pass the next exam, I'll put an English menu online and advertise to international customers. I'm proud of my progress, and I want to achieve more.\"", "questions": [{"q": "Why did Marco start English lessons?", "options": ["He couldn't talk to his tourist customers", "He wanted to move to England", "His children asked him to"], "answer": 0, "why": "\"Many of his customers were tourists, but he couldn't talk to them.\""}, {"q": "What short tasks did his teacher give him?", "options": ["One long essay a week", "Five new words a day and a one-minute voice note", "A grammar test every lesson"], "answer": 1, "why": "\"five new words a day and a one-minute voice note.\""}, {"q": "How many words has Marco learned?", "options": ["About 200", "Exactly 500", "More than 800"], "answer": 2, "why": "\"He has learned more than 800 words.\""}, {"q": "According to the text, what is Marco's biggest change?", "options": ["His confidence", "His grammar", "His restaurant"], "answer": 0, "why": "\"His biggest change is not his grammar. It's his confidence.\""}, {"q": "What will he do if he passes the next exam?", "options": ["Close the restaurant", "Put an English menu online and advertise", "Start Italian lessons"], "answer": 1, "why": "\"If I pass the next exam, I'll put an English menu online and advertise...\""}], "find": [{"meaning": "speaking a language easily and well", "word": "fluent"}, {"meaning": "feeling good about something you did", "word": "proud"}, {"meaning": "to reach a goal after working hard", "word": "achieve"}]}, "listen": {"title": "End-of-course review", "situation": "A teacher, Mr Hall, and his student, Lena, are talking about Lena's progress after twelve weeks of lessons.", "speakers": {"A": {"name": "Mr Hall", "accent": "en-GB"}, "B": {"name": "Lena", "accent": "en-IE"}}, "lines": [{"who": "A", "text": "So, Lena, it's our last week. How do you feel about your English now?"}, {"who": "B", "text": "Much better! Twelve weeks ago I was very nervous. I didn't want to speak at all."}, {"who": "A", "text": "I remember. In our first lesson, you answered every question in two words."}, {"who": "B", "text": "Yes! Now I can talk for two or three minutes without stopping. I've learned so many new words."}, {"who": "A", "text": "What was the most difficult thing for you?"}, {"who": "B", "text": "The present perfect. I always said 'I am here since two years.' But now I say 'I've been here for two years.'"}, {"who": "A", "text": "Exactly. That mistake has almost disappeared. What about your work?"}, {"who": "B", "text": "Last month I had my first English-speaking client. I was a bit scared, but the lesson went really well."}, {"who": "A", "text": "That's fantastic. You should be proud. So, what's your next step?"}, {"who": "B", "text": "I'm going to make a profile on a teaching platform. If I get five new students by March, I'll start a B2 course."}, {"who": "A", "text": "That's a clear goal. And please keep your daily habit: ten minutes a day."}, {"who": "B", "text": "I will. Thank you for everything. I'll send you a message as soon as I get my first student from the platform."}], "questions": [{"q": "How did Lena feel twelve weeks ago?", "options": ["Very nervous", "Very confident", "Bored"], "answer": 0, "why": "\"Twelve weeks ago I was very nervous.\""}, {"q": "What was the most difficult grammar for Lena?", "options": ["The past continuous", "The present perfect", "Comparatives"], "answer": 1, "why": "\"The present perfect.\""}, {"q": "What happened last month?", "options": ["She passed an exam", "She stopped teaching", "She had her first English-speaking client"], "answer": 2, "why": "\"Last month I had my first English-speaking client.\""}, {"q": "What will Lena do if she gets five new students by March?", "options": ["Start a B2 course", "Open a school", "Move abroad"], "answer": 0, "why": "\"If I get five new students by March, I'll start a B2 course.\""}, {"q": "What does Mr Hall ask her to keep doing?", "options": ["Write an essay every week", "Her daily habit of ten minutes a day", "Come to lessons on Saturday"], "answer": 1, "why": "\"please keep your daily habit: ten minutes a day.\""}]}, "accents": {"sentences": [{"text": "Twelve weeks ago I was very nervous.", "accent": "en-GB"}, {"text": "I've learned so many new words since September.", "accent": "en-US"}, {"text": "Now I can talk for three minutes without stopping.", "accent": "en-IE"}, {"text": "I'm going to make a profile on a teaching platform.", "accent": "en-AU"}, {"text": "If I pass the next exam, I'll advertise online.", "accent": "en-IN"}, {"text": "His biggest change is his confidence.", "accent": "en-ZA"}]}, "speak": {"prompts": [{"task": "Describe your progress: past (12 weeks ago), present (now), and future (next 3 months). Use four different tenses.", "model": "Twelve weeks ago, I was nervous about speaking English, and I made a lot of mistakes. Now I feel much more confident. I've learned about two hundred words, and I've written my tutor profile in English. At the moment, I'm practising my video introduction. Next, I'm going to put my profile on a platform, and if I get new students, I'll be very happy.", "checklist": ["I used past simple, present perfect, present continuous and future", "I used time words (ago / now / next)", "I spoke for one to two minutes"]}, {"task": "Talk about your three most common mistakes and how you correct them now.", "model": "My first mistake was 'he' and 'she', because in Turkish we have only one word. Now I stop and think before I speak. My second mistake was forgetting 'the' and 'a'. My third mistake was the present perfect. I said 'I live here since 2015', but now I say 'I've lived here since 2015'.", "checklist": ["I named three mistakes", "I gave the correct form for each", "I used 'now' to show my progress"]}, {"task": "Record your 60-second video introduction for your tutor profile.", "model": "Hello! My name is ... and I'm a Russian teacher from Antalya. I've taught Russian for many years, and I love helping adults speak with confidence. In my lessons, we speak a lot, and I plan every lesson for your goals: travel, work or study. I'm patient, flexible and organised. If you book a trial lesson, I'll show you how easy Russian can be. See you soon!", "checklist": ["I spoke for about 60 seconds", "I smiled and spoke slowly", "I ended with an invitation"]}], "shadow": ["Twelve weeks ago I was very nervous.", "Now I can talk for two or three minutes without stopping.", "If I get five new students, I'll start a new course."]}, "conf": {"minute_topics": ["How your English changed in this course", "The bravest thing you did in English", "Your favourite game from our lessons", "What you will practise after this course", "Advice for a new student at the start of this course"], "lifesavers": ["Looking back, …", "The biggest change is …"], "win": "Today I can describe my progress from the past, to now, to the future."}}, {"n": 36, "focus": "Final Assessment & Celebration", "classwork": ["Send the final tutor profile and the 60-second video to the teacher.", "Upload the video and profile to a teaching platform or her website when she is ready.", "Keep a daily 10-minute English habit: voice notes, shadowing, flashcards."], "read": {"title": "How to make a great tutor video", "text": "On most teaching platforms, students watch your video before they book a lesson. A good video can bring you many new students. A bad one can stop them. Here are some tips to help you make a video you're proud of.\n\nKeep it short. Sixty to ninety seconds is enough. Students are busy, and they won't watch a long video unless it's really interesting.\n\nStart with a smile and say hello in the language you teach. Then switch to English, so every student understands you. Say who you are, how long you've taught, and who your lessons are for.\n\nShow your personali function streak(){ let s = 0, d = new Date(); for(;;){ const k = d.toISOString().slice(0,10); if (!days.has(k)) break; s++; d.setDate(d.getDate()-1); } return s; }
const allLessons = HW.weeks.flatMap(w => w.lessons.map(L => ({...L, week: w})));

/* ---------- speech ---------- */
let voices = [];
const loadVoices = () => { try{ voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); }catch(e){ voices = []; } };
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = () => {
  const before = voices.length; loadVoices();
  if (voices.length !== before && (tab === 'listen' || tab === 'accents') && typeof renderStage === 'function') renderStage(); }; }
const norm = l => l.replace('_','-').toLowerCase();
function voiceFor(accent, avoid){
  const want = voices.filter(v => norm(v.lang) === accent.toLowerCase());
  const pick = want.find(v => v.name !== avoid) || want[0];
  if (pick) return {v: pick, exact: true};
  const any = voices.find(v => v.name !== avoid) || voices[0];
  return {v: any, exact: false};
}
const hasAccent = a => voices.some(v => norm(v.lang) === a.toLowerCase());
let rate = store.get('hw-rate', 0.9);
function say(text, accent='en-GB', opts={}){
  return new Promise(res => {
    if (!('speechSynthesis' in window)) return res();
    const u = new SpeechSynthesisUtterance(text);
    const {v} = voiceFor(accent, opts.avoid);
    if (v){ u.voice = v; u.lang = v.lang; } else u.lang = accent;
    u.rate = opts.rate || rate; if (opts.pitch) u.pitch = opts.pitch;
    u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
  });
}
const stopSpeech = () => { try{ speechSynthesis.cancel(); }catch(e){} };
